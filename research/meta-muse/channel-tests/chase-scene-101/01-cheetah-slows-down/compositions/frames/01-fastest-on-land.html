    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "01-fastest-on-land";
        var DUR = 7.839;

        // seeded PRNG (deterministic wobble / jitter)
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(20131);
        function j(n) { return (rnd() * 2 - 1) * n; }

        // ---- ink-wipe clip polygons (ragged leading edge) ----
        var edgeJ = [];
        for (var k = 0; k <= 8; k++) edgeJ.push(j(3.5));
        function wipePoly(x) {
          var pts = ["-2% -2%"];
          for (var i = 0; i <= 8; i++) {
            pts.push((x + edgeJ[i]).toFixed(2) + "% " + (-2 + i * 13).toFixed(2) + "%");
          }
          pts.push("-2% 102%");
          return "polygon(" + pts.join(", ") + ")";
        }
        var wipeFrom = wipePoly(45);
        var wipeTo = wipePoly(108);

        // ---- GPS trail polyline (samples) ----
        var samples = [];
        var N = 9;
        var x0 = -40, y0 = 1112, x1 = 292, y1 = 1034;
        for (var s = 0; s < N; s++) {
          var u = s / (N - 1);
          var xx = x0 + (x1 - x0) * u;
          var yy = y0 + (y1 - y0) * (1 - Math.pow(1 - u, 1.6)) + (s > 0 && s < N - 1 ? j(7) : 0);
          samples.push([xx, yy]);
        }
        var trailD = "M" + samples.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L");
        var cum = [0];
        for (var q = 1; q < samples.length; q++) {
          var dx = samples[q][0] - samples[q - 1][0];
          var dy = samples[q][1] - samples[q - 1][1];
          cum.push(cum[q - 1] + Math.sqrt(dx * dx + dy * dy));
        }
        var trailLen = cum[cum.length - 1];

        var trailLine = document.getElementById("f01-trail-line");
        var trailReveal = document.getElementById("f01-trail-reveal");
        trailLine.setAttribute("d", trailD);
        trailReveal.setAttribute("d", trailD);
        trailReveal.setAttribute("stroke-dasharray", trailLen.toFixed(1) + " " + (trailLen + 40).toFixed(1));

        var dotsG = document.getElementById("f01-trail-dots");
        var SVGNS = "http://www.w3.org/2000/svg";
        var dotEls = [];
        for (var d = 1; d < samples.length - 1; d++) {
          var c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("cx", samples[d][0].toFixed(1));
          c.setAttribute("cy", samples[d][1].toFixed(1));
          c.setAttribute("r", "6");
          c.setAttribute("fill", "#C2412D");
          c.setAttribute("id", "f01-trail-dot-" + d);
          dotsG.appendChild(c);
          dotEls.push({ el: c, at: cum[d] / trailLen });
        }
        var end = samples[samples.length - 1];
        ["f01-trail-ring", "f01-trail-head"].forEach(function (id) {
          var el = document.getElementById(id);
          el.setAttribute("cx", end[0].toFixed(1));
          el.setAttribute("cy", end[1].toFixed(1));
        });

        // ---- leader line (hand-drawn wobble) ----
        var la = [770, 418], lb = [872, 556];
        var lpts = [];
        var LN = 7;
        for (var m = 0; m <= LN; m++) {
          var t = m / LN;
          // gentle curve: bow outward to the right
          var bx = la[0] + (lb[0] - la[0]) * t + Math.sin(t * Math.PI) * 46;
          var by = la[1] + (lb[1] - la[1]) * t;
          if (m > 0 && m < LN) { bx += j(3); by += j(3); }
          lpts.push([bx, by]);
        }
        var leaderD = "M" + lpts[0][0].toFixed(1) + " " + lpts[0][1].toFixed(1);
        for (var n = 1; n < lpts.length; n++) {
          var pm = lpts[n - 1], pc = lpts[n];
          var mx = (pm[0] + pc[0]) / 2, my = (pm[1] + pc[1]) / 2;
          leaderD += " Q" + pm[0].toFixed(1) + " " + pm[1].toFixed(1) + " " + mx.toFixed(1) + " " + my.toFixed(1);
        }
        leaderD += " L" + lb[0] + " " + lb[1];
        var leaderLine = document.getElementById("f01-leader-line");
        leaderLine.setAttribute("d", leaderD);
        var leaderLen = 0;
        for (var r = 1; r < lpts.length; r++) {
          var ddx = lpts[r][0] - lpts[r - 1][0], ddy = lpts[r][1] - lpts[r - 1][1];
          leaderLen += Math.sqrt(ddx * ddx + ddy * ddy);
        }
        leaderLen = Math.ceil(leaderLen * 1.15) + 20;
        leaderLine.setAttribute("stroke-dasharray", leaderLen + " " + leaderLen);
        // arrow tip: two short strokes at lb, pointing down-left toward the face
        var tip = document.getElementById("f01-leader-tip");
        tip.setAttribute("d", "M" + (lb[0] - 14) + " " + (lb[1] - 20) + " L" + lb[0] + " " + lb[1] + " L" + (lb[0] + 14) + " " + (lb[1] - 18));
        tip.setAttribute("stroke-dasharray", "60 60");

        // ---- timeline ----
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–2.8): wash blooms, ink wipe reveals plate, specimen label slides up
        tl.fromTo("#f01-wash", { opacity: 0.6, scale: 0.94 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0);
        tl.fromTo("#f01-plate", { clipPath: wipeFrom, opacity: 0.85 }, { clipPath: wipeTo, opacity: 1, duration: 0.55, ease: "power2.out" }, 0);
        tl.fromTo("#f01-label", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
        tl.fromTo("#f01-label .f01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.85);

        // Scene 2 (2.8–4.4): hand-written note writes on, leader line draws to the cheetah
        tl.fromTo("#f01-note-1", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power1.inOut" }, 2.85);
        tl.fromTo("#f01-note-2", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.95, ease: "power1.inOut" }, 3.35);
        tl.fromTo(leaderLine, { strokeDashoffset: leaderLen }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, 3.95);
        tl.fromTo(tip, { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.2, ease: "power1.out" }, 4.45);

        // Scene 3 (4.4–7.84): telemetry trail draws behind the hind feet, then slow 2% push-in hold
        var TR0 = 4.5, TRD = 1.5;
        tl.fromTo(trailReveal, { strokeDashoffset: trailLen }, { strokeDashoffset: 0, duration: TRD, ease: "none" }, TR0);
        dotEls.forEach(function (o) {
          tl.fromTo(o.el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, TR0 + TRD * o.at - 0.04);
        });
        tl.fromTo("#f01-trail-head", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", transformOrigin: "50% 50%" }, TR0 + TRD - 0.05);
        tl.fromTo("#f01-trail-ring", { opacity: 0, scale: 0.5 }, { opacity: 0.9, scale: 1, duration: 0.6, ease: "power2.out", transformOrigin: "50% 50%" }, TR0 + TRD + 0.05);

        tl.fromTo("#f01-stage", { scale: 1 }, { scale: 1.02, duration: DUR - 4.5, ease: "sine.inOut" }, 4.5);

        // pad the timeline to the full frame length
        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
