      // Seeded PRNG (deterministic) for the hunt trace wiggle + leader wobble.
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);

      // ---------- Gauge geometry (0–60 mph semicircle) ----------

      q("#f03-ring-inner").setAttribute("d", arcD(290, 0, 60));
      q("#f03-progress").setAttribute("d", arcD(306, 0, 58));

          x1: f(a[0]), y1: f(a[1]), x2: f(b[0]), y2: f(b[1]),
          "stroke-width": major ? 3 : 2,
          style: "stroke:" + (major ? "#2B2118" : "#5C4A36")
        }, ticksG);
        if (major) {
          var p = pt(s, 395);
          var tx = mk("text", {
            class: "f03-dial-num",
            x: f(p[0]), y: f(p[1] + 17),
            "text-anchor": "middle"
          }, numsG);
          tx.textContent = String(s);
        }
      }
      // telemetry marker at 58 (outside the arc, pointing in)
      var m0 = pt(58, 358), m1 = pt(57.1, 384), m2 = pt(58.9, 384);
      q("#f03-mark58").setAttribute("d",
        "M " + f(m0[0]) + " " + f(m0[1]) + " L " + f(m1[0]) + " " + f(m1[1]) + " L " + f(m2[0]) + " " + f(m2[1]) + " Z");

      // ---------- Chart geometry ----------
      var X0 = 180, X1 = 990, Y0 = 1440, YT = 1100;
      var PXS = 81;                 // px per second (0–10 s)
      var PXM = (Y0 - YT) / 60;     // px per mph (0–60 mph)
      function xs(t) { return X0 + t * PXS; }
      function ys(v) { return Y0 - v * PXM; }

      var gridG = q("#f03-grid"), aTicks = q("#f03-axis-ticks"), aNums = q("#f03-axis-nums");
      [20, 40].forEach(function (v) {
        mk("line", { class: "f03-hair f03-gridline", x1: X0, y1: f(ys(v)), x2: X1, y2: f(ys(v)), style: "stroke-width:1.5" }, gridG);
      });
      [0, 20, 40, 60].forEach(function (v) {
        mk("line", { class: "f03-ink f03-atick", x1: X0 - 10, y1: f(ys(v)), x2: X0, y2: f(ys(v)), "stroke-width": 2.5 }, aTicks);

        t.textContent = String(v);
      });

        var t = mk("text", { class: "f03-axis-num", x: f(xs(sec)), y: Y0 + 42, "text-anchor": "middle" }, aNums);
        t.textContent = String(sec);

        mk("line", { class: "f03-tel f03-dash", x1: f(dx), y1: f(yTop), x2: f(dx + 16), y2: f(yTop), "stroke-width": 4, style: "stroke-linecap:butt" }, dashG);

      // Hunt trace (Lea) — shape redrawn from Wilson et al. 2013 Fig. 2e:
      // ~2 s acceleration to ~14–16 m/s (≈31–36 mph), ~5 s plateau with small

      var knots = [];

      var ph1 = rand() * 6.2832, ph2 = rand() * 6.2832;
      function noise(t) {
        var k = t / 0.45, i0 = Math.floor(k), fr = k - i0, u = (1 - Math.cos(Math.PI * fr)) / 2;
        return knots[i0] * (1 - u) + knots[i0 + 1] * u;
      }
      function env(t) {
        if (t < 2) { var u = t / 2; return 1 - Math.pow(1 - u, 2.2); }
        if (t < 7) return 1;
        if (t < 8.2) { var w = (t - 7) / 1.2; return (1 + Math.cos(Math.PI * w)) / 2; }
        return 0;
      }
      function speed(t) {
        var wig = 1.2 * Math.sin(2 * Math.PI * 0.55 * t + ph1) + 0.8 * Math.sin(2 * Math.PI * 1.3 * t + ph2) + 0.9 * noise(t);
        return 1.5 + env(t) * (31.5 + wig);
      }

        var tt = n * 0.05;

      // annotation leader: from the note up to the plateau line

      var cxw = lx + (rand() - 0.5) * 26;
      q("#f03-leader").setAttribute("d",
        "M " + f(lx - 4) + " " + f(lyStart) + " Q " + f(cxw) + " " + f((lyStart + lyEnd) / 2) + " " + f(lx + 3) + " " + f(lyEnd));
      q("#f03-arrow").setAttribute("d",
        "M " + f(lx - 7) + " " + f(lyEnd + 13) + " L " + f(lx + 3) + " " + f(lyEnd) + " L " + f(lx + 12) + " " + f(lyEnd + 12));

      // ---------- Stroke-draw setup (measured lengths) ----------
      function prep(el) {
        var len = el.getTotalLength() * 1.02;
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = len;

      }

      // On "fifty-eight": needle sweep + red progress arc + count-up, one shared ease

      tl.fromTo("#f03-needle", { rotation: 0, svgOrigin: CX + " " + CY }, { rotation: 174, svgOrigin: CX + " " + CY, duration: SWEEP, ease: SWEEP_EASE }, SWEEP_AT);
      tl.fromTo(progEl, { strokeDashoffset: progLen }, { strokeDashoffset: 0, duration: SWEEP, ease: SWEEP_EASE }, SWEEP_AT);

      var countEl = q("#f03-count");
      var state = { v: 0 };

        v: 58, duration: SWEEP, ease: SWEEP_EASE,
        onUpdate: function () { countEl.textContent = String(Math.round(state.v)); }
      }, SWEEP_AT);
      tl.fromTo(countEl, { scale: 0.5 }, { scale: 1, duration: SWEEP, ease: SWEEP_EASE }, SWEEP_AT);
      tl.fromTo("#f03-unit", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, SWEEP_AT + SWEEP);

      tl.fromTo(ayEl, { strokeDashoffset: ayLen }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, S2);

      tl.fromTo(qa(".f03-atick"), { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.03, ease: "power1.out" }, S2 + 0.15);
      tl.fromTo(qa(".f03-axis-num"), { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04, ease: "power1.out" }, S2 + 0.2);
      tl.fromTo(["#f03-unit-y", "#f03-unit-x"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, S2 + 0.35);

      var dashes = qa(".f03-dash");
      tl.fromTo(dashes, { opacity: 0 }, { opacity: 1, duration: 0.1, stagger: 0.5 / dashes.length, ease: "none" }, S2 + 0.12);
      tl.fromTo("#f03-toplabel", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, S2 + 0.4);

      // hunt trace draws left→right with a pen dot at its tip
      var TR_AT = 3.9, TR_DUR = 1.75;
      var pen = q("#f03-pen");
      var pstate = { p: 0 };
      tl.fromTo(pen, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, TR_AT);
      tl.fromTo(pstate, { p: 0 }, {
        p: 1, duration: TR_DUR, ease: "sine.inOut",
        onUpdate: function () {
          var l = traceLen * pstate.p;
          trace.style.strokeDashoffset = traceLen - l;
          var pt2 = trace.getPointAtLength(l);

          pen.setAttribute("cy", pt2.y.toFixed(2));
