  <div

  >
    <!-- Track 0: paper ground -->
    <div id="f04-paper" class="clip" data-start="0" data-duration="5.651" data-track-index="0"></div>

    <!-- Track 1: content stage -->
    <div id="f04-stage" class="clip" data-start="0" data-duration="5.651" data-track-index="1">
      <svg id="f04-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <!-- compass-drafted turn-radius rings (supporting) -->
        <circle id="f04-ring-a" cx="690" cy="1040" r="172" fill="none" stroke="#B9A98C" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
        <circle id="f04-ring-b" cx="390" cy="1260" r="172" fill="none" stroke="#B9A98C" stroke-width="2" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" />
        <circle id="f04-ring-a-dot" cx="690" cy="1040" r="6" fill="#B9A98C" />

        <!-- the focal ink line: straight, then bends into the S-turns -->

      <!-- Beat 1 statement -->

          <span class="f04-w f04-wb">the</span>
          <span class="f04-w f04-wb"><span class="f04-red">turns</span>.<svg id="f04-underline" viewBox="0 0 100 34" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path id="f04-underline-path" d="M4,20 C22,14 40,24 58,17 C72,12 84,19 78,22" fill="none" stroke="#C2412D" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" /></svg></span>
        </div>

  <script>
    (function () {
      var FRAME_ID = "04-won-in-the-turns";
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      // ---- Line geometry: a constant-length "rope" whose curvature scales with alpha ----
      // alpha = 0 -> perfectly straight (bleeds off both edges); alpha = 1 -> tight S switchback.
      var CX = 540;
      var CY = 1120;
      var R = 125; // turn radius at full bend
      var RUN = 580; // entry / exit run length
      var MID = 300; // middle run length
      var ARC = Math.PI * R;
      var L = 2 * RUN + MID + 2 * ARC; // total length (constant through the morph)
      var N = 240;
      var DS = L / N;

      // Target heading profile (screen coords, y down; heading 0 = rightward).
      function heading(s) {
        var s1 = RUN;
        var s2 = s1 + ARC;
        var s3 = s2 + MID;
        var s4 = s3 + ARC;
        if (s <= s1) return 0;
        if (s <= s2) return (Math.PI * (s - s1)) / ARC;
        if (s <= s3) return Math.PI;
        if (s <= s4) return Math.PI - (Math.PI * (s - s3)) / ARC;
        return 0;
      }

      // Integrate from the anchored midpoint outward in both directions (point-symmetric shape).
      function points(alpha) {
        var half = N / 2;
        var pts = new Array(N + 1);
        pts[half] = [CX, CY];
        var x = CX;
        var y = CY;
        var i, th;
        for (i = half; i < N; i++) {
          th = alpha * heading((i + 0.5) * DS);
          x += Math.cos(th) * DS;
          y += Math.sin(th) * DS;
          pts[i + 1] = [x, y];
        }
        x = CX;
        y = CY;
        for (i = half; i > 0; i--) {
          th = alpha * heading((i - 0.5) * DS);
          x -= Math.cos(th) * DS;
          y -= Math.sin(th) * DS;
          pts[i - 1] = [x, y];
        }
        return pts;
      }

      function pathD(alpha) {
        var pts = points(alpha);
        var d = "M" + pts[0][0].toFixed(2) + "," + pts[0][1].toFixed(2);
        for (var i = 1; i < pts.length; i++) {
          d += " L" + pts[i][0].toFixed(2) + "," + pts[i][1].toFixed(2);
        }
        return d;
      }

      var ink = q("#f04-ink");
      ink.setAttribute("d", pathD(0));
      ink.setAttribute("stroke-dasharray", L.toFixed(2) + " " + L.toFixed(2));
      ink.setAttribute("stroke-dashoffset", L.toFixed(2));

      // Place the turn-radius rings on the exact centres of the final turns.
      var finalPts = points(1);
      var iA = Math.round(RUN / DS); // start of turn 1 (heading 0, turning down)
      var iB = Math.round((RUN + ARC + MID) / DS); // start of turn 2 (heading pi, turning down)
      var cA = [finalPts[iA][0], finalPts[iA][1] + R];
      var cB = [finalPts[iB][0], finalPts[iB][1] + R];
      ["#f04-ring-a", "#f04-ring-a-dot"].forEach(function (s) {
        q(s).setAttribute("cx", cA[0].toFixed(2));
        q(s).setAttribute("cy", cA[1].toFixed(2));
      });
      ["#f04-ring-b", "#f04-ring-b-dot"].forEach(function (s) {
        q(s).setAttribute("cx", cB[0].toFixed(2));
        q(s).setAttribute("cy", cB[1].toFixed(2));
      });

      // Pen-head positions along the straight line where it enters / leaves the canvas.
      var sEnter = L / 2 - CX - 20;
      var sExit = L / 2 + (1080 - CX) + 20;

      var tl = gsap.timeline({ paused: true });

      // Documentary push-in under the whole shot (gentle ~3%).
      tl.fromTo("#f04-stage", { scale: 1 }, { scale: 1.03, duration: 5.151, ease: "sine.inOut" }, 0);

      // ---- Scene 1 (0.0–2.95s): straight ink line draws left -> right; statement writes on ----
      tl.fromTo(
        ink,
        { attr: { "stroke-dashoffset": L - sEnter } },
        { attr: { "stroke-dashoffset": L - sExit }, duration: 1.9, ease: "power1.inOut" },
        0.1
      );
      // head is off-canvas right: complete the (off-screen) remainder so the bend has the full rope
      tl.set(ink, { attr: { "stroke-dashoffset": 0 } }, 2.05);

      // "not won on / the straight." — per-word ink write-on, synced to the voice
      var wa = qa(".f04-wa");
      var waTimes = [0.9, 1.45, 1.72, 1.98, 2.22];
      wa.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 22, clipPath: "inset(-30% 100% -30% 0%)" },
          { opacity: 1, y: 0, clipPath: "inset(-30% -8% -30% 0%)", duration: 0.5, ease: "power2.out" },
          waTimes[i]
        );
      });

      // ---- Scene 2 (2.95–5.15s): "It's won in the turns" — line bends into the S; text cross-dissolves ----
      var bend = { a: 0 };
      tl.fromTo(
        bend,
        { a: 0 },
        {
          a: 1,
          duration: 1.25,
          ease: "power2.inOut",
          onUpdate: function () {
            ink.setAttribute("d", pathD(bend.a));
          },
        },
        2.95
      );

      // outgoing statement dissolves (in-frame text swap)
      tl.fromTo("#f04-text-a", { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.45, ease: "power1.in" }, 2.9);

      // incoming statement: "won in / the turns."
      var wb = qa(".f04-wb");
      var wbTimes = [3.22, 3.52, 3.74, 3.92];
      wb.forEach(function (el, i) {
        tl.fromTo(
          el,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          wbTimes[i]
        );
      });

      // supporting: compass-drafted turn-radius rings self-draw as the turns tighten
      tl.fromTo("#f04-ring-a", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 3.9);
      tl.fromTo("#f04-ring-b", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 4.05);
      tl.fromTo(["#f04-ring-a-dot", "#f04-ring-b-dot"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out", stagger: 0.15 }, 4.0);

      // payoff: telemetry-red hand-drawn underline beneath "turns"
      tl.fromTo("#f04-underline-path", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, 4.3);

      // hold to the end (no exit — the root transition is the exit)

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
