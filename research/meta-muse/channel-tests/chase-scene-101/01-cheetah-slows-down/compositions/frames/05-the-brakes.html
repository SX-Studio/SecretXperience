  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var D = 13.833;
      var tl = gsap.timeline({ paused: true });

      // ---------- analytic path geometry (no layout reads) ----------
      // Impala: M300,1180 L300,760 A70 -> 370,690 L972,690
      var IM_V = 420, IM_R = 70, IM_A = Math.PI * IM_R / 2, IM_H = 602, IM_L = IM_V + IM_A + IM_H;
      function impalaAt(s) {
        if (s <= IM_V) return [300, 1180 - s];
        if (s <= IM_V + IM_A) {
          var th = Math.PI + ((s - IM_V) / IM_A) * (Math.PI / 2);
          return [370 + IM_R * Math.cos(th), 760 + IM_R * Math.sin(th)];
        }
        return [370 + (s - IM_V - IM_A), 690];
      }
      // Braking cheetah: M380,1300 L380,830 A60 -> 440,770 L915,770
      var BR_V = 470, BR_R = 60, BR_A = Math.PI * BR_R / 2, BR_H = 475, BR_L = BR_V + BR_A + BR_H;
      function brakeAt(s) {
        if (s <= BR_V) return [380, 1300 - s];
        if (s <= BR_V + BR_A) {
          var th = Math.PI + ((s - BR_V) / BR_A) * (Math.PI / 2);
          return [440 + BR_R * Math.cos(th), 830 + BR_R * Math.sin(th)];
        }
        return [440 + (s - BR_V - BR_A), 770];
      }
      function dot(parent, x, y, color) {
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", "8");
        c.setAttribute("fill", "#EFE6D2");
        c.setAttribute("stroke", color);
        c.setAttribute("stroke-width", "4.5");
        parent.appendChild(c);
        return c;
      }

      // ---------- camera: slow documentary push-in across the whole shot ----------
      tl.fromTo("#f05-cam", { scale: 1 }, { scale: 1.02, duration: D, ease: "sine.inOut" }, 0);

      // ---------- Scene 1 (0.0–3.0): impala swerves, full-speed cheetah overshoots ----------
      tl.fromTo("#f05-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.0);
      tl.fromTo("#f05-title", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.1);
      tl.fromTo("#f05-wash", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.4, ease: "power2.out" }, 0.0);
      tl.fromTo("#f05-plate", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: "power2.inOut" }, 0.15);
      tl.fromTo("#f05-latin", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.9);

      // impala path self-draws at a steady pace; sample dots drop as the head passes
      var imStart = 0.2, imDur = 1.3;
      tl.fromTo("#f05-impala", { opacity: 0 }, { opacity: 1, duration: 0.05 }, imStart);
      tl.fromTo("#f05-impala", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: imDur, ease: "none" }, imStart);
      var imDots = document.getElementById("f05-impala-dots");
      for (var i = 0; i * 94 <= IM_L - 30; i++) {
        var s = i * 94;
        var p = impalaAt(s);
        var d = dot(imDots, p[0], p[1], "#6E7B4E");
        tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, imStart + (s / IM_L) * imDur);
      }
      tl.fromTo("#f05-impala-arrow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, imStart + imDur - 0.05);
      tl.fromTo("#f05-lab-impala", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.35);

      // full-speed cheetah: dashed track revealed by a self-drawing mask, constant fast pace
      var fsStart = 0.9, fsDur = 1.5;
      tl.fromTo("#f05-fast-g", { opacity: 0 }, { opacity: 1, duration: 0.05 }, fsStart);
      tl.fromTo("#f05-fast-reveal", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: fsDur, ease: "none" }, fsStart);
      tl.fromTo("#f05-fast-arrow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, fsStart + fsDur - 0.05);
      tl.fromTo("#f05-lab-fast", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.9);

      // field note writes on, leader line draws to the wide arc
      tl.fromTo("#f05-note-fast", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: "power1.inOut" }, 2.2);
      tl.fromTo("#f05-lead-fast", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 2.75);
      tl.fromTo("#f05-lead-fast", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.75);

      // ---------- Scene 2 (3.0–6.2): braking cheetah — head slows into the corner ----------
      // Sample positions at equal time steps: spacing shrinks before the corner (braking), then opens up.
      var BS = [0, 100, 190, 270, 340, 398, 442, 474, 498, 520, 545, 575, 620, 690, 780, 880, 980, BR_L];
      var brStart = 3.2, dt = 0.15;
      tl.fromTo("#f05-brake", { opacity: 0 }, { opacity: 1, duration: 0.05 }, brStart);
      var brDots = document.getElementById("f05-brake-dots");
      var ticks = document.getElementById("f05-ticks");
      for (var k = 0; k < BS.length; k++) {
        var t = brStart + k * dt;
        if (k < BS.length - 1) {
          tl.fromTo("#f05-brake",
            { strokeDashoffset: 1 - BS[k] / BR_L },
            { strokeDashoffset: 1 - BS[k + 1] / BR_L, duration: dt, ease: "none", immediateRender: k === 0 },
            t);
        }
        if (k < BS.length - 1) {
          var bp = brakeAt(BS[k]);
          var bd = dot(brDots, bp[0], bp[1], "#C2412D");
          tl.fromTo(bd, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, t);
          // brake ticks (skid marks) on the straight run-in where the cheetah sheds speed
          if (BS[k] >= 270 && BS[k] < BR_V) {
            var tg = document.createElementNS(NS, "g");
            var y = (1300 - BS[k]).toFixed(1);
            [[344, 360], [400, 416]].forEach(function (xx) {
              var ln = document.createElementNS(NS, "line");
              ln.setAttribute("x1", xx[0]); ln.setAttribute("x2", xx[1]);
              ln.setAttribute("y1", y); ln.setAttribute("y2", y);
              ln.setAttribute("stroke", "#C2412D");
              ln.setAttribute("stroke-width", "4");
              ln.setAttribute("stroke-linecap", "round");
              tg.appendChild(ln);
            });
            ticks.appendChild(tg);
            tl.fromTo(tg, { opacity: 0 }, { opacity: 0.85, duration: 0.15, ease: "power1.out" }, t + 0.04);
          }
        }
      }
      var brEnd = brStart + (BS.length - 1) * dt;
      tl.fromTo("#f05-brake-arrow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, brEnd - 0.05);
      tl.fromTo("#f05-note-brake", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, 4.75);
      tl.fromTo("#f05-lead-brake", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 5.3);
      tl.fromTo("#f05-lead-brake", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 5.3);
      tl.fromTo("#f05-lab-brake", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.55);

      // ---------- Scene 3 (6.2–13.83): diagram eases up, ~70% lands, sources ----------
      tl.fromTo("#f05-diagram", { scale: 1, y: 0 }, { scale: 0.84, y: -20, duration: 1.3, ease: "power2.inOut" }, 6.3);

      var stat = document.getElementById("f05-stat");
      var cnt = { v: 0 };
      tl.fromTo("#f05-stat", { opacity: 0, y: 24, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 8.6);
      tl.fromTo(cnt, { v: 0 }, {
        v: 70, duration: 0.9, ease: "power2.out",
        onUpdate: function () { stat.textContent = "~" + Math.round(cnt.v) + "%"; }
      }, 8.6);
      tl.fromTo("#f05-stat-note", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 9.9);
      tl.fromTo("#f05-source", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.8);
      tl.fromTo("#f05-illus", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 11.2);

      // hold to the full duration
      tl.set({}, {}, D);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-the-brakes"] = tl;
    })();
  </script>
