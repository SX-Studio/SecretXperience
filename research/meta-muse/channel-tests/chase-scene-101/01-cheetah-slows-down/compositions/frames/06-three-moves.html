  <script>
    (function () {
      var ID = "06-three-moves";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var PAPER = "#EFE6D2";
      var INK = "#2B2118";
      var RED = "#C2412D";
      var CLIP_HIDE = "inset(0% 100% 0% 0%)";
      var CLIP_SHOW = "inset(0% 0% 0% 0%)";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // macro: gentle documentary push-in under the whole shot (origin keeps arrow above the caption band)
      tl.fromTo(
        q("#f06-stage"),
        { scale: 1, transformOrigin: "540px 1000px" },
        { scale: 1.02, transformOrigin: "540px 1000px", duration: 4.297, ease: "sine.inOut" },
        0
      );

      // helpers
      function drawPath(sel, len, start, dur, ease) {
        tl.fromTo(q(sel), { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease }, start);
      }
      function writeOn(sel, start, dur, ease) {
        tl.fromTo(
          q(sel),
          { clipPath: CLIP_HIDE, x: -14, opacity: 0.4 },
          { clipPath: CLIP_SHOW, x: 0, opacity: 1, duration: dur, ease: ease || "power2.out" },
          start
        );
      }
      function waypoint(n, discAt, ringAt) {
        tl.fromTo(q("#f06-disc" + n), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, discAt);
        tl.fromTo(
          q("#f06-ring" + n),
          { strokeDashoffset: 352, stroke: RED },
          { strokeDashoffset: 0, stroke: RED, duration: 0.4, ease: "power2.inOut" },
          ringAt
        );
      }
      function lightUp(n, at) {
        tl.fromTo(
          q("#f06-lit" + n),
          { opacity: 0, scale: 0.55, transformOrigin: "50% 50%" },
          { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.32, ease: "power2.out" },
          at
        );
        tl.fromTo(
          q("#f06-num" + n),
          { opacity: 0, fill: PAPER },
          { opacity: 1, fill: PAPER, duration: 0.25, ease: "power1.out" },
          at + 0.06
        );
      }
      function settleDown(n, at) {
        // step stays, its light passes on: red disc fades back to paper, ring + numeral go to ink
        tl.to(q("#f06-lit" + n), { opacity: 0, duration: 0.35, ease: "power2.inOut" }, at);
        tl.to(q("#f06-num" + n), { fill: INK, duration: 0.35, ease: "power2.inOut" }, at);
        tl.to(q("#f06-ring" + n), { stroke: INK, duration: 0.35, ease: "power2.inOut" }, at);
      }

      // every later entrance below is a fromTo (immediateRender), so its hidden start state is
      // applied at build time and on any seek before its start — no CSS-hidden states needed.

      // sample dots appear as the drawing head passes them
      root.querySelectorAll(".f06-dot").forEach(function (el) {
        var t = parseFloat(el.getAttribute("data-t"));
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t);
      });

      // Scene 1 (0.0–1.0) — "Brake." path draws in decelerating, step 1 writes on
      drawPath("#f06-segA", 293, 0.0, 0.8, "power2.out");
      waypoint(1, 0.3, 0.3);
      lightUp(1, 0.58);
      writeOn("#f06-word1", 0.36, 0.6);
      writeOn("#f06-note1", 0.72, 0.42, "power1.inOut");

      // Scene 2 (1.0–2.6) — "Turn with the prey." path sweeps through the bend, step 2 writes on
      drawPath("#f06-segB", 777, 1.0, 0.55, "power1.inOut");
      tl.fromTo(
        q("#f06-georing"),
        { strokeDashoffset: 1508, opacity: 0.7 },
        { strokeDashoffset: 0, opacity: 0.7, duration: 1.1, ease: "power2.inOut" },

      );
      waypoint(2, 1.32, 1.36);
      lightUp(2, 1.5);
      settleDown(1, 1.5);
      writeOn("#f06-word2", 1.4, 0.55);
      drawPath("#f06-segC", 777, 1.55, 0.9, "power1.inOut");
      writeOn("#f06-note2", 1.76, 0.42, "power1.inOut");

      // Scene 3 (2.6–4.3) — "…accelerate out of the turn" path straightens and shoots out, step 3 writes on, hold
      waypoint(3, 2.34, 2.4);
      lightUp(3, 2.62);
      settleDown(2, 2.62);
      writeOn("#f06-word3", 2.68, 0.58);
      drawPath("#f06-segD", 320, 2.75, 0.45, "power3.in");
      tl.fromTo(q("#f06-arrow"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out" }, 3.18);
      writeOn("#f06-note3", 3.1, 0.42, "power1.inOut");
      // 3.55 → 4.297: still hold (push-in continues underneath)

      window.__timelines[ID] = tl;
