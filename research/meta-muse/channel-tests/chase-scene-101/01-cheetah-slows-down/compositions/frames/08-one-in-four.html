  <div id="root" data-composition-id="08-one-in-four" data-start="0" data-duration="6.113" data-width="1080" data-height="1920">

  <script>
    (function () {
      // ---- build the four cheetah paw prints (deterministic markup) ----
      var PAD = "M100 108 C128 108 150 128 156 150 C162 172 156 196 140 200 C128 203 120 194 100 194 C80 194 72 203 60 200 C44 196 38 172 44 150 C50 128 72 108 100 108 Z";
      var TOES = [
        { cx: 40, cy: 94, rx: 16, ry: 22, r: -22 },
        { cx: 78, cy: 60, rx: 17, ry: 24, r: -7 },
        { cx: 122, cy: 60, rx: 17, ry: 24, r: 7 },
        { cx: 160, cy: 94, rx: 16, ry: 22, r: 22 }
      ];
      var CLAWS = ["M31 72 L26 57", "M75 35 L73 20", "M125 35 L127 20", "M169 72 L174 57"];

      function shapes(fill, stroke, sw) {
        var s = '<path d="' + PAD + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linejoin="round"/>';
        for (var i = 0; i < TOES.length; i++) {
          var t = TOES[i];
          s += '<ellipse cx="' + t.cx + '" cy="' + t.cy + '" rx="' + t.rx + '" ry="' + t.ry + '" transform="rotate(' + t.r + ' ' + t.cx + ' ' + t.cy + ')" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
        }
        for (var j = 0; j < CLAWS.length; j++) {
          s += '<path d="' + CLAWS[j] + '" fill="none" stroke="' + (stroke === "none" ? fill : stroke) + '" stroke-width="5" stroke-linecap="round"/>';
        }
        return s;
      }

      for (var k = 0; k < 4; k++) {
        var svg = '<svg viewBox="0 0 200 230">';
        if (k === 0) {
          svg += '<defs><clipPath id="f08-fillclip"><rect id="f08-fill-rect" x="-10" y="240" width="220" height="260"/></clipPath></defs>';
        }
        svg += '<g filter="url(#f08-rough)">' + shapes("rgba(43,33,24,0.05)", "#2B2118", 3) + '</g>';
        if (k === 0) {
          svg += '<g clip-path="url(#f08-fillclip)"><g filter="url(#f08-rough)" opacity="0.92">' + shapes("#C2412D", "#C2412D", 3) + '</g></g>';
        }
        svg += '</svg>';
        document.getElementById("f08-paw-" + k).innerHTML = svg;
      }

      // ---- typed telemetry line: one span per character ----
      var RUNS = "94 of 367 runs";
      var runsEl = document.getElementById("f08-runs");
      var html = "";
      for (var c = 0; c < RUNS.length; c++) {
        html += '<span class="f08-ch">' + RUNS.charAt(c) + '</span>';
      }
      runsEl.innerHTML = html;
      var chars = runsEl.querySelectorAll(".f08-ch");

      // ---- timeline ----
      var tl = gsap.timeline({ paused: true });
      var D = 5.513;

      // slow documentary push-in underneath the whole shot (~3%)
      tl.fromTo("#f08-cam", { scale: 1 }, { scale: 1.03, duration: D, ease: "sine.inOut" }, 0);

      // Scene 1 (0.0–2.4s): heading + four prints stamp in left to right
      tl.fromTo("#f08-wash", { opacity: 0 }, { opacity: 1, duration: 2.2, ease: "power2.out" }, 0);
      tl.fromTo("#f08-head", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#f08-head-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 0.2);

      var stampAt = [0.25, 0.75, 1.25, 1.75];
      for (var p = 0; p < 4; p++) {
        tl.fromTo("#f08-paw-" + p,
          { opacity: 0, scale: 1.12, y: -12 },
          { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" },
          stampAt[p]);
      }

      // Scene 2 (2.4–5.51s): on "one run in four" the first print fills red
      tl.fromTo([ "#f08-paw-1", "#f08-paw-2", "#f08-paw-3" ], { opacity: 1 }, { opacity: 0.5, duration: 0.7, ease: "power2.inOut", immediateRender: false }, 2.45);
      tl.fromTo("#f08-fill-rect", { attr: { y: 240 } }, { attr: { y: -20 }, duration: 0.85, ease: "power2.inOut" }, 2.5);
      tl.fromTo("#f08-ring-c", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 2.85);

      // "about 1 in 4" lands (display)
      tl.fromTo("#f08-about", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.8);
      tl.fromTo("#f08-stat", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 3.0);

      // "94 of 367 runs" types on beneath
      tl.fromTo("#f08-stat-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
      tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.05 }, 3.7);

      // field note points at the meal
      tl.fromTo("#f08-leader-p", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, 4.1);
      tl.fromTo("#f08-leader-h", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 4.5);
      tl.fromTo("#f08-note", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, 4.15);

      // source chip, then hold
      tl.fromTo("#f08-chip", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-one-in-four"] = tl;
    })();
  </script>
