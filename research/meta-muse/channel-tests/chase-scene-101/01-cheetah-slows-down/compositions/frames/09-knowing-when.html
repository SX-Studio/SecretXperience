  <script>
    (function () {
      var FID = "09-knowing-when";
      window.__timelines = window.__timelines || {};
      var byId = function (s) {
        return document.getElementById("f09-" + s);
      };
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var leadWords = root.querySelectorAll(".f09-lw");
      var closeWords = root.querySelectorAll(".f09-cw");

      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0–3.4s): wash blooms, plate fades up, lead line writes on ----------
      tl.fromTo(
        byId("wash"),
        { opacity: 0, scale: 0.84, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 2.4, ease: "power2.out" },
        0
      );

      // plate fades up and decelerates to rest across the whole shot
      tl.fromTo(
        byId("plate"),
        { opacity: 0 },
        { opacity: 1, duration: 1.4, ease: "power2.out" },
        0.1
      );
      tl.fromTo(
        byId("plate"),
        { scale: 1.04, y: 10, transformOrigin: "50% 60%" },
        { scale: 1, y: 0, transformOrigin: "50% 60%", duration: 7.44, ease: "power3.out" },
        0.1
      );

      // "It doesn't win by running flat out." — word-by-word write-on, paced to VO
      var leadT = [1.1, 1.32, 1.56, 1.76, 2.0, 2.34, 2.6];
      for (var i = 0; i < leadWords.length; i++) {
        tl.fromTo(
          leadWords[i],
          { opacity: 0, y: 16, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
          leadT[i]
        );
      }

      // ---------- Scene 2 (3.4–7.54s): closing line writes on large, "slow down" underlined ----------
      // lead line steps back so the closing line owns the frame
      tl.fromTo(
        byId("lead"),
        { opacity: 1 },
        { opacity: 0.55, duration: 1.0, ease: "power2.inOut" },
        3.4
      );

      // quotation ornament: hairlines draw outward, the mark settles in
      tl.fromTo(
        byId("orn-l"),
        { scaleX: 0, transformOrigin: "100% 50%" },
        { scaleX: 1, transformOrigin: "100% 50%", duration: 0.9, ease: "power2.out" },
        3.3
      );
      tl.fromTo(
        byId("orn-r"),
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, transformOrigin: "0% 50%", duration: 0.9, ease: "power2.out" },
        3.3
      );
      tl.fromTo(
        byId("orn-q"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
        3.32
      );

      // "It wins by knowing / when to slow down." — paced to the narration
      var closeT = [3.45, 3.7, 3.94, 4.14, 4.6, 4.85, 5.2, 5.5, 5.62];
      for (var j = 0; j < closeWords.length; j++) {
        tl.fromTo(
          closeWords[j],
          { opacity: 0, y: 20, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.85, ease: "power3.out" },
          closeT[j]
        );
      }

      // hand-drawn telemetry-red stroke under "slow down"
      tl.fromTo(
        byId("stroke"),
        { attr: { "stroke-dashoffset": 1 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" },
        5.8
      );

      // 6.6–7.54s: hold still (allocated stillness)

      window.__timelines[FID] = tl;
    })();
