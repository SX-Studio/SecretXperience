    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "01-cold-open";
        var DUR = 3.892;
        var SVGNS = "http://www.w3.org/2000/svg";

        // seeded PRNG (mulberry32), fixed seed, deterministic
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(242001);

        var scope = document.querySelector('[data-composition-id="' + FID + '"]') || document;
        function q(sel) { return scope.querySelector(sel); }

        // ---- ambient speed-line field ----
        var worldG = q("#f01-world-lines");
        for (var i = 0; i < 72; i++) {
          var isRed = rnd() < 0.2;
          var x = 50 + rnd() * 980;
          var y = rnd() * 7000;
          var len = 140 + rnd() * 380;
          var w = isRed ? 3 + rnd() : 2 + rnd() * 1.5;
          var r = document.createElementNS(SVGNS, "rect");
          r.setAttribute("x", x.toFixed(1));
          r.setAttribute("y", y.toFixed(1));
          r.setAttribute("width", w.toFixed(2));
          r.setAttribute("height", len.toFixed(1));
          r.setAttribute("rx", (w / 2).toFixed(2));
          r.setAttribute("fill", isRed ? "#C2412D" : "#2B2118");
          r.setAttribute("opacity", (isRed ? 0.42 + rnd() * 0.16 : 0.14 + rnd() * 0.2).toFixed(3));
          worldG.appendChild(r);
        }
        // soften each streak's ends with the shared gradient mask
        (function () {
          var defs = q("#f01-world-svg defs");
          var m = document.createElementNS(SVGNS, "mask");
          m.setAttribute("id", "f01-streak-mask");
          m.setAttribute("maskContentUnits", "objectBoundingBox");
          var mr = document.createElementNS(SVGNS, "rect");
          mr.setAttribute("x", "0"); mr.setAttribute("y", "0");
          mr.setAttribute("width", "1"); mr.setAttribute("height", "1");
          mr.setAttribute("fill", "url(#f01-g-streak)");
          m.appendChild(mr);
          defs.appendChild(m);
          var rs = worldG.querySelectorAll("rect");
          for (var k = 0; k < rs.length; k++) rs[k].setAttribute("mask", "url(#f01-streak-mask)");
        })();

        // ---- altimeter ticks ----
        var tickG = q("#f01-alt-ticks");
        for (var j = 0; j <= 120; j++) {
          var major = j % 5 === 0;
          var ln = document.createElementNS(SVGNS, "line");
          ln.setAttribute("x1", "4");
          ln.setAttribute("x2", major ? "52" : "26");
          ln.setAttribute("y1", String(j * 30));
          ln.setAttribute("y2", String(j * 30));
          ln.setAttribute("stroke", major ? "#5C4A36" : "#B9A98C");
          ln.setAttribute("stroke-width", major ? "3" : "2");
          tickG.appendChild(ln);
        }

        var tl = gsap.timeline({ paused: true });
        var SLAM = 0.8;

        // continuous world motion (whole shot) — streaks and tape stream upward
        tl.fromTo("#f01-world-svg", { y: 0 }, { y: -5600, duration: DUR, ease: "none" }, 0);
        tl.fromTo("#f01-alt-svg", { y: 0 }, { y: -1700, duration: DUR, ease: "none" }, 0);

        // Scene 1 (0.0–0.8): falcon already mid-streak in the top third, plunges down the frame
        tl.fromTo("#f01-falcon", { y: 0 }, { y: 820, duration: SLAM, ease: "power2.out" }, 0);
        tl.to("#f01-falcon", { y: 848, duration: DUR - SLAM, ease: "none" }, SLAM);
        tl.fromTo("#f01-echo-1", { y: -44 }, { y: -18, duration: SLAM, ease: "power2.out" }, 0);
        tl.fromTo("#f01-echo-2", { y: -96 }, { y: -40, duration: SLAM, ease: "power2.out" }, 0);

        // trailing streaks flicker (seeded keyframes): long during the plunge, shorter once tracked
        var trails = scope.querySelectorAll(".f01-tr");
        var STEP = 0.1;
        for (var a = 0; a < trails.length; a++) {
          var el = trails[a];
          tl.set(el, { scaleY: 0.85 + rnd() * 0.15, transformOrigin: "50% 100%" }, 0);
          for (var t = STEP; t < DUR - 0.01; t += STEP) {
            var v = t < SLAM ? 0.72 + rnd() * 0.28 : 0.3 + rnd() * 0.22;
            tl.to(el, { scaleY: v, duration: STEP, ease: "sine.inOut" }, t - STEP);
          }
        }

        // buffeting micro-jitter after the camera locks on (seeded)
        for (var b = SLAM; b < DUR - 0.05; b += 0.16) {
          tl.to("#f01-bird-jit", {
            x: (rnd() - 0.5) * 4,
            rotation: (rnd() - 0.5) * 2,
            svgOrigin: "100 230",
            duration: 0.16,
            ease: "sine.inOut"
          }, b);
        }

        // Scene 2 (0.8–2.4): 242 stat-slam, 1-frame red underline flash, impact shake, MPH lands
        tl.fromTo("#f01-num", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, SLAM);
        tl.set("#f01-flash", { opacity: 1 }, SLAM + 0.03);
        tl.set("#f01-flash", { opacity: 0 }, SLAM + 0.03 + 1 / 30);
        tl.fromTo("#f01-world", { opacity: 1 }, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, SLAM);

        var SHAKE_STEPS = 8, SHAKE_D = 0.25 / SHAKE_STEPS;
        for (var s = 0; s < SHAKE_STEPS; s++) {
          var amp = 4 * (1 - s / SHAKE_STEPS);
          tl.to("#f01-shake", {
            x: (rnd() * 2 - 1) * amp,
            y: (rnd() * 2 - 1) * amp,
            duration: SHAKE_D,
            ease: "none"
          }, SLAM + s * SHAKE_D);
        }
        tl.to("#f01-shake", { x: 0, y: 0, duration: SHAKE_D, ease: "none" }, SLAM + SHAKE_STEPS * SHAKE_D);

        tl.fromTo("#f01-mph", { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.55);

        // Scene 3 (2.4–3.892): readout types on, red rule drafts under the figure, slow push-in hold
        tl.fromTo("#f01-label span",
          { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "steps(10)" }, 2.45);
        tl.fromTo("#f01-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out", transformOrigin: "50% 50%" }, 2.55);
        tl.fromTo("#f01-stage", { scale: 1 }, { scale: 1.03, duration: DUR - 2.4, ease: "sine.inOut" }, 2.4);

        // pad the timeline to the full frame length
        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
