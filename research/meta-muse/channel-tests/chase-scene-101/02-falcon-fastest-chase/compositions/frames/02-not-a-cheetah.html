<script>
(function () {
  var D = 7.732;
  var root = document.querySelector('[data-composition-id="02-not-a-cheetah"]');
  var q = function (s) { return root.querySelector(s); };

  // seeded PRNG (deterministic)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20242);

  var SVGNS = "http://www.w3.org/2000/svg";
  var CX = 190, CY = 230, R = 160;
  var CHEETAH = 58, FALCON = 242, GMAX = 250;
  var BAR_W = 936;

  // gauge ticks (0..250 every 25)
  var ticks = q("#f02-ticks");
  for (var v = 0; v <= GMAX; v += 25) {
    var th = Math.PI + (v / GMAX) * Math.PI;
    var major = v % 50 === 0;
    var r2 = major ? R - 24 : R - 14;
    var ln = document.createElementNS(SVGNS, "line");
    ln.setAttribute("x1", (CX + R * Math.cos(th)).toFixed(2));
    ln.setAttribute("y1", (CY + R * Math.sin(th)).toFixed(2));
    ln.setAttribute("x2", (CX + r2 * Math.cos(th)).toFixed(2));
    ln.setAttribute("y2", (CY + r2 * Math.sin(th)).toFixed(2));
    ln.setAttribute("stroke", "#B9A98C");
    ln.setAttribute("stroke-width", major ? "3" : "2");
    ln.setAttribute("class", "f02-tick");
    ticks.appendChild(ln);
  }
  // cheetah mark on the gauge (ink)
  var thC = Math.PI + (CHEETAH / GMAX) * Math.PI;
  var ctick = q("#f02-ctick");
  ctick.setAttribute("x1", (CX + (R + 10) * Math.cos(thC)).toFixed(2));
  ctick.setAttribute("y1", (CY + (R + 10) * Math.sin(thC)).toFixed(2));
  ctick.setAttribute("x2", (CX + (R - 30) * Math.cos(thC)).toFixed(2));
  ctick.setAttribute("y2", (CY + (R - 30) * Math.sin(thC)).toFixed(2));

  // speed streaks trailing the falcon bar tip (seeded)
  var streakBox = q("#f02-streaks");
  var streakDefs = [
    { y: 8,   h: 3, c: "#C2412D" },
    { y: 22,  h: 4, c: "#2B2118" },
    { y: 52,  h: 3, c: "#2B2118" },
    { y: 84,  h: 4, c: "#2B2118" },
    { y: 112, h: 3, c: "#2B2118" },
    { y: 140, h: 4, c: "#C2412D" },
    { y: 152, h: 3, c: "#2B2118" }
  ];
  streakDefs.forEach(function (d) {
    var s = document.createElement("div");
    s.className = "f02-streak";
    s.style.top = d.y + "px";
    s.style.height = d.h + "px";
    s.style.width = Math.round(150 + rnd() * 190) + "px";
    s.style.background = d.c;
    streakBox.appendChild(s);
  });

  // measured stroke lengths
  function prepDraw(el) {
    var L = el.getTotalLength();
    el.style.strokeDasharray = L + " " + L;
    return L;
  }
  var ring = q("#f02-ring"), ringL = prepDraw(ring);
  var lead = q("#f02-lead-path"), leadL = prepDraw(lead);
  var head = q("#f02-lead-head"), headL = prepDraw(head);
  var squig = q("#f02-squiggle"), squigL = prepDraw(squig);

  var needleRot = function (val) { return -90 + (val / GMAX) * 180; };
  var SVG_O = CX + " " + CY;

  var tl = gsap.timeline({ paused: true });

  // ---- camera: slow documentary push across the whole shot
  tl.fromTo("#f02-cam", { scale: 1 }, { scale: 1.025, duration: D, ease: "none" }, 0);
  tl.fromTo("#f02-plate-img", { scale: 1 }, { scale: 1.05, duration: D, ease: "none" }, 0);

  // ================= Scene 1 (0.0–2.4): plate slides up into the mat
  tl.fromTo("#f02-mat", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo("#f02-plate-move", { y: 180, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 0.1);
  tl.fromTo("#f02-spec", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.9);

  // "animal ... clocked" — speed gauge drafts itself
  tl.fromTo("#f02-gauge-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.1);
  tl.fromTo(ring, { strokeDashoffset: ringL }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 1.15);
  tl.fromTo(root.querySelectorAll(".f02-tick"), { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.06, ease: "power1.out" }, 1.4);
  tl.fromTo(["#f02-hub", "#f02-mph"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.9);
  tl.fromTo("#f02-needle", { opacity: 0, rotation: needleRot(0), svgOrigin: SVG_O },
    { opacity: 1, rotation: needleRot(0), svgOrigin: SVG_O, duration: 0.3, ease: "power2.out" }, 1.95);
  // needle "wakes" on "clocked"
  tl.to("#f02-needle", { rotation: needleRot(14), svgOrigin: SVG_O, duration: 0.35, ease: "power2.out" }, 2.25);
  tl.to("#f02-needle", { rotation: needleRot(0), svgOrigin: SVG_O, duration: 0.4, ease: "power2.inOut" }, 2.6);

  // ================= Scene 2 (2.4–4.6): "Not a cheetah." / "A bird."
  tl.fromTo("#f02-cheetah-img", { opacity: 0, clipPath: "inset(0% 100% 0% 0%)" },
    { opacity: 1, clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" }, 2.9);
  tl.fromTo("#f02-clabel", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 3.0);
  tl.fromTo("#f02-axis", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 3.0);

  // cheetah bar grows to 58 MPH, count-up locked to the same ease
  var CB_AT = 3.3, CB_DUR = 0.85;
  var cState = { v: 0 };
  var cNum = q("#f02-cnum");
  tl.fromTo("#f02-cbar", { scaleX: 0 }, { scaleX: CHEETAH / FALCON, duration: CB_DUR, ease: "power3.out" }, CB_AT);
  tl.fromTo("#f02-cval", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, CB_AT);
  tl.fromTo(cState, { v: 0 }, { v: CHEETAH, duration: CB_DUR, ease: "power3.out",
    onUpdate: function () { cNum.textContent = String(Math.round(cState.v)); } }, CB_AT);
  tl.to("#f02-needle", { rotation: needleRot(CHEETAH), svgOrigin: SVG_O, duration: CB_DUR, ease: "power3.out" }, CB_AT);

  // the cheetah's ceiling marked down through the falcon lane
  tl.fromTo("#f02-cmark", { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power2.out" }, 3.85);

  // "A bird." — falcon bar shoots past to 242 MPH
  tl.fromTo("#f02-falcon-glyph", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 4.05);
  tl.fromTo("#f02-flabel", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 4.1);

  var FB_AT = 4.3, FB_DUR = 0.6;
  var fState = { v: 0 };
  var fNum = q("#f02-fnum");
  tl.fromTo("#f02-fbar", { scaleX: 0 }, { scaleX: 1, duration: FB_DUR, ease: "expo.out" }, FB_AT);
  // speed lines ride the tip (same ease => same position), then fade over 0.3 s
  tl.fromTo("#f02-streaks", { x: 0 }, { x: BAR_W, duration: FB_DUR, ease: "expo.out" }, FB_AT);
  tl.fromTo("#f02-streaks", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, FB_AT);
  tl.fromTo(".f02-streak", { scaleX: 1 }, { scaleX: 0.15, duration: 0.45, ease: "power2.in" }, FB_AT + 0.25);
  tl.to("#f02-streaks", { opacity: 0, duration: 0.3, ease: "power1.out" }, FB_AT + 0.4);
  // stat slam: count-up + 1.25 -> 1.0 expo.out
  tl.fromTo("#f02-fval", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: FB_DUR, ease: "expo.out" }, FB_AT);
  tl.fromTo(fState, { v: 0 }, { v: FALCON, duration: FB_DUR, ease: "expo.out",
    onUpdate: function () { fNum.textContent = String(Math.round(fState.v)); } }, FB_AT);
  tl.fromTo("#f02-funder", { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "power2.out" }, FB_AT + 0.45);
  tl.to("#f02-needle", { rotation: needleRot(FALCON), svgOrigin: SVG_O, duration: FB_DUR, ease: "expo.out" }, FB_AT);

  // impact shake (seeded, max 6px, 0.25 s)
  var SH_AT = FB_AT + 0.1, steps = 10, stepDur = 0.025;
