    <script>
      (function () {
        var FID = "04-versus";
        var DUR = 13.62;

        // seeded PRNG (deterministic shake / wobble)
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(2018);
        function j(n) { return (rnd() * 2 - 1) * n; }

        // ---------- schematic curve: dive speed -> steering force (rising, convex) ----------
        var X0 = 200, X1 = 940, Y0 = 1272, Y1 = 612;
        var N = 48, pts = [];
        for (var i = 0; i <= N; i++) {
          var u = i / N;
          var f = 0.18 * u + 0.82 * u * u;
          pts.push([X0 + (X1 - X0) * u, Y0 - (Y0 - Y1) * f]);
        }
        var curveD = "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" L");
        var cum = [0];
        for (var k = 1; k < pts.length; k++) {
          var dx = pts[k][0] - pts[k - 1][0], dy = pts[k][1] - pts[k - 1][1];
          cum.push(cum[k - 1] + Math.sqrt(dx * dx + dy * dy));
        }
        var curveLen = cum[cum.length - 1];
        function pointAt(p) {
          var target = p * curveLen;
          for (var q = 1; q < cum.length; q++) {
            if (cum[q] >= target) {
              var seg = cum[q] - cum[q - 1];
              var r = seg > 0 ? (target - cum[q - 1]) / seg : 0;
              return [pts[q - 1][0] + (pts[q][0] - pts[q - 1][0]) * r, pts[q - 1][1] + (pts[q][1] - pts[q - 1][1]) * r];
            }
          }
          return pts[pts.length - 1];
        }

        var curve = document.getElementById("f04-curve");
        var curveRed = document.getElementById("f04-curve-red");
        curve.setAttribute("d", curveD);
        curveRed.setAttribute("d", curveD);
        var CL = Math.ceil(curveLen) + 4;
        curve.setAttribute("stroke-dasharray", CL + " " + CL);
        curveRed.setAttribute("stroke-dasharray", CL + " " + CL);
        curve.setAttribute("stroke-dashoffset", CL);
        curveRed.setAttribute("stroke-dashoffset", CL);

        document.getElementById("f04-wash").setAttribute("d", curveD + " L" + X1 + " 1298 L" + X0 + " 1298 Z");

        // marker starts at the curve origin
        var marker = document.getElementById("f04-marker");
        var start = pointAt(0);
        marker.setAttribute("transform", "translate(" + start[0].toFixed(1) + " " + start[1].toFixed(1) + ")");

        // axis lengths (straight lines)
        var AX = 810, AY = 740, TIP = 50;
        ["f04-axis-x", "f04-axis-y"].forEach(function (id, n) {
          var L = n === 0 ? AX : AY;
          var el = document.getElementById(id);
          el.setAttribute("stroke-dasharray", L + " " + L);
          el.setAttribute("stroke-dashoffset", L);
        });
        ["f04-axis-x-tip", "f04-axis-y-tip"].forEach(function (id) {
          var el = document.getElementById(id);
          el.setAttribute("stroke-dasharray", TIP + " " + TIP);
          el.setAttribute("stroke-dashoffset", TIP);
        });

        // hand-drawn leader: from note end to the curve's top
        var la = [818, 628], end = pointAt(1), lb = [end[0] - 34, end[1] + 6];
        var lpts = [], LN = 6;
        for (var m = 0; m <= LN; m++) {
          var t = m / LN;
          var bx = la[0] + (lb[0] - la[0]) * t;
          var by = la[1] + (lb[1] - la[1]) * t - Math.sin(t * Math.PI) * 26;
          if (m > 0 && m < LN) { bx += j(2.5); by += j(2.5); }
          lpts.push([bx, by]);
        }
        var leaderD = "M" + lpts[0][0].toFixed(1) + " " + lpts[0][1].toFixed(1);
        var leaderLen = 0;
        for (var n2 = 1; n2 < lpts.length; n2++) {
          leaderD += " L" + lpts[n2][0].toFixed(1) + " " + lpts[n2][1].toFixed(1);
          var ex = lpts[n2][0] - lpts[n2 - 1][0], ey = lpts[n2][1] - lpts[n2 - 1][1];
          leaderLen += Math.sqrt(ex * ex + ey * ey);
        }
        leaderD += " M" + (lb[0] - 18).toFixed(1) + " " + (lb[1] - 2).toFixed(1) + " L" + lb[0].toFixed(1) + " " + lb[1].toFixed(1) + " L" + (lb[0] - 6).toFixed(1) + " " + (lb[1] + 17).toFixed(1);
        leaderLen = Math.ceil(leaderLen + 60);
        var leader = document.getElementById("f04-leader");
        leader.setAttribute("d", leaderD);
        leader.setAttribute("stroke-dasharray", leaderLen + " " + leaderLen);
        leader.setAttribute("stroke-dashoffset", leaderLen);

        // wobbly underline beneath the note
        var ul = "M226 " + (652 + j(2)).toFixed(1);
        for (var w = 1; w <= 6; w++) ul += " L" + (226 + w * 96) + " " + (652 - w * 5 + j(2.5)).toFixed(1);
        var under = document.getElementById("f04-underline");
        under.setAttribute("d", ul);
        under.setAttribute("stroke-dasharray", "640 640");
        under.setAttribute("stroke-dashoffset", "640");

        // seeded impact shake (max 4px, 0.25 s, decaying)
        var shakeKeys = [];
        for (var s = 0; s < 6; s++) {
          var amp = 4 * (1 - s / 6);
          shakeKeys.push({ x: j(amp), y: j(amp) });
        }

        var tl = gsap.timeline({ paused: true });

        // ===== Scene 1 (0.0–2.6): CHEETAH card slides in from the left, tilted =====
        tl.fromTo("#f04-cheetah-card",
          { x: -820, rotationZ: -7, rotationX: 14, opacity: 0 },
          { x: 0, rotationZ: -1.2, rotationX: 7, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.05);
        tl.fromTo("#f04-cheetah .f04-streak", { scaleX: 0, opacity: 0.9 },
          { scaleX: 1, opacity: 0.9, duration: 0.3, ease: "power2.out", stagger: 0.04 }, 0.08);
        tl.to("#f04-cheetah .f04-streak", { opacity: 0, duration: 0.3, ease: "power1.out", stagger: 0.03 }, 0.62);
        tl.fromTo("#f04-cheetah-plate", { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.out" }, 0.55);
        tl.fromTo("#f04-cheetah-name", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.75);
        tl.fromTo("#f04-cheetah-row1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.25);
        tl.fromTo("#f04-cheetah-row2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.75);

        // ===== Scene 2 (2.6–4.2): FALCON card slams in from the right, VS stamps =====
        tl.fromTo("#f04-falcon-card",
          { x: 980, rotationZ: 8, rotationX: -16, opacity: 0 },
          { x: 0, rotationZ: 1.2, rotationX: -7, opacity: 1, duration: 0.45, ease: "expo.out" }, 2.62);
        tl.fromTo("#f04-falcon .f04-streak", { scaleX: 0, opacity: 0.9 },
          { scaleX: 1, opacity: 0.9, duration: 0.2, ease: "power2.out", stagger: 0.03 }, 2.64);
        tl.to("#f04-falcon .f04-streak", { opacity: 0, duration: 0.3, ease: "power1.out", stagger: 0.03 }, 2.98);
        tl.fromTo("#f04-vs",
          { scale: 1.9, rotation: -24, opacity: 0 },
          { scale: 1, rotation: -8, opacity: 1, duration: 0.28, ease: "expo.out" }, 2.95);
        // impact shake on the card pair
        var sk = 3.0;
        shakeKeys.forEach(function (kf, idx) {
          tl.to("#f04-shake", { x: kf.x, y: kf.y, duration: 0.04, ease: "none" }, sk + idx * 0.04);
        });
        tl.to("#f04-shake", { x: 0, y: 0, duration: 0.04, ease: "none" }, sk + 0.24);
        tl.fromTo("#f04-falcon-plate", { clipPath: "inset(0% 100% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" }, 3.1);
        tl.fromTo("#f04-falcon-name", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.2);
        tl.fromTo("#f04-falcon-row1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.45);
        tl.fromTo("#f04-falcon-row2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 3.75);

        // ===== Scene 3 (4.2–9.5): cards slide up + shrink into a book-open pair; chart draws =====
        var MV = 4.4, MD = 1.05, SC = 0.468;
        tl.fromTo("#f04-cheetah", { x: 0, y: 0, scale: 1 }, { x: 0, y: -70, scale: SC, duration: MD, ease: "power3.inOut" }, MV);
        tl.fromTo("#f04-falcon", { x: 0, y: 0, scale: 1 }, { x: 498, y: -750, scale: SC, duration: MD, ease: "power3.inOut" }, MV + 0.06);
        tl.to("#f04-cheetah-card", { rotationX: 0, rotationZ: 0, rotationY: 13, duration: MD, ease: "power3.inOut" }, MV);
        tl.to("#f04-falcon-card", { rotationX: 0, rotationZ: 0, rotationY: -13, duration: MD, ease: "power3.inOut" }, MV + 0.06);
        tl.fromTo("#f04-vs-pos", { x: 0, y: 0, scale: 1 }, { x: 0, y: -559, scale: 0.5, duration: MD, ease: "power3.inOut" }, MV + 0.03);

        // counter-phase idle float (explicit alternating tweens)
        var bobT = MV + MD + 0.1, bobSeg = 1.1, sign = 1;
        while (bobT + bobSeg <= DUR) {
          tl.to("#f04-cheetah-card", { y: -4 * sign, duration: bobSeg, ease: "sine.inOut" }, bobT);
          tl.to("#f04-falcon-card", { y: 4 * sign, duration: bobSeg, ease: "sine.inOut" }, bobT);
          bobT += bobSeg; sign = -sign;
        }

        // axes draw
        tl.to("#f04-axis-x", { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 5.05);
        tl.to("#f04-axis-x-tip", { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power1.out" }, 5.7);
        tl.to("#f04-axis-y", { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 5.3);
        tl.to("#f04-axis-y-tip", { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power1.out" }, 5.95);
        tl.fromTo("#f04-grid line", { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power1.out", stagger: 0.12 }, 5.6);
        // axis labels
        tl.fromTo("#f04-x-name", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.85);
        tl.fromTo("#f04-y-name", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.1);
        tl.fromTo("#f04-x-slow, #f04-x-fast", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out", stagger: 0.15 }, 6.55);
        // schematic label + source chip
        tl.fromTo("#f04-schem", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, 6.9);
        tl.fromTo("#f04-source", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.2);
        // the curve rises on "more force to steer"
        tl.fromTo(curve, { attr: { "stroke-dashoffset": CL } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.5, ease: "power1.inOut" }, 7.75);
        tl.fromTo("#f04-wash", { opacity: 0 }, { opacity: 0.25, duration: 0.9, ease: "power1.out" }, 8.9);

        // ===== Scene 4 (9.5–13.62): red marker rides the curve up; field note; hold =====
        tl.fromTo("#f04-marker", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 9.5);
        tl.fromTo("#f04-marker-dot", { scale: 0.3, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "power2.out", transformOrigin: "50% 50%" }, 9.5);
        var ride = { p: 0 };
        tl.to(ride, {
          p: 1,
          duration: 2.1,
          ease: "power2.in",
          onUpdate: function () {
            var pt = pointAt(ride.p);
            marker.setAttribute("transform", "translate(" + pt[0].toFixed(1) + " " + pt[1].toFixed(1) + ")");
            curveRed.setAttribute("stroke-dashoffset", (CL * (1 - ride.p)).toFixed(1));
          }
        }, 9.75);
        tl.fromTo("#f04-note-text", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.0, ease: "power1.inOut" }, 10.45);
        tl.to(leader, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, 11.45);
        // arrival pulse (single shot)
        tl.set("#f04-marker-pulse", { opacity: 0.9 }, 11.86);
        tl.fromTo("#f04-marker-pulse", { scale: 1, transformOrigin: "50% 50%" },
          { scale: 2.4, duration: 0.7, ease: "power2.out", transformOrigin: "50% 50%" }, 11.86);
        tl.to("#f04-marker-pulse", { opacity: 0, duration: 0.7, ease: "power2.out" }, 11.86);
        tl.to(under, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, 12.3);

        // slow documentary push-in underneath the payoff
        tl.fromTo("#f04-stage", { scale: 1 }, { scale: 1.025, duration: DUR - 9.5, ease: "sine.inOut" }, 9.5);

        tl.set({}, {}, DUR);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
    </script>
  </div>
