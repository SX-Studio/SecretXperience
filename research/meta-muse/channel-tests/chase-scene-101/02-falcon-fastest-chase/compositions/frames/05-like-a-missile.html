    <script>
      (function () {
        var FID = "05-like-a-missile";
        var D = 10.761;
        window.__timelines = window.__timelines || {};

        // split the telemetry label into per-character spans for a type-on
        var pn = document.getElementById("f05-pn");
        var pnText = pn.textContent;
        pn.textContent = "";
        for (var i = 0; i < pnText.length; i++) {
          var s = document.createElement("span");
          s.className = "f05-ch";
          s.textContent = pnText.charAt(i) === " " ? " " : pnText.charAt(i);
          pn.appendChild(s);
        }

        var tl = gsap.timeline({ paused: true });

        function draw(sel, t, d, ease) {
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, t);
          tl.fromTo(sel, { strokeDashoffset: 1.02 }, { strokeDashoffset: 0, duration: d, ease: ease || "power2.inOut" }, t);
        }
        function wipe(sel, t, d, ease) {
          tl.fromTo(sel,
            { clipPath: "inset(0% 100% 0% 0%)" },
            { clipPath: "inset(0% 0% 0% 0%)", duration: d, ease: ease || "power2.out" }, t);
        }
