      }
      var la = simulate(0, false), lb = simulate(100, false);
      var RATE2 = -la / ((lb - la) / 100);   // closes exactly at TC
      var S = simulate(RATE2, true);         // S[0..93], one per 0.1 s
      var N = S.length - 1;
      var I_SWAP = 58;                        // 5.8 s: ships become birds
      S[N].L = 0; S[N].fx = S[N].px; S[N].fy = S[N].py;

      // ---- static drawing from the samples ----
      var ticks = $("f06-rose-ticks");
      for (var k = 0; k < 32; k++) {
        var ang = k * Math.PI / 16, r1 = k % 4 === 0 ? 372 : 386;
        var tl0 = document.createElementNS(SVGNS, "line");
        tl0.setAttribute("x1", r2(560 + Math.cos(ang) * r1)); tl0.setAttribute("y1", r2(1040 + Math.sin(ang) * r1));
        tl0.setAttribute("x2", r2(560 + Math.cos(ang) * 400)); tl0.setAttribute("y2", r2(1040 + Math.sin(ang) * 400));
        ticks.appendChild(tl0);
      }

      function pathD(i0, i1, kx, ky) {
        var d = "";
        for (var i = i0; i <= i1; i++) d += (i === i0 ? "M" : " L") + r2(S[i][kx]) + "," + r2(S[i][ky]);
        return d;
      }
      function cumLen(i0, i1, kx, ky) {
        var c = [0];
        for (var i = i0 + 1; i <= i1; i++) {
          var dx = S[i][kx] - S[i - 1][kx], dy = S[i][ky] - S[i - 1][ky];
          c.push(c[c.length - 1] + Math.sqrt(dx * dx + dy * dy));
        }
        return c;
      }
      var tracks = [
        { id: "f06-trk-ship-a", i0: 0, i1: I_SWAP, kx: "fx", ky: "fy" },
        { id: "f06-trk-ship-b", i0: 0, i1: I_SWAP, kx: "px", ky: "py" },
        { id: "f06-trk-falcon", i0: I_SWAP, i1: N, kx: "fx", ky: "fy" },
        { id: "f06-trk-pigeon", i0: I_SWAP, i1: N, kx: "px", ky: "py" }
      ];
      tracks.forEach(function (tr) {
        var el = $(tr.id);
        tr.el = el;
        tr.cum = cumLen(tr.i0, tr.i1, tr.kx, tr.ky);
        tr.len = Math.max(1, tr.cum[tr.cum.length - 1]);
        el.setAttribute("d", pathD(tr.i0, tr.i1, tr.kx, tr.ky));
        el.setAttribute("stroke-dasharray", r2(tr.len + 2) + " " + r2(tr.len + 2));
        el.setAttribute("stroke-dashoffset", r2(tr.len + 1));
      });

      // telemetry dots on the falcon track
      var dotsG = $("f06-dots"), dots = [];
      for (var di = I_SWAP + 3; di < N; di += 3) {
        var c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("cx", r2(S[di].fx)); c.setAttribute("cy", r2(S[di].fy)); c.setAttribute("r", "6");
        c.setAttribute("fill", "#C2412D"); c.setAttribute("stroke", "#EFE6D2"); c.setAttribute("stroke-width", "2");
        dotsG.appendChild(c); dots.push({ el: c, t: S[di].t });
      }

      // ghost sight-lines — drawn from the same samples, so they are exactly parallel
      var GHOST_I = [5, 14, 23, 32, 41, 50, 59, 68, 74, 79, 84, 89];
      var ghostsG = $("f06-ghosts"), ghosts = [];
      GHOST_I.forEach(function (gi) {
        var s = S[gi];
        var g = document.createElementNS(SVGNS, "g");
        var ln = document.createElementNS(SVGNS, "line");
        ln.setAttribute("x1", r2(s.fx)); ln.setAttribute("y1", r2(s.fy));
        ln.setAttribute("x2", r2(s.px)); ln.setAttribute("y2", r2(s.py));
        ln.setAttribute("stroke", "#C2412D"); ln.setAttribute("stroke-width", "3");
        ln.setAttribute("stroke-dasharray", "14 10"); ln.setAttribute("stroke-linecap", "round");
        var d1 = document.createElementNS(SVGNS, "circle");
        d1.setAttribute("cx", r2(s.fx)); d1.setAttribute("cy", r2(s.fy)); d1.setAttribute("r", "6"); d1.setAttribute("fill", "#C2412D");
        var d2 = document.createElementNS(SVGNS, "circle");
        d2.setAttribute("cx", r2(s.px)); d2.setAttribute("cy", r2(s.py)); d2.setAttribute("r", "5"); d2.setAttribute("fill", "#2B2118");
        g.appendChild(ln); g.appendChild(d1); g.appendChild(d2);
        ghostsG.appendChild(g);
        ghosts.push({ el: g, t: s.t });
      });

      // contact burst (seeded)
      var CX = r2(S[N].px), CY = r2(S[N].py);
      var burst = $("f06-burst");
      for (var b = 0; b < 12; b++) {
        var ba = (b * 30 + (rand() - 0.5) * 16) * Math.PI / 180;
        var rb1 = 40 + rand() * 10, rb2 = rb1 + 24 + rand() * 18;
        var bl = document.createElementNS(SVGNS, "line");
        bl.setAttribute("x1", r2(CX + Math.cos(ba) * rb1)); bl.setAttribute("y1", r2(CY + Math.sin(ba) * rb1));
        bl.setAttribute("x2", r2(CX + Math.cos(ba) * rb2)); bl.setAttribute("y2", r2(CY + Math.sin(ba) * rb2));
        burst.appendChild(bl);
      }
      var feathersG = $("f06-feathers"), feathers = [];
      for (var f = 0; f < 8; f++) {
        var fa = (f * 45 + 20 + (rand() - 0.5) * 24) * Math.PI / 180;
        var fr = 90 + rand() * 60;
        var fe = document.createElementNS(SVGNS, "ellipse");
        fe.setAttribute("cx", CX); fe.setAttribute("cy", CY); fe.setAttribute("rx", "11"); fe.setAttribute("ry", "4");
        fe.setAttribute("fill", "#5C4A36");
        feathersG.appendChild(fe);
        feathers.push({ el: fe, dx: r2(Math.cos(fa) * fr), dy: r2(Math.sin(fa) * fr), rot: Math.round(fa * 180 / Math.PI + (rand() - 0.5) * 120) });
      }

      // ---- initial transforms ----
      var los = $("f06-los"), LOSW = 1100;
      function clipFor(L) { return "inset(0px " + r2(Math.max(0, LOSW - L)) + "px 0px 0px)"; }
      gsap.set(["#f06-los-pos", "#f06-falcon-pos"], { x: r2(S[0].fx), y: r2(S[0].fy) });
      gsap.set(["#f06-pigeon-pos", "#f06-reticle-pos"], { x: r2(S[0].px), y: r2(S[0].py) });
      gsap.set("#f06-falcon-rot", { rotation: r2(S[0].frot) });
      gsap.set("#f06-pigeon-rot", { rotation: r2(S[0].prot) });
      gsap.set(los, { clipPath: clipFor(S[0].L) });

      var tl = gsap.timeline({ paused: true });

      // ---- motion keyframes (seek-safe, linear between 0.1 s samples) ----
      var kF = [], kP = [], kFr = [], kPr = [], kLos = [];
      for (var i = 1; i <= N; i++) {
        kF.push({ x: r2(S[i].fx), y: r2(S[i].fy), duration: 0.1, ease: "none" });
        kP.push({ x: r2(S[i].px), y: r2(S[i].py), duration: 0.1, ease: "none" });
        kFr.push({ rotation: r2(S[i].frot), duration: 0.1, ease: "none" });
        kPr.push({ rotation: r2(S[i].prot), duration: 0.1, ease: "none" });
        kLos.push({ clipPath: clipFor(S[i].L), duration: 0.1, ease: "none" });
      }
      tl.to(["#f06-los-pos", "#f06-falcon-pos"], { keyframes: kF }, 0);
      tl.to(["#f06-pigeon-pos", "#f06-reticle-pos"], { keyframes: kP }, 0);
      tl.to("#f06-falcon-rot", { keyframes: kFr }, 0);
      tl.to("#f06-pigeon-rot", { keyframes: kPr }, 0);
      tl.to(los, { keyframes: kLos }, 0);

      // tracks self-draw in sync with the movers
      tracks.forEach(function (tr) {
        var kd = [];
        for (var j = 1; j < tr.cum.length; j++) kd.push({ strokeDashoffset: r2(tr.len - tr.cum[j]), duration: 0.1, ease: "none" });
        tl.to(tr.el, { keyframes: kd }, S[tr.i0].t);
      });

      // ---- readouts (RANGE counts down, HEADING follows the pursuer) ----
      var rangeEl = $("f06-range-val"), hdgEl = $("f06-hdg-val");
      var lastR = rangeEl.textContent, lastH = hdgEl.textContent;
      for (var ri = 1; ri <= N; ri++) {
        var Lr = S[ri].L, txt;
        if (ri < I_SWAP) txt = (Lr * 2 / L0).toFixed(2) + " NM";
        else txt = Math.round(Lr * 0.2) + " m";
        if (ri === N) txt = "0 m";
        if (txt !== lastR) { tl.set(rangeEl, { textContent: txt }, S[ri].t); lastR = txt; }
        var h = ((Math.round(S[ri].frot) % 360) + 360) % 360;
        var ht = ("00" + h).slice(-3) + "°";
        if (ht !== lastH) { tl.set(hdgEl, { textContent: ht }, S[ri].t); lastH = ht; }
      }
      tl.set(rangeEl, { color: "#C2412D" }, TC);

      // ===== Scene 1 (0.0–4.6): ships converge, bearing holds =====
      tl.fromTo("#f06-title", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.0);
      tl.fromTo("#f06-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.15);
      tl.fromTo("#f06-bearing-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);
      tl.fromTo("#f06-bearing-val", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);
      tl.fromTo(["#f06-range-label", "#f06-range-val"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 0.35);
      tl.fromTo(["#f06-hdg-label", "#f06-hdg-val"], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 0.55);
      tl.fromTo("#f06-divider", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.3);
      tl.fromTo("#f06-corners", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0.3);
      tl.fromTo("#f06-rose", { opacity: 0, scale: 0.94, svgOrigin: "560 1040" }, { opacity: 0.55, scale: 1, duration: 1.2, ease: "power2.out" }, 0.0);
      tl.fromTo("#f06-chip", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.6);
      tl.fromTo(["#f06-ship-a", "#f06-ship-b"], { opacity: 0.0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.0);
      // live sight-line + angle marker
      tl.fromTo("#f06-los-pos", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.25);
      tl.fromTo("#f06-angle", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 1.2);
      // "holds the same bearing" — the figure slams, CONSTANT lands, underline draws
      tl.fromTo("#f06-bearing-val", { scale: 1.12, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, 2.62);
      tl.fromTo("#f06-bearing-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 2.62);
      tl.fromTo("#f06-constant", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.75);
      // field note writes on
      tl.to("#f06-note-leader", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 2.6);
      tl.fromTo("#f06-note-head", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 3.0);
      tl.fromTo("#f06-note-cr1", { scaleX: 0, svgOrigin: "630 1214" }, { scaleX: 1, duration: 0.55, ease: "power1.inOut" }, 2.75);
      tl.fromTo("#f06-note-cr2", { scaleX: 0, svgOrigin: "650 1284" }, { scaleX: 1, duration: 0.5, ease: "power1.inOut" }, 3.25);
      // "as it closes in" — projected courses meet at one point
      tl.fromTo("#f06-courses", { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power1.out" }, 3.5);
      tl.to("#f06-x1", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 3.85);
      tl.to("#f06-x2", { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, 4.0);
      // "collision course" — the meeting point turns red
      tl.fromTo("#f06-x-red", { opacity: 0, scale: 1.6, svgOrigin: "200 727" }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 4.96);

      // ghost sight-lines drop as the live line passes; CONSTANT ticks each time
      ghosts.forEach(function (g, gi) {
        tl.fromTo(g.el, { opacity: 0 }, { opacity: 0.95, duration: 0.06, ease: "none" }, g.t);
        tl.to(g.el, { opacity: 0.4, duration: 0.7, ease: "power1.out" }, g.t + 0.1);
        if (g.t > 2.9) {
          tl.fromTo("#f06-constant", { scale: 1.08 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, g.t);
        }
      });

      // ===== Scene 2 (4.6–7.0): ships cross-dissolve into falcon + pigeon =====
      tl.fromTo(["#f06-falcon", "#f06-pigeon"], { opacity: 0, scale: 0.8, svgOrigin: "0 0" }, { opacity: 1, scale: 1, duration: 1.1, ease: "power2.inOut" }, 5.0);
      tl.to(["#f06-ship-a", "#f06-ship-b"], { opacity: 0, duration: 1.1, ease: "power2.inOut" }, 4.75);
      tl.to(["#f06-courses", "#f06-x-ink"], { opacity: 0.15, duration: 0.8, ease: "power1.inOut" }, 5.8);
      tl.to("#f06-x-red", { opacity: 0.2, duration: 0.8, ease: "power1.inOut" }, 6.0);
      tl.to("#f06-note", { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 6.2);
      dots.forEach(function (d) {
        tl.fromTo(d.el, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, d.t);
      });
      // camera pushes in on the chase
      tl.fromTo("#f06-camera", { x: 0, y: 0, scale: 1 }, { x: 223, y: 138, scale: 1.6, duration: 1.25, ease: "power2.inOut" }, 6.25);
      tl.to("#f06-camera", { scale: 1.7, duration: 1.8, ease: "none" }, 7.5);
      tl.to("#f06-camera", { scale: 1.74, duration: DUR - 9.3, ease: "power1.out" }, 9.3);

      // ===== Scene 3 (7.0–10.5): reticle locks in two steps; falcon curves to hold the bearing =====
      gsap.set("#f06-reticle-in", { x: 80, y: -64, scale: 1.6, rotation: 45 });
      tl.fromTo("#f06-reticle-in", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 7.05);
      tl.to("#f06-reticle-in", { x: 32, y: -26, scale: 1.25, rotation: 15, duration: 0.12, ease: "expo.out" }, 7.25);
      tl.to("#f06-reticle-in", { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.12, ease: "expo.out" }, 7.55);
      tl.fromTo("#f06-lock", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, 7.62);
      // speed lines stream behind both birds
      tl.fromTo("#f06-falcon-streaks", { opacity: 0 }, { opacity: 0.85, duration: 0.3, ease: "power1.out" }, 7.35);
      tl.fromTo("#f06-pigeon-streaks", { opacity: 0 }, { opacity: 0.5, duration: 0.3, ease: "power1.out" }, 7.45);
      tl.fromTo("#f06-falcon-streaks", { strokeDashoffset: 0 }, { strokeDashoffset: 312, duration: TC - 7.35, ease: "none" }, 7.35);
      tl.fromTo("#f06-pigeon-streaks", { strokeDashoffset: 0 }, { strokeDashoffset: 184, duration: TC - 7.45, ease: "none" }, 7.45);
      // angle marker gets out of the way as the range closes
      tl.to("#f06-angle", { opacity: 0, duration: 0.4, ease: "power1.in" }, 8.3);

      // contact
      tl.to(["#f06-falcon-streaks", "#f06-pigeon-streaks"], { opacity: 0, duration: 0.2, ease: "power1.out" }, TC);
      tl.to("#f06-pigeon", { opacity: 0, duration: 0.14, ease: "power1.in" }, TC);
      tl.to("#f06-reticle-in", { scale: 0.78, duration: 0.18, ease: "expo.out" }, TC);
      tl.fromTo("#f06-burst", { opacity: 0, scale: 0.35, svgOrigin: CX + " " + CY }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, TC);
      tl.to("#f06-burst", { opacity: 0.6, duration: 0.8, ease: "power1.out" }, TC + 0.4);
      feathers.forEach(function (fe, fi) {
        tl.fromTo(fe.el, { opacity: 0, x: 0, y: 0, rotation: 0, svgOrigin: CX + " " + CY },
          { opacity: 0.9, x: fe.dx, y: fe.dy, rotation: fe.rot, duration: 0.85, ease: "power2.out" }, TC + 0.02 + fi * 0.015);
      });
      // impact shake: 5px, 0.25 s, seeded
      var kS = [];
      for (var si = 0; si < 6; si++) {
        var amp = 5 * (1 - si / 6);
        kS.push({ x: r2((rand() * 2 - 1) * amp), y: r2((rand() * 2 - 1) * amp), duration: 0.04, ease: "none" });
      }
      kS.push({ x: 0, y: 0, duration: 0.01, ease: "none" });
      tl.to("#f06-shake", { keyframes: kS }, TC);
      // CONTACT stamp lands and holds
      tl.fromTo("#f06-stamp", { opacity: 0, scale: 1.25, rotation: -6 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.3, ease: "expo.out" }, TC + 0.04);

      // full-length anchor
      tl.to({}, { duration: DUR }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
