<script>
  (function () {
    var ID = "07-nearly-vanished";
    var DUR = 13.449;
    window.__timelines = window.__timelines || {};

    // ---- seeded PRNG (mulberry32) for paper flecks ----
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    var rand = mulberry32(70707);
    var flecks = document.getElementById("f07-flecks");
    for (var i = 0; i < 70; i++) {
      var d = document.createElement("div");
      d.className = "f07-fleck";
      var s = 1.5 + rand() * 2.5;
      d.style.left = (rand() * 1080).toFixed(1) + "px";
      d.style.top = (rand() * 1920).toFixed(1) + "px";
      d.style.width = s.toFixed(1) + "px";
      d.style.height = s.toFixed(1) + "px";
      d.style.opacity = (0.06 + rand() * 0.10).toFixed(3);
      flecks.appendChild(d);
    }

    // ---- stroke-draw prep (lengths measured once, deterministic) ----
    function prepDraw(el) {
      var len = el.getTotalLength();
      el.style.strokeDasharray = len + " " + len;
      el.style.strokeDashoffset = len;
      return len;
    }
    function draw(tl, el, at, dur, ease) {
      var len = prepDraw(el);
      tl.fromTo(el, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
    }

    var tl = gsap.timeline({ paused: true });

    // ================= MACRO CAMERA (whole shot) =================
    tl.fromTo("#f07-stage", { scale: 1 }, { scale: 1.02, duration: DUR, ease: "none" }, 0);
    tl.fromTo("#f07-imgs", { scale: 1.02 }, { scale: 1.08, duration: DUR, ease: "sine.inOut" }, 0);

    // ================= SCENE 1 (0.0–3.0) "nearly vanished" =================
    // plate is on screen from frame 0 (transition_in is a blur-crossfade)
    tl.fromTo("#f07-mat", { opacity: 0.85 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

    tl.fromTo("#f07-img-sepia", { opacity: 0 }, { opacity: 1, duration: 2.6, ease: "sine.inOut" }, 0.3);
    // plate caption writes on
    tl.fromTo("#f07-plate-label", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.out" }, 0.6);
    tl.fromTo("#f07-plate-latin", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 1.5);
    // "vanished" — the falcons fade toward the mat
    tl.fromTo("#f07-fade", { opacity: 0 }, { opacity: 0.32, duration: 1.4, ease: "sine.inOut" }, 2.2);

    // ================= SCENE 2 (3.0–6.8) "DDT thinned its eggshells" =================
    var divline = document.getElementById("f07-divline");
    draw(tl, divline, 3.0, 0.9, "power2.inOut");
    tl.fromTo("#f07-wash", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" }, 3.1);

    // egg self-draws (both clipped halves in sync)
    var shells = document.querySelectorAll("#f07-egg .f07-shell");
    shells.forEach(function (p) { draw(tl, p, 3.15, 1.25, "power2.inOut"); });
    var inners = document.querySelectorAll("#f07-egg .f07-inner-path");
    tl.fromTo(inners, { opacity: 0 }, { opacity: 0.85, duration: 0.6, ease: "power1.out" }, 3.9);
    draw(tl, document.getElementById("f07-ground"), 3.6, 0.8, "power2.out");

    // DDT stamp lands on its word (~4.0s)
    tl.fromTo("#f07-stamp", { opacity: 0, scale: 1.18, rotation: -11 }, { opacity: 0.88, scale: 1, rotation: -8, duration: 0.38, ease: "power2.out" }, 4.02);

    // pen hatching
    var hatches = document.querySelectorAll("#f07-egg .f07-hatch");
    hatches.forEach(function (h, k) { draw(tl, h, 4.45 + k * 0.09, 0.45, "power1.out"); });

    // "thinned" — the shell's inner wall creeps out toward the outer wall
    tl.fromTo("#f07-egg .f07-inner", { scale: 0.86, svgOrigin: "180 250" }, { scale: 0.965, svgOrigin: "180 250", duration: 0.9, ease: "power2.inOut" }, 4.85);

    // the crack runs across the shell
    draw(tl, document.getElementById("f07-crack"), 5.55, 0.42, "expo.out");
    draw(tl, document.getElementById("f07-crack-branch"), 5.85, 0.25, "power2.out");
    // halves part — slow, sad
    tl.fromTo("#f07-half-top", { x: 0, y: 0, rotation: 0, svgOrigin: "48 282" }, { x: -3, y: -9, rotation: -4, svgOrigin: "48 282", duration: 0.9, ease: "power3.out" }, 6.0);
    tl.fromTo("#f07-crack", { x: 0, y: 0 }, { x: -1.5, y: -4.5, duration: 0.9, ease: "power3.out" }, 6.0);

    // ================= SCENE 3 (6.8–13.45) "By 1975 … 324 breeding pairs … North America" =================
    // year types on with "1975" (~6.8s)
    var chars = document.querySelectorAll("#f07-year .f07-ch");
    chars.forEach(function (c, k) {
      tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, 6.95 + k * 0.12);
    });
    // ledger rule drafts down the column
    draw(tl, document.getElementById("f07-ledger-rule"), 7.4, 1.2, "power2.inOut");
    // attention shifts: plate and egg recede a touch
    tl.fromTo("#f07-fade", { opacity: 0.32 }, { opacity: 0.45, duration: 1.4, ease: "sine.inOut", immediateRender: false }, 7.9);
    tl.fromTo(["#f07-egg", "#f07-wash"], { opacity: 1 }, { opacity: 0.72, duration: 1.4, ease: "sine.inOut", immediateRender: false }, 8.0);
    tl.fromTo("#f07-stamp", { opacity: 0.88 }, { opacity: 0.64, duration: 1.4, ease: "sine.inOut", immediateRender: false }, 8.0);

    // the figure surfaces from the blur — only the real number is ever shown
    var countEl = document.getElementById("f07-count");
    tl.fromTo(countEl, { opacity: 0, filter: "blur(14px)", y: -36 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 1.45, ease: "power3.out" }, 8.9);
    tl.fromTo(countEl, { scale: 1.04 }, { scale: 1, duration: 1.2, ease: "power3.out" }, 9.6);

    tl.fromTo("#f07-pairs", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.85, ease: "power2.out" }, 10.65);
    tl.fromTo("#f07-source", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 11.55);

</script>
