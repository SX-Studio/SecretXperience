      var fl = 0.55 + 0.45 * Math.sin(p.ph + t * 11);
      p.pos.setAttribute("transform", "translate(" + r1(x) + " " + r1(y) + ") scale(" + (Math.round(s * 1000) / 1000) + ")");
      p.flap.setAttribute("transform", "scale(1 " + (Math.round(fl * 1000) / 1000) + ")");
    }
  }
  placePigeons(0);

  // ---------------- timeline ----------------
  var tl = gsap.timeline({ paused: true });
  var DUR = 10.953;

  // Scene 1 (0.0–4.0): two notes write on, ticked off like a checklist
  tl.fromTo("#f08-wash-olive", { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 0.2, scale: 1, duration: 1.8, ease: "power2.out" }, 0);
  tl.fromTo(q("#f08-box1"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 0.05);
  tl.fromTo(q("#f08-box2"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 0.2);

  tl.fromTo(q("#f08-note1"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.0, ease: "power1.inOut" }, 0.3);
  tl.fromTo(q("#f08-tick1"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 1.45);
  tl.fromTo(q("#f08-note2"), { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 1.25, ease: "power1.inOut" }, 1.9);
  tl.fromTo(q("#f08-tick2"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 3.35);

  // Scene 2 (4.0–6.4): ledger rule, wash bleeds, stamp lands
  tl.fromTo("#f08-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 4.0);
  tl.fromTo("#f08-wash-stamp", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 0.24, scale: 1, duration: 1.5, ease: "power2.out" }, 4.15);
  tl.fromTo("#f08-stampwrap",
    { opacity: 0, scale: 1.32, rotation: -9 },
    { opacity: 0.88, scale: 1, rotation: -4, duration: 0.34, ease: "power3.out" }, 4.55);
  tl.fromTo("#f08-stamp", { scale: 1.0 }, { scale: 0.985, duration: 0.12, ease: "power1.out" }, 4.89);
  tl.fromTo(q("#f08-ground"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" }, 5.45);

  // Scene 3 (6.4–11.0): skyline draws upward, falcon lands on the ledge, pigeons circle
  tl.fromTo("#f08-wash-dawn", { opacity: 0, scale: 0.85, transformOrigin: "50% 70%" }, { opacity: 0.26, scale: 1, duration: 1.8, ease: "power2.out" }, 4.40);
  tl.fromTo("#f08-wash-park", { opacity: 0 }, { opacity: 0.2, duration: 1.4, ease: "power2.out" }, 4.60);
  var order = { d1: 4.4, d4: 4.45, d2: 4.55, d3: 4.6, a: 4.5, b: 4.65, c: 4.8, d: 4.95, t: 5.0 };
  towerAnims.forEach(function (ta) {
    var dur = ta.key === "t" ? 1.05 : (ta.distant ? 0.8 : 0.75);
    tl.fromTo(ta.rect, { attr: { y: BASE + 10 } }, { attr: { y: ta.top }, duration: dur, ease: "power2.inOut" }, order[ta.key]);
  });

  // falcon swoops in from upper right and settles on the cornice (speed lines trail)
  tl.fromTo("#f08-falcon", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, 6.90);
  tl.fromTo("#f08-falcon",
    { x: 240, y: -232, rotation: -32, scale: 0.85, transformOrigin: "50% 100%" },
    { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.58, ease: "power3.out" }, 6.90);
  ["#f08-sl1", "#f08-sl2", "#f08-sl3"].forEach(function (s, i) {
    tl.fromTo(q(s), { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0.85 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 6.92 + i * 0.03);
    tl.fromTo(q(s), { opacity: 0.85 }, { opacity: 0, duration: 0.3, ease: "power1.in", immediateRender: false }, 7.32 + i * 0.03);
  });

  // compass ring marks the nest ledge
  tl.fromTo(q("#f08-ring"), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 7.55);
  tl.fromTo("#f08-ticks", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 8.1);

  // pigeons appear and keep circling through the hold
  pigeons.forEach(function (p, i) {
    tl.fromTo(p.outer, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 8.7 + i * 0.09);
  });
  var orbit = { t: 0 };
  tl.fromTo(orbit, { t: 0 }, {
    t: DUR - 8.6, duration: DUR - 8.6, ease: "none",
    onUpdate: function () { placePigeons(orbit.t); }
  }, 8.6);

  // documentary push-in under scene 3
  tl.fromTo("#f08-stage", { scale: 1, transformOrigin: "600px 1000px" }, { scale: 1.025, duration: DUR - 6.4, ease: "power1.inOut" }, 6.4);

  // pin the timeline to the frame's exact length
  tl.set({}, {}, DUR);

  window.__timelines = window.__timelines || {};
  window.__timelines[ID] = tl;
})();
</script>
</template>
