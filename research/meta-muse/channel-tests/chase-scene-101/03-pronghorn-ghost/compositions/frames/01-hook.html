  <style>

    #root {

      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    /* ---- background photo layer (camera lives on the img) ---- */
    #f01-hook-photo {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    #f01-hook-photo-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: 38% 50%;
      transform-origin: 50% 50%;
      transform: scale(1.12) translateX(0px);

    /* ---- documentary grade: top + bottom legibility gradients ---- */
    #f01-hook-grade {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
    }
    #f01-hook-grade-top {
      position: absolute;
      left: 0;

      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0));

    #f01-hook-grade-bottom {
      position: absolute;
      left: 0;
      top: 1450px;
      width: 1080px;
      height: 470px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.5));
    }

    /* ---- speed lines (screen space) ---- */
    #f01-hook-speed {
      position: absolute;
      inset: 0;
      width: 1080px;

      pointer-events: none;

    .f01-hook-streak {

      background: linear-gradient(to right, rgba(239, 230, 210, 0.95), rgba(239, 230, 210, 0));

    /* ---- tag: arrow + label card (tracks the camera) ---- */
    #f01-hook-tag {
      position: absolute;

      height: 1920px;
      pointer-events: none;

    #f01-hook-arrow {

      height: 1920px;
      overflow: visible;

    #f01-hook-card {

      padding: 16px 28px 18px 28px;

    #f01-hook-label {

    /* ---- readout chip bottom-left of content zone ---- */

    #f01-hook-readout-dot {

    #f01-hook-readout-text {

      letter-spacing: 0.06em;
      color: #c2412d;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-width="1080" data-height="1920">
    <!-- track 0: full-bleed field photo (public-domain U.S. government work) -->
    <div id="f01-hook-photo" class="clip" data-start="0" data-duration="3.749" data-track-index="0">
      <img id="f01-hook-photo-img" src="public/ph-148319074.jpg" alt="" />
    </div>

    <!-- track 1: grade -->
    <div id="f01-hook-grade" class="clip" data-start="0" data-duration="3.749" data-track-index="1">
      <div id="f01-hook-grade-top"></div>
      <div id="f01-hook-grade-bottom"></div>
    </div>

    <!-- track 2: speed lines (populated by script, seeded) -->
    <div id="f01-hook-speed" class="clip" data-start="0" data-duration="3.749" data-track-index="2"></div>

    <!-- track 3: arrow + label, rides the camera so it stays on the animal -->
    <div id="f01-hook-tag" class="clip" data-start="0" data-duration="3.749" data-track-index="3" data-layout-allow-overflow>
      <svg id="f01-hook-arrow" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <g id="f01-hook-arrow-g">
          <path
            id="f01-hook-arrow-shaft"
            d="M 680 624 Q 636 702 518 698"
            fill="none"
            stroke="#C2412D"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            id="f01-hook-arrow-head"
            d="M 556 670 L 512 698 L 554 728"
            fill="none"
            stroke="#C2412D"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
      </svg>
      <div id="f01-hook-card">
        <div id="f01-hook-label"><span class="f01-hook-ch">P</span><span class="f01-hook-ch">R</span><span class="f01-hook-ch">O</span><span class="f01-hook-ch">N</span><span class="f01-hook-ch">G</span><span class="f01-hook-ch">H</span><span class="f01-hook-ch">O</span><span class="f01-hook-ch">R</span><span class="f01-hook-ch">N</span></div>
        <div id="f01-hook-underline"></div>
      </div>

    <!-- track 4: telemetry readout -->
    <div id="f01-hook-readout" class="clip" data-start="0" data-duration="3.749" data-track-index="4">
      <div id="f01-hook-readout-dot"></div>
      <div id="f01-hook-readout-text"><span class="f01-hook-rch">N</span><span class="f01-hook-rch">O</span><span class="f01-hook-rch">R</span><span class="f01-hook-rch">T</span><span class="f01-hook-rch">H</span><span class="f01-hook-rch">&nbsp;</span><span class="f01-hook-rch">A</span><span class="f01-hook-rch">M</span><span class="f01-hook-rch">E</span><span class="f01-hook-rch">R</span><span class="f01-hook-rch">I</span><span class="f01-hook-rch">C</span><span class="f01-hook-rch">A</span></div>
    </div>
  </div>

  <script>
    (function () {
      var FRAME_ID = "01-hook";
      var DUR = 3.749;
      var root = document.querySelector('[data-composition-id="01-hook"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      // ---------- seeded PRNG (mulberry32) ----------
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rnd = mulberry32(14830107);
      var rr = function (a, b) {
        return a + (b - a) * rnd();
      };

      // ---------- single camera state + single writer ----------
      // Frame 0 = scale 1.12, translateX 0 (loop seam with frame 5 — keep exact).
      var C = { x: 540, y: 960 };
      var S0 = 1.12;
      var cam = { s: S0, x: 0 };
      // Arrow-tip anchor on the animal's head, in un-transformed box coords.
      var ANCHOR = { x: 540 + (518 - 540) / S0, y: 960 + (698 - 960) / S0 };
      var img = q("#f01-hook-photo-img");
      var tag = q("#f01-hook-tag");
      function applyCamera() {
        img.style.transform = "translateX(" + cam.x.toFixed(3) + "px) scale(" + cam.s.toFixed(5) + ")";
        var dx = cam.x + (ANCHOR.x - C.x) * (cam.s - S0);
        var dy = (ANCHOR.y - C.y) * (cam.s - S0);
        tag.style.transform = "translate(" + dx.toFixed(3) + "px," + dy.toFixed(3) + "px)";
      }
      applyCamera();

      var tl = gsap.timeline({ paused: true });

      // LEG 1 (0 – 2.24s): slow tracking pan with the runner + gentle push.
      tl.fromTo(
        cam,
        { s: S0, x: 0 },
        { s: 1.15, x: 34, duration: 2.24, ease: "sine.inOut", onUpdate: applyCamera },
        0
      );
      // LEG 2 (2.24s – end, on "catch"): push accelerates — the chase tightens.
      tl.fromTo(
        cam,
        { s: 1.15, x: 34 },
        { s: 1.215, x: 84, duration: DUR - 2.24, ease: "power2.in", onUpdate: applyCamera, immediateRender: false },
        2.24
      );

      // ---------- Scene 2 (0.4–1.2s): arrow pops in, label types on ----------
      var shaft = q("#f01-hook-arrow-shaft");
      var shaftLen = shaft.getTotalLength();
      gsap.set(shaft, { strokeDasharray: shaftLen });
      tl.fromTo(
        "#f01-hook-arrow-g",
        { scale: 0.6, opacity: 0, svgOrigin: "560 680" },
        { scale: 1, opacity: 1, svgOrigin: "560 680", duration: 0.25, ease: "expo.out" },
        0.4
      );
      tl.fromTo(shaft, { strokeDashoffset: shaftLen }, { strokeDashoffset: 0, duration: 0.22, ease: "power3.out" }, 0.4);

      tl.fromTo(
        "#f01-hook-card",
        { scale: 0.86, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: "power3.out" },
        0.5
      );
      var chars = qa(".f01-hook-ch");
      gsap.set(chars, { opacity: 0 });
      chars.forEach(function (ch, i) {
        tl.set(ch, { opacity: 1 }, 0.56 + i * 0.055);
      });

      // ---------- Scene 3 (1.2–3.5s): speed lines streak right-to-left ----------
      var speed = q("#f01-hook-speed");
      // bands of open grass ahead of the chest and through/below the legs (clear of the head, card and readout)
      var bands = [
        { y0: 1000, y1: 1120, e0: -80, e1: 140, n: 5 },
        { y0: 1170, y1: 1300, e0: 60, e1: 420, n: 9 },
        { y0: 1320, y1: 1410, e0: -40, e1: 320, n: 8 }
      ];
      var streaks = [];
      bands.forEach(function (b) {
        for (var i = 0; i < b.n; i++) {
          streaks.push({
            y: rr(b.y0, b.y1),
            len: rr(160, 420),
            h: rr(2, 4.5),
            xEnd: rr(b.e0, b.e1),
            pale: rnd() < 0.3
          });
        }
      });
      // spread start times across 1.2–3.45 s (seeded order)
      var nS = streaks.length;
      streaks.forEach(function (s, i) {
        var el = document.createElement("div");
        el.className = "f01-hook-streak" + (s.pale ? " f01-hook-streak-pale" : "");
        el.style.width = s.len.toFixed(1) + "px";
        el.style.height = s.h.toFixed(2) + "px";
        el.style.top = s.y.toFixed(1) + "px";
        speed.appendChild(el);
        var t0 = 1.2 + (i / nS) * 2.25 + rr(-0.06, 0.06);
        if (t0 < 1.2) t0 = 1.2;
        var d = rr(0.32, 0.46);
        tl.fromTo(el, { x: 1100 + rr(0, 80) }, { x: s.xEnd, duration: d, ease: "power2.out" }, t0);
        tl.fromTo(el, { opacity: 0 }, { opacity: 0.95, duration: d * 0.25, ease: "none" }, t0);
        tl.fromTo(el, { opacity: 0.95 }, { opacity: 0, duration: d * 0.45, ease: "power1.in", immediateRender: false }, t0 + d * 0.55);
      });

      // ---------- "NORTH AMERICA" readout at ~2.0s ----------
      tl.fromTo(
        "#f01-hook-readout",
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.24, ease: "power3.out" },
        1.92
      );
      var rch = qa(".f01-hook-rch");
      gsap.set(rch, { opacity: 0 });
      rch.forEach(function (ch, i) {
        tl.set(ch, { opacity: 1 }, 1.98 + i * 0.035);
      });

      // ---------- "this animal" (2.64–3.36s): arrow jabs, label underlines ----------
      tl.fromTo("#f01-hook-arrow", { x: 0, y: 0 }, { x: -16, y: 4, duration: 0.14, ease: "power2.out" }, 2.64);
      tl.fromTo(
        "#f01-hook-arrow",
        { x: -16, y: 4 },
        { x: 0, y: 0, duration: 0.3, ease: "power2.inOut", immediateRender: false },
        2.78
      );
      tl.fromTo("#f01-hook-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out" }, 2.9);

      // pad timeline to the exact frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
