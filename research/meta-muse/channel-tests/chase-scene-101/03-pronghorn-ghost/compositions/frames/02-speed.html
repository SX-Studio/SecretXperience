  <script>
    (function () {
      var FRAME_ID = "02-speed";
      var DUR = 7.603;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      var q = function (s) {
        return root.querySelector(s);
      };

      // seeded PRNG (mulberry32) — no Math.random
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(0x02f55);

      var tl = gsap.timeline({ paused: true });

      // ---------- camera: slow push + pan in the running direction (herd faces left -> image drifts right)
      tl.fromTo(
        q("#f02-img"),
        { x: 0, scale: 1.06 },
        { x: 150, scale: 1.12, duration: DUR, ease: "sine.inOut" },
        0
      );

      // ---------- speed lines (seeded, one element per streak event)
      var streakBox = q("#f02-streaks");
      var t = 0.12;
      var k = 0;
      while (t < DUR - 0.5) {
        var el = document.createElement("div");
        el.className = "f02-streak" + (k % 3 === 2 ? " f02-red" : "");
        var len = 140 + Math.round(rand() * 160);
        var top = 1120 + Math.round(rand() * 360);
        var left = 240 + Math.round(rand() * 620);
        el.style.width = len + "px";
        el.style.top = top + "px";
        el.style.left = left + "px";
        streakBox.appendChild(el);
        tl.fromTo(
          el,
          { x: 0, scaleX: 0.35, opacity: 0 },
          { x: 90, scaleX: 1, opacity: 0.85, duration: 0.14, ease: "power2.out" },
          t
        );
        tl.to(el, { x: 240, opacity: 0, duration: 0.3, ease: "power1.in" }, t + 0.14);
        // denser during the speed beat (0-2.6s), sparser after
        t += (t < 2.6 ? 0.22 : 0.42) + rand() * 0.14;
        k++;
      }

      // ---------- Scene 1: stat card slams on "55" (1.04s)
      var SLAM = 0.98;
      tl.fromTo(
        q("#f02-statcard"),
        { scale: 1.2, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "expo.out" },
        SLAM
      );
      tl.fromTo(
        q("#f02-statlabel"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        SLAM + 0.12
      );

      // count-up 0 -> 55 with dynamic scale (seek-safe: innerText is a tweened property, no callbacks)
      var numEl = q("#f02-num");
      tl.fromTo(
        numEl,
        { innerText: 0 },
        { innerText: 55, snap: { innerText: 1 }, duration: 0.9, ease: "expo.out" },
        SLAM
      );
      tl.fromTo(numEl, { scale: 0.78 }, { scale: 1, duration: 0.9, ease: "expo.out" }, SLAM);

      // 1-frame red underline flash, then a persistent rule draws in
      tl.fromTo(q("#f02-flash"), { opacity: 0 }, { opacity: 1, duration: 0.001 }, SLAM + 0.08);
      tl.to(q("#f02-flash"), { opacity: 0, duration: 0.001 }, SLAM + 0.08 + 1 / 30);
      tl.fromTo(
        q("#f02-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.35, ease: "power3.out" },
        SLAM + 0.15
      );

      // MPH suffix lands after the count, on "miles" (1.68s)
      tl.fromTo(
        q("#f02-mph"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" },
        1.68
      );

      // impact shake (seeded, max 6px, 0.25s) on photo + card
      var shakeTargets = [q("#f02-shake"), q("#f02-statshake")];
      var st = SLAM + 0.04;
      var steps = 6;
      for (var i = 0; i < steps; i++) {
        var amp = 6 * (1 - i / steps);
        var dx = Math.round((rand() * 2 - 1) * amp);
        var dy = Math.round((rand() * 2 - 1) * amp);
        tl.to(shakeTargets, { x: dx, y: dy, duration: 0.25 / steps, ease: "none" }, st + (i * 0.25) / steps);
      }
      tl.to(shakeTargets, { x: 0, y: 0, duration: 0.04, ease: "none" }, st + 0.25);

      // ---------- Scene 2: dashed track draws on "keep running" (2.8s), note writes on "for" (3.44s)
      tl.fromTo(
        q("#f02-trackdraw"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" },
        2.78
      );
      tl.fromTo(
        q("#f02-arrow"),
        { scale: 0.6, opacity: 0, transformOrigin: "30% 50%" },
        { scale: 1, opacity: 1, duration: 0.25, ease: "expo.out" },
        3.92
      );
      tl.fromTo(
        q("#f02-note"),
        { clipPath: "inset(-30% 100% -30% -6%)" },
        { clipPath: "inset(-30% -6% -30% -6%)", duration: 0.7, ease: "power1.inOut" },
        3.44
      );

      // ---------- Scene 3: quick card swap to the bar race (4.25s, "Wolves" at 4.4s)
      var SWAP = 4.22;
      tl.to(q("#f02-statcard"), { x: -760, duration: 0.3, ease: "power3.in" }, SWAP);
      tl.to(q("#f02-note"), { opacity: 0, duration: 0.25, ease: "power1.in" }, SWAP);
      tl.fromTo(
        q("#f02-barcard"),
        { x: 1100 },
        { x: 0, duration: 0.42, ease: "power3.out" },
        SWAP + 0.14
      );

      // bars: scale 0-70 mph across 840px
      var FULL = 70;
      function bar(fillSel, valSel, target, at, dur, ease) {
        tl.fromTo(q(fillSel), { scaleX: 0 }, { scaleX: target / FULL, duration: dur, ease: ease }, at);
        // counter shares the bar's timing + ease; seek-safe property tween
        tl.fromTo(
          q(valSel),
          { innerText: 0 },
          { innerText: target, snap: { innerText: 1 }, duration: dur, ease: ease },
          at
        );
      }
      // PRONGHORN shoots to 55 first
      bar("#f02-b1", "#f02-v1", 55, 4.62, 0.75, "expo.out");
      // COYOTE + WOLF grow and stop short, landing on "40." (6.72s)
      // approximate values: bars grow, the "≈40" label appears as they stop (no count-up through other numbers)
      tl.fromTo(q("#f02-b2"), { scaleX: 0 }, { scaleX: 40 / FULL, duration: 1.68, ease: "power2.out" }, 5.04);
      tl.fromTo(q("#f02-b3"), { scaleX: 0 }, { scaleX: 40 / FULL, duration: 1.6, ease: "power2.out" }, 5.12);
      tl.fromTo(q("#f02-a2"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 6.5);
      tl.fromTo(q("#f02-a3"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 6.55);

      // finish line at 55 drops once the predators stop short
      tl.fromTo(
        q("#f02-finish"),
        { scaleY: 0 },
        { scaleY: 1, duration: 0.35, ease: "power3.out" },
        6.76
      );

      // source chip

        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },

      );
