    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FID = "04-american-cheetah";
        var D = 9.118;
        var $ = function (id) { return document.getElementById(id); };

        // ---- seeded PRNG (deterministic) ----
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(40411);

        // ---- seeded film grain, drawn once at setup ----
        var cv = $("f04-grain");
        var ctx = cv.getContext("2d");
        var gw = cv.width, gh = cv.height;
        var im = ctx.createImageData(gw, gh);
        var px = im.data;
        for (var i = 0; i < gw * gh; i++) {
          var v = Math.floor(rnd() * 256);
          px[i * 4] = v; px[i * 4 + 1] = v; px[i * 4 + 2] = v; px[i * 4 + 3] = 255;
        }
        ctx.putImageData(im, 0, 0);

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        function cont(o) { o.immediateRender = false; return o; }

        // ================= CAMERA (multi-leg, one state per element) =================
        var cam = $("f04-cam"), pan = $("f04-pan");
        // Leg 1 — slow push while the clock rewinds
        tl.fromTo(cam, { scale: 1 }, { scale: 1.025, duration: 2.3, ease: "sine.inOut" }, 0);
        tl.fromTo(pan, { x: 0 }, { x: -30, duration: 2.3, ease: "sine.inOut" }, 0);
        // Leg 2 — the chase: camera travels with the herd as the ghost arrives
        tl.fromTo(cam, { scale: 1.025 }, cont({ scale: 1.05, duration: 1.6, ease: "power2.inOut" }), 2.3);
        tl.fromTo(pan, { x: -30 }, cont({ x: -90, duration: 1.6, ease: "power2.inOut" }), 2.3);
        // Leg 3 — documentary drift, holds never die
        tl.fromTo(cam, { scale: 1.05 }, cont({ scale: 1.065, duration: D - 3.9, ease: "sine.inOut" }), 3.9);
        tl.fromTo(pan, { x: -90 }, cont({ x: -125, duration: D - 3.9, ease: "sine.inOut" }), 3.9);

        // ================= GRADE: colour -> sepia, grain, flicker, scratches =================
        tl.fromTo("#f04-sepia", { opacity: 0 }, { opacity: 1, duration: 1.5, ease: "power1.inOut" }, 0.15);
        tl.fromTo(cv, { opacity: 0 }, { opacity: 0.22, duration: 1.2, ease: "power1.inOut" }, 0.3);
        tl.fromTo("#f04-dark", { opacity: 0 }, { opacity: 0.2, duration: 0.7, ease: "power2.inOut" }, 2.5);

        var steps = Math.floor(D * 12);
        for (var s = 0; s <= steps; s++) {
          var ts = s / 12;
          tl.set(cv, { x: Math.round(rnd() * 80 - 40), y: Math.round(rnd() * 80 - 40) }, ts);
          tl.set("#f04-flicker", { opacity: ts < 0.4 ? 0 : +(rnd() * 0.05).toFixed(3) }, ts);
        }
        var sSteps = Math.floor(D * 6);
        for (var k = 0; k <= sSteps; k++) {
          var tk = k / 6;
          var on1 = tk > 1.0 && rnd() > 0.55;
          var on2 = tk > 1.0 && rnd() > 0.7;
          tl.set("#f04-scr1", { x: Math.round(rnd() * 1060), opacity: on1 ? +(0.08 + rnd() * 0.14).toFixed(3) : 0 }, tk);
          tl.set("#f04-scr2", { x: Math.round(rnd() * 1060), opacity: on2 ? +(0.06 + rnd() * 0.1).toFixed(3) : 0 }, tk);
        }

        // ================= SCENE 1: readout rewinds TODAY -> 12,000 YEARS AGO =================
        var numEl = $("f04-num");
        var cnt = { v: 0 };
        function fmt(val) {
          if (val < 1) return "TODAY";
          var n = val >= 11999.5 ? 12000 : Math.round(val / 50) * 50;
          if (n < 1) n = Math.max(1, Math.round(val));
          return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        tl.fromTo("#f04-suffix", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.5);
        tl.fromTo(cnt, { v: 0 }, {
          v: 12000, duration: 0.94, ease: "power2.out",
          onUpdate: function () { numEl.textContent = fmt(cnt.v); }
        }, 0.56);
        tl.fromTo("#f04-head", { x: 0 }, { x: -682, duration: 0.94, ease: "power2.out" }, 0.56);
        // land on "years ago"
        tl.fromTo(numEl, { scale: 1.1 }, cont({ scale: 1, duration: 0.45, ease: "expo.out" }), 1.5);
        tl.fromTo("#f04-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 1.5);
        // tuck the readout to make room for the chase ("these plains")
        tl.fromTo("#f04-readout", { scale: 1, y: 0 }, cont({ scale: 0.5, y: -6, duration: 0.65, ease: "power3.inOut" }), 2.3);

        // ================= SCENE 2: ghost streaks in on "hunted"; track; specimen label =================
        tl.fromTo("#f04-ghost", { x: -760, opacity: 0 }, { x: -150, opacity: 1, duration: 0.85, ease: "expo.out" }, 2.95);
        tl.fromTo("#f04-gblur", { x: -170 }, { x: -40, duration: 0.85, ease: "expo.out" }, 2.95);
        tl.fromTo("#f04-ghost", { x: -150 }, cont({ x: -160, duration: D - 3.8, ease: "sine.inOut" }), 3.8);
        // gallop bob (deterministic sequence of arcs)
        var gb = $("f04-gbob");
        for (var b = 3.8; b + 0.42 <= D; b += 0.42) {
          tl.fromTo(gb, { y: 0, rotation: 0 }, cont({ y: -10, rotation: -0.8, duration: 0.21, ease: "sine.out" }), b);
          tl.fromTo(gb, { y: -10, rotation: -0.8 }, cont({ y: 0, rotation: 0, duration: 0.21, ease: "sine.in" }), b + 0.21);
        }
        // speed lines trailing the streak
        for (var sl = 0; sl < 6; sl++) {
          var el = "#f04-sp" + sl;
          tl.fromTo(el, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.28, ease: "power2.out" }, 3.0 + sl * 0.03);
          tl.fromTo(el, { opacity: 1 }, cont({ opacity: 0, duration: 0.3, ease: "power1.out" }), 3.5 + sl * 0.04);
        }
        // red telemetry track draws under the chase
        tl.fromTo("#f04-track",
          { clipPath: "inset(0px 1080px 0px 0px)" },
          { clipPath: "inset(0px 0px 0px 0px)", duration: 1.5, ease: "power2.inOut" }, 3.0);
        // specimen label drops in on "American cheetah"
        tl.fromTo("#f04-label", { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.7);
        tl.fromTo("#f04-stamp", { scale: 1.4, rotation: -8, opacity: 0 }, { scale: 1, rotation: -8, opacity: 0.9, duration: 0.3, ease: "expo.out" }, 4.5);

        // ================= SCENE 3: "Scientists think..." — source, note, hold with chase =================
        tl.fromTo("#f04-chip", { x: -30, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 5.12);
        tl.fromTo("#f04-note",
          { clipPath: "inset(-30px 700px -30px -30px)" },
          { clipPath: "inset(-30px -30px -30px -30px)", duration: 1.35, ease: "none" }, 5.45);
        // underline "speed" on "fast"
        tl.fromTo("#f04-speedline", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 7.36);
        // ghost flares on "it."
        tl.fromTo("#f04-gmain", { opacity: 0.5 }, cont({ opacity: 0.78, duration: 0.22, ease: "power2.out" }), 8.4);
        tl.fromTo("#f04-gmain", { opacity: 0.78 }, cont({ opacity: 0.56, duration: 0.45, ease: "power2.inOut" }), 8.62);

        window.__timelines[FID] = tl;
      })();
