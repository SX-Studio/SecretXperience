  <style>

#root, #root * { font-variant-numeric: lining-nums; }

  <div id="root" data-composition-id="05-loop" data-width="1080" data-height="1920">

  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 5.627;

      // ---- seeded PRNG (mulberry32) ----
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rnd = mulberry32(50519);

      // ---- dust motes: positions sampled offline from cheetah-ink.png ink pixels (per-mille of the box) ----
      var P = [735,74,779,107,791,91,115,891,739,76,337,159,383,767,174,417,883,100,719,536,42,713,217,763,429,233,281,358,271,648,593,193,731,615,743,609,355,103,302,169,581,131,268,157,638,409,169,403,651,563,891,275,808,983,748,130,808,301,113,547,115,503,899,163,356,427,798,112,396,468,227,239,682,221,753,524,338,417,241,653,167,431,165,402,204,249,383,447,833,163,260,625,451,453,678,508,374,384,169,408,77,609,428,131,5,705,980,101,473,470,854,118,390,325,562,218,701,488,727,911,353,577,797,44,379,124,301,115,796,215,391,582,402,142,505,384,814,172,767,474,361,770,479,352,373,482,348,344,343,607,308,509,705,577,664,477,805,134,590,426,565,233,760,100,63,745,134,409,247,644,370,678,433,184,652,335,69,569,901,97,760,156,736,850,528,474,778,79,754,314,291,654,211,139,648,438,561,195,722,133,365,731,406,63,291,592,204,299,603,949,268,393,518,506,670,699,734,574,272,556,616,125,661,470,884,245,840,148,269,417,46,627,346,367,297,89,327,349,404,131,316,402,358,601,611,929,814,361,677,308,715,165,381,455,90,568,57,637,57,674,403,140,914,147,296,438,399,358,384,468,357,412,281,228,562,459,813,343,291,387,381,736,954,24,342,606,957,189,494,168,359,725,420,225,346,745,667,378,562,495];
      var dust = document.getElementById("f05-dust");
      var motes = [];
      for (var i = 0; i < P.length; i += 2) {
        var m = document.createElement("div");
        m.className = "f05-mote";
        var s = 3 + Math.round(rnd() * 5);
        m.style.width = s + "px";
        m.style.height = s + "px";
        m.style.left = (P[i] / 1000 * 820 - s / 2).toFixed(1) + "px";
        m.style.top = (P[i + 1] / 1000 * 494 - s / 2).toFixed(1) + "px";
        dust.appendChild(m);
        motes.push({
          el: m,
          dx: -40 + rnd() * 260,      // drift with the wind, mostly forward
          dy: -50 - rnd() * 150,      // rising dust
          delay: rnd() * 0.38,
          life: 0.75 + rnd() * 0.6,
          peak: 0.55 + rnd() * 0.4
        });
      }

      // ---- speed lines: three seeded waves of streaks behind the pronghorn ----
      var speed = document.getElementById("f05-speed");
      var waves = [];
      for (var w = 0; w < 3; w++) {
        var lines = [];
        for (var k = 0; k < 8; k++) {
          var ln = document.createElement("div");
          ln.className = "f05-streak";
          var len = 160 + Math.round(rnd() * 240);
          var th = 2 + Math.round(rnd() * 2);
          ln.style.width = len + "px";
          ln.style.height = th + "px";
          ln.style.left = Math.round(330 - len - rnd() * 80) + "px";
          ln.style.top = Math.round(800 + rnd() * 480) + "px";
          ln.style.background = (k % 3 === 0) ? "#FFFFFF" : "#C2412D";
          speed.appendChild(ln);
          lines.push({ el: ln, delay: rnd() * 0.22 });
        }
        waves.push(lines);
      }

      var tl = gsap.timeline({ paused: true });

      // ===== Photo A camera: slow push, then it keeps going (never slows down) =====
      tl.fromTo("#f05-photo-a",
        { scale: 1.06, x: 0, filter: "sepia(0.85) saturate(0.55) brightness(0.78) contrast(1.06)" },
        { scale: 1.10, x: -24, duration: 2.4, ease: "sine.in" }, 0);
      tl.to("#f05-photo-a", { scale: 1.19, x: -110, duration: D - 2.4, ease: "none" }, 2.4);

      // Grade: stays dim through the ghost, colour floods back on "never" (Scene 2)
      tl.to("#f05-photo-a",
        { filter: "sepia(0.55) saturate(0.75) brightness(0.86) contrast(1.04)", duration: 0.8, ease: "sine.inOut" }, 1.0);
      tl.to("#f05-photo-a",
        { filter: "sepia(0) saturate(1.08) brightness(1) contrast(1)", duration: 1.3, ease: "power2.out" }, 1.9);

      // ===== Scene 1 (0.0–1.8): ghost on its heels, then "vanished." → dust =====
      tl.fromTo("#f05-ghost", { opacity: 0.5, x: 0 }, { opacity: 0.55, x: 44, duration: 0.96, ease: "sine.inOut" }, 0);
      tl.fromTo("#f05-ghost-main", { filter: "invert(1) brightness(1.15) drop-shadow(0 0 18px rgba(255,255,255,0.55)) blur(0px)" },
        { filter: "invert(1) brightness(1.15) drop-shadow(0 0 18px rgba(255,255,255,0.55)) blur(10px)", duration: 0.6, ease: "power2.in" }, 0.96);
      tl.to("#f05-ghost", { opacity: 0, x: 70, duration: 0.6, ease: "power2.in" }, 0.96);

      motes.forEach(function (mo) {
        var t0 = 0.96 + mo.delay;
        tl.fromTo(mo.el, { opacity: 0, x: 0, y: 0, scale: 1 },
          { opacity: mo.peak, x: mo.dx * 0.25, y: mo.dy * 0.25, duration: 0.22, ease: "power1.out" }, t0);
        tl.to(mo.el, { opacity: 0, x: mo.dx, y: mo.dy, scale: 0.4, duration: mo.life, ease: "sine.out" }, t0 + 0.22);
      });

      // ===== Scene 2 (1.8–4.0): speed lines + note writes on, red underline on "down." =====
      var waveAt = [2.42, 3.1, 3.7];
      waves.forEach(function (lines, wi) {
        lines.forEach(function (o) {
          var t0 = waveAt[wi] + o.delay;
          tl.fromTo(o.el, { opacity: 0, scaleX: 0, x: 0 },
            { opacity: 0.9, scaleX: 1, x: -40, duration: 0.14, ease: "power2.out" }, t0);
          tl.to(o.el, { opacity: 0, x: -220, duration: 0.34, ease: "power1.in" }, t0 + 0.14);
        });
      });

      tl.fromTo("#f05-note-text",
        { clipPath: "inset(-20% 100% -20% 0%)", y: 6 },

      tl.fromTo(ul, { strokeDashoffset: ulLen }, { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" }, 3.2);

      // Photo B: opacity only — its transform is the static CSS loop state, scale(1.12) translateX(0)
      tl.fromTo("#f05-photo-b", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.inOut" }, 4.4);

      tl.set({}, {}, D);
      window.__timelines["05-loop"] = tl;
    })();
