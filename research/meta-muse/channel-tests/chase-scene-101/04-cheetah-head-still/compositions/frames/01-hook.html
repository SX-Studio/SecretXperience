  <script>
    (function () {
      var DUR = 4.958;
      var FPS = 24;
      // s1.json head track, composite px, rounded ints, frames 0..123 at 24 fps (x,y pairs)
      var HEAD = [822,896,820,896,818,898,816,898,814,898,812,899,809,899,808,900,806,900,803,900,801,902,799,902,796,901,793,901,790,901,788,901,786,902,783,900,781,900,779,899,777,900,775,901,773,902,771,902,770,903,767,904,765,904,764,906,762,907,760,908,757,908,756,909,753,910,751,911,749,911,748,912,745,913,744,914,742,916,740,916,738,917,736,918,735,920,732,921,732,926,731,926,729,926,727,927,724,927,723,928,721,929,719,929,717,930,715,931,714,932,712,933,710,934,709,935,707,936,705,937,703,937,702,938,700,939,698,939,696,940,695,941,694,942,691,942,689,942,687,943,686,943,684,944,682,944,680,944,678,944,677,945,675,945,673,945,672,945,669,945,668,946,666,946,664,946,663,946,661,946,659,946,657,946,655,946,654,946,652,947,650,947,648,946,647,947,645,946,643,946,641,947,640,947,638,947,637,948,636,948,633,948,631,946,630,947,628,947,627,947,624,946,623,945,622,946,620,947,619,946,617,946,616,946,614,946,613,947,611,946,610,946,608,946,607,946,605,945,604,945,602,944,601,944,599,944,597,943];
      var N = HEAD.length / 2;

      // seeded PRNG (mulberry32) for deterministic tick layout and shake
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---- build speed-tick strips (period 1080px, drawn twice for seamless wrap) ----
      var SVGNS = "http://www.w3.org/2000/svg";
      function buildTicks(svgId, seed) {
        var svg = document.getElementById(svgId);
        var rnd = mulberry32(seed);
        var x = 0;
        var dashes = [];
        while (x < 1040) {
          var len = 18 + Math.round(rnd() * 70);
          var y = 3 + Math.round(rnd() * 6);
          var op = 0.45 + rnd() * 0.55;
          dashes.push([x, len, y, op]);
          x += len + 28 + Math.round(rnd() * 60);
        }
        for (var c = 0; c < 2; c++) {
          for (var k = 0; k < dashes.length; k++) {
            var d = dashes[k];
            var ln = document.createElementNS(SVGNS, "line");
            ln.setAttribute("x1", String(d[0] + c * 1080));
            ln.setAttribute("x2", String(d[0] + d[1] + c * 1080));
            ln.setAttribute("y1", String(d[2]));
            ln.setAttribute("y2", String(d[2]));
            ln.setAttribute("stroke", "#E8553F");
            ln.setAttribute("stroke-width", "3");
            ln.setAttribute("stroke-linecap", "round");
            ln.setAttribute("opacity", d[3].toFixed(2));
            svg.appendChild(ln);
          }
        }
      }
      buildTicks("f01-ticks-top-svg", 1101);
      buildTicks("f01-ticks-bot-svg", 2207);

      var retPos = document.getElementById("f01-ret-pos");
      var pillPos = document.getElementById("f01-pill-pos");
      var ticksTop = document.getElementById("f01-ticks-top");
      var ticksBot = document.getElementById("f01-ticks-bot");
      var row1 = document.getElementById("f01-row1-txt");
      var row2Lab = document.getElementById("f01-row2-lab");
      var row2Val = document.getElementById("f01-row2-val");
      var rec = document.getElementById("f01-rec");
      var fill = document.getElementById("f01-scale-fill");

      var ROW1 = "1,200 FPS";
      var LAB2 = "REAL TIME ";
      var CPS = 0.04; // seconds per typed character
      var ROW1_AT = 0.5, ROW2_AT = 0.85;

      // speed-tick scroll offset as a closed-form function of t (seek-safe):
      // fast stream, then decelerates on "slowed down" (2.72 s -> 3.6 s)
      var V0 = 1400, V1 = 160, TS = 2.72, TD = 0.88;
      function tickOffset(t) {
        if (t <= TS) return V0 * t;
        var base = V0 * TS;
        var d = Math.min(t - TS, TD);
        var off = base + V0 * d - (V0 - V1) * d * d / (2 * TD);
        if (t > TS + TD) off += V1 * (t - TS - TD);
        return off;
      }

      function typed(full, t, at) {
        var n = Math.floor((t - at) / CPS) + 1;
        if (n <= 0) return "";
        return full.slice(0, Math.min(full.length, n));
      }

      var last1 = null, last2a = null, last2b = null;
      function render(t) {
        if (t < 0) t = 0;
        if (t > DUR) t = DUR;
        // head position (interpolated between tracked frames)
        var f = t * FPS;
        var i = Math.min(N - 1, Math.floor(f));
        var j = Math.min(N - 1, i + 1);
        var a = f - i;
        if (a > 1) a = 1;
        var hx = HEAD[i * 2] + (HEAD[j * 2] - HEAD[i * 2]) * a;
        var hy = HEAD[i * 2 + 1] + (HEAD[j * 2 + 1] - HEAD[i * 2 + 1]) * a;
        retPos.style.transform = "translate(" + (hx - 90).toFixed(1) + "px," + (hy - 90).toFixed(1) + "px)";
        pillPos.style.transform = "translate(" + (hx - 100).toFixed(1) + "px," + (hy - 72).toFixed(1) + "px)";

        // speed ticks stream right-to-left
        var off = tickOffset(t) % 1080;
        ticksTop.style.transform = "translateX(" + (-off).toFixed(1) + "px)";
        ticksBot.style.transform = "translateX(" + (-((off + 540) % 1080)).toFixed(1) + "px)";

        // readouts: type-on + real-time counter at exactly t/60
        var s1 = typed(ROW1, t, ROW1_AT);
        if (s1 !== last1) { row1.textContent = s1; last1 = s1; }
        var full2 = LAB2 + (t / 60).toFixed(3) + " S";
        var s2 = typed(full2, t, ROW2_AT);
        var lab = s2.slice(0, Math.min(s2.length, LAB2.length));
        var val = s2.length > LAB2.length ? s2.slice(LAB2.length) : "";
        if (lab !== last2a) { row2Lab.textContent = lab; last2a = lab; }
        if (val !== last2b) { row2Val.textContent = val; last2b = val; }
        // REC dot: visible from 0.5 s, blinks at 2 Hz (pure function of t)
        rec.style.opacity = t < ROW1_AT ? "0" : (Math.floor((t - ROW1_AT) * 2) % 2 === 0 ? "1" : "0.25");
        // real-time scale fill: fraction of 0.1 s elapsed (t/60/0.1)
        fill.style.transform = "scaleX(" + Math.min(1, t / 6).toFixed(4) + ")";
      }

      var tl = gsap.timeline({ paused: true });

      // single seek-safe driver: every tracked / time-derived overlay reads proxy.p
      var proxy = { p: 0 };
      tl.to(proxy, { p: DUR, duration: DUR, ease: "none", onUpdate: function () { render(proxy.p); } }, 0);
      render(0);

      // Scene 1 (0-0.3): footage only. Scene 2 (0.3-3.4): reticle snaps onto the head (2-step 1.4 -> 0.9 -> 1)
      tl.fromTo("#f01-ret", { scale: 1.4, opacity: 0 }, { scale: 0.9, opacity: 1, duration: 0.12, ease: "expo.out" }, 0.3);
      tl.to("#f01-ret", { scale: 1, duration: 0.18, ease: "expo.out" }, 0.42);
      // HEAD pill: stem grows, label wipes in from the left
      tl.fromTo("#f01-pill-stem", { scaleY: 0 }, { scaleY: 1, duration: 0.18, ease: "power3.out" }, 0.4);
      tl.fromTo("#f01-pill-label", { clipPath: "inset(0% 100% 0% 0%)", opacity: 0 }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.3, ease: "power3.out" }, 0.42);
      // speed ticks fade in along the window edges
      tl.fromTo(".f01-ticks", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.3);
      // readout block rule draws as the readouts begin typing at 0.5
      tl.fromTo("#f01-readout-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.45);
      // "fastest" (1.12): lock ring self-draws around the reticle
      tl.fromTo("#f01-ret-lock", { attr: { "stroke-dashoffset": 364.4 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, 1.12);
      // "animal on Earth" (1.92): real-time scale wipes in under the readouts
      tl.fromTo("#f01-scale", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" }, 1.92);
      tl.fromTo("#f01-scale-end", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 2.2);
      // "slowed down" (2.72): ticks decelerate (closed form in render); the lock ring pulses once
      tl.to("#f01-ret", { scale: 1.08, duration: 0.14, ease: "power2.out" }, 2.72);
      tl.to("#f01-ret", { scale: 1, duration: 0.3, ease: "power2.inOut" }, 2.86);

      // Scene 3 (3.52 "60"): stat slam 1.25 -> 1, expo.out, with a 1-frame red flash
      tl.fromTo("#f01-slam", { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" }, 3.52);
      tl.fromTo("#f01-slam-ul", { scaleX: 0.2, scaleY: 2.4, opacity: 0 }, { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 3.52);
      tl.set("#f01-slam-flash", { opacity: 1 }, 3.52);
      tl.set("#f01-slam-flash", { opacity: 0 }, 3.56);
      // impact shake on the slam block only (max 6px, 0.25 s, seeded) — HUD tracking stays locked to footage
      (function () {
        var rnd = mulberry32(6060);
        var steps = 6, st = 0.25 / steps, at = 3.52;
        for (var k = 0; k < steps; k++) {
          var amp = 6 * (1 - k / steps);
          tl.to("#f01-slam-wrap", { x: (rnd() * 2 - 1) * amp, y: (rnd() * 2 - 1) * amp, duration: st, ease: "none" }, at + k * st);
        }
        tl.to("#f01-slam-wrap", { x: 0, y: 0, duration: 0.05, ease: "power1.out" }, at + 0.25);
      })();
      // quiet settle so the hold keeps breathing to the cut
      tl.to("#f01-slam", { scale: 1.03, duration: 1.0, ease: "power1.out" }, 3.95);

      window.__timelines["01-hook"] = tl;
    })();
  </script>
