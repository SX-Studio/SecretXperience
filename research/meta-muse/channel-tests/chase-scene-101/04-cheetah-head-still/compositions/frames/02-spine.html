      var N = RAW.length;

      var root = document.querySelector('[data-composition-id="02-spine"]');
      var q = function (sel) { return root.querySelector(sel); };
      var pathEl = q("#f02-spine"), shadowEl = q("#f02-spine-shadow"), vertsEl = q("#f02-verts");
