  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var DUR = 3.827;
      var FPS = 24;
      var FZ = 1.5, FZ_END = 2.375;          // built-in freeze (s3.json frozen:true)
      var SWEEP0 = 1.6, SWEEP1 = 3.2;         // stride-bar playhead
      var BAR_W = 936, SEG = BAR_W / 4;
      function segT(px) { return SWEEP0 + (SWEEP1 - SWEEP0) * (px / BAR_W); }

      // Head track (composite px) from public/clips/s3.json, rounded.
      var HEAD = [[880,882],[879,882],[878,882],[875,882],[874,882],[872,882],[871,883],[868,882],[867,883],[865,883],[864,883],[862,884],[862,884],[860,884],[858,884],[856,884],[854,884],[851,884],[850,885],[848,885],[847,886],[844,885],[843,886],[840,886],[840,886],[838,887],[835,886],[834,887],[831,887],[830,887],[828,887],[826,888],[826,890],[822,887],[823,890],[821,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[819,890],[817,891],[816,891],[813,891],[810,889],[809,891],[808,891],[807,892],[804,892],[803,892],[801,893],[799,893],[798,893],[795,893],[794,893],[792,893],[790,893],[787,891],[785,891],[785,894],[783,894],[782,895],[779,895],[778,895],[776,895],[774,896],[773,896],[771,896],[770,896],[768,897],[766,897],[764,897],[763,898],[761,898],[759,898],[758,898]];

      // Reticle lock during the freeze: the lowest fore paw (measured on the frozen frame).
      var LOCK = { s: FZ, e: FZ_END, x: 850, y: 1058 };
      var DIVE = 0.3, RELEASE = 0.35;

      function sample(arr, t) {
        var N = arr.length;
        var f = Math.max(0, t) * FPS;
        var i = Math.min(N - 1, Math.floor(f));
        var j = Math.min(N - 1, i + 1);
        var k = Math.min(1, f - i);
        return [arr[i][0] + (arr[j][0] - arr[i][0]) * k, arr[i][1] + (arr[j][1] - arr[i][1]) * k];
      }

      var retEl = document.getElementById("f03-ret");
      function writeReticle(t) {
        var h = sample(HEAD, t);
        var x = h[0], y = h[1], m = 0;
        if (t >= LOCK.s && t < LOCK.e) {
          var a = Math.min(1, (t - LOCK.s) / DIVE);
          m = 1 - Math.pow(1 - a, 4);                                         // power4.out dive
        } else if (t >= LOCK.e && t < LOCK.e + RELEASE) {
          var b = (t - LOCK.e) / RELEASE;
          m = 1 - (b < 0.5 ? 2 * b * b : 1 - Math.pow(-2 * b + 2, 2) / 2);    // power2.inOut release
        }
        if (m > 0) { x += (LOCK.x - x) * m; y += (LOCK.y - y) * m; }
        retEl.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
      }

      // Label line 1: one span per character for a seek-safe type-on.
      var l1 = document.getElementById("f03-l1");
      var TEXT = "ALL 4 FEET OFF THE GROUND";
      for (var c = 0; c < TEXT.length; c++) {
        var sp = document.createElement("span");
        sp.className = "f03-ch" + (TEXT[c] === "4" ? " f03-red" : "");
        sp.textContent = TEXT[c] === " " ? " " : TEXT[c];
        l1.appendChild(sp);
      }

      gsap.set("#f03-fill1, #f03-fill2", { scaleX: 0, transformOrigin: "0% 50%" });

      var tl = gsap.timeline({ paused: true });

      // Tracking proxy: single source of truth for the reticle position.
      var proxy = { p: 0 };
      writeReticle(0);
      tl.to(proxy, { p: DUR, duration: DUR, ease: "none", onUpdate: function () { writeReticle(proxy.p); } }, 0);

      // Phase 1 (0-1.5, "Twice in every stride,") — reticle locks on, counter arrives, stride bar builds.
      tl.fromTo("#f03-retin", { scale: 1.4, opacity: 0 }, { scale: 0.9, opacity: 1, duration: 0.08, ease: "expo.out" }, 0.05);
      tl.to("#f03-retin", { scale: 1, duration: 0.12, ease: "expo.out" }, 0.13);
      tl.fromTo("#f03-count", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.fromTo("#f03-stitle", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.88);
      tl.fromTo("#f03-bar .f03-seg", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.08 }, 0.95);

      // Phase 2 (1.5, freeze) — flash, ground line + gap brackets, AIRBORNE stamp, square 1, reticle dives to paw.
      tl.fromTo("#f03-flash", { opacity: 0 }, { opacity: 0.85, duration: 0.01, ease: "none" }, FZ);
      tl.to("#f03-flash", { opacity: 0, duration: 0.07, ease: "none" }, FZ + 0.01);
      tl.fromTo("#f03-line", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.3, ease: "power2.out" }, FZ + 0.04);
      tl.fromTo("#f03-gtag", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, FZ + 0.22);
      tl.fromTo("#f03-gnd .f03-br", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, transformOrigin: "50% 100%", duration: 0.22, ease: "power3.out", stagger: 0.08 }, FZ + 0.16);
      tl.fromTo("#f03-stamp", { opacity: 0, scale: 1.35, rotation: -4 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.25, ease: "expo.out" }, FZ + 0.08);
      tl.fromTo("#f03-sq1f", { scale: 0 }, { scale: 1, duration: 0.2, ease: "expo.out" }, FZ + 0.08);
      tl.to("#f03-retin", { scale: 1.4, duration: 0.04, ease: "power2.out" }, FZ + 0.28);
      tl.to("#f03-retin", { scale: 0.9, duration: 0.08, ease: "expo.out" }, FZ + 0.32);
      tl.to("#f03-retin", { scale: 1, duration: 0.12, ease: "expo.out" }, FZ + 0.40);
      // Ground evidence holds past the freeze, then clears (stamp holds).
      tl.to("#f03-gnd", { opacity: 0, duration: 0.2, ease: "power1.out" }, 2.5);

      // Phase 3 (1.6-3.2) — playhead sweeps one stride; airborne segments light red as it crosses them.
      tl.fromTo("#f03-ph", { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.12, ease: "power2.out" }, SWEEP0 - 0.12);
      tl.to("#f03-ph", { x: BAR_W, duration: SWEEP1 - SWEEP0, ease: "none" }, SWEEP0);
      tl.to("#f03-fill1", { scaleX: 1, duration: segT(2 * SEG) - segT(SEG), ease: "none" }, segT(SEG));
      tl.to("#f03-fill2", { scaleX: 1, duration: segT(4 * SEG) - segT(3 * SEG), ease: "none" }, segT(3 * SEG));
      tl.fromTo("#f03-sq2f", { scale: 0 }, { scale: 1, duration: 0.2, ease: "expo.out" }, segT(3 * SEG));

      // Label (on "all four feet leave the ground"): line 1 types on, line 2 lands with the second airborne phase.
      tl.fromTo("#f03-pill", { opacity: 0, scaleX: 0.94 }, { opacity: 1, scaleX: 1, duration: 0.18, ease: "power3.out" }, 1.62);
      tl.fromTo("#f03-l1 .f03-ch", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.02 }, 1.66);
      tl.fromTo("#f03-l2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 2.82);

      tl.set({}, {}, DUR);
      window.__timelines["03-flight"] = tl;
    })();
  </script>
