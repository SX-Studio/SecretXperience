// ---------------------------------------------------------------- helpers
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eio = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eo = k => 1 - Math.pow(1 - k, 3);
const ei = k => k * k * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = 0.5, fo = 0.5) => Math.min(eo(prog(t, a, a + fi)), 1 - eo(prog(t, b - fo, b)));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---------------------------------------------------------------- three.js setup

// ---------- Scene A: tank on the waterfront (units: 1 = 10 ft)
const sA = new THREE.Scene();
sA.background = new THREE.Color('#9fb0be');

const camA = new THREE.PerspectiveCamera(38, GW / GH, 0.1, 200);

const sun = new THREE.DirectionalLight('#ffe7c2', 2.2);
sun.position.set(-14, 9, 10); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60 });
sA.add(sun);
// ground (snowy, dirty)
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#c3c8cc', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; sA.add(ground);
// harbor water behind
const water = new THREE.Mesh(new THREE.PlaneGeometry(200, 60), new THREE.MeshStandardMaterial({ color: '#56656f', roughness: 0.35, metalness: 0.2 }));
water.rotation.x = -Math.PI / 2; water.position.set(0, 0.02, -40); sA.add(water);
// tank: 90 ft wide (r = 4.5), 50 ft tall (h = 5)
const R = 4.5, HT = 5;
const tankMat = new THREE.MeshStandardMaterial({ color: '#8a939c', metalness: 0.55, roughness: 0.48 });
const tank = new THREE.Mesh(new THREE.CylinderGeometry(R, R, HT, 128, 1, true), tankMat);
tank.position.y = HT / 2; tank.castShadow = true; tank.receiveShadow = true; sA.add(tank);
const roof = new THREE.Mesh(new THREE.ConeGeometry(R + 0.05, 0.9, 128, 1, true), tankMat);
roof.position.y = HT + 0.45; roof.castShadow = true; sA.add(roof);
// brown paint overlay, revealed top-to-bottom with a clipping plane
const paintPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -10);
const paintMat = new THREE.MeshStandardMaterial({ color: '#5b3a22', metalness: 0.15, roughness: 0.75, clippingPlanes: [paintPlane] });
const paint = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.012, R + 0.012, HT, 128, 1, true), paintMat);
paint.position.y = HT / 2; sA.add(paint);
const paintRoof = new THREE.Mesh(new THREE.ConeGeometry(R + 0.06, 0.9, 128, 1, true), paintMat);
paintRoof.position.y = HT + 0.46; sA.add(paintRoof);
// rivets: horizontal rings at plate courses + vertical seams
const rivetGeo = new THREE.SphereGeometry(0.035, 8, 6);
const rivetMat = new THREE.MeshStandardMaterial({ color: '#6c747c', metalness: 0.7, roughness: 0.35 });
const rivetList = [];
for (let c = 0; c <= 6; c++) { const y = c * HT / 6; for (let k = 0; k < 420; k++) rivetList.push([k / 420 * Math.PI * 2, y + 0.02]); }
for (let c = 0; c < 6; c++) for (let s = 0; s < 14; s++) {
  const a = (s / 14 + (c % 2) * 0.5 / 14) * Math.PI * 2;
  for (let k = 0; k < 18; k++) rivetList.push([a, c * HT / 6 + (k + 0.5) / 18 * HT / 6]);
}
// the seam that fails: angle 0 (facing +x), its own rivets
const SEAM_A = Math.PI / 2;
const seamRivets = [];
for (let k = 0; k < 64; k++) seamRivets.push([SEAM_A, 0.15 + k / 64 * (HT - 0.3)]);
const rivets = new THREE.InstancedMesh(rivetGeo, rivetMat, rivetList.length + seamRivets.length);
rivets.castShadow = false;
const M4 = new THREE.Matrix4(), V3 = new THREE.Vector3(), Q = new THREE.Quaternion(), S1 = new THREE.Vector3(1, 1, 1);
function rivetPos(a, y, rad = R + 0.02) { return new THREE.Vector3(Math.cos(a) * rad, y, Math.sin(a) * rad); }

sA.add(rivets);
// leak streaks (thin dark ribbons that grow downward)

const streaks = [];
for (let i = 0; i < 26; i++) {

sA.add(sparks);

sA.add(gush);
// surroundings: brick blocks, the elevated railway

const roofMat = new THREE.MeshStandardMaterial({ color: '#3d3a38', roughness: 0.9 });
for (let i = 0; i < 16; i++) {
  const w = 2 + rnd(i) * 3, d = 2 + rnd(i + 1) * 3, h = 1.2 + rnd(i + 2) * 2.6;
  const ang = (i / 16) * Math.PI * 2 + rnd(i + 4) * 0.2, dist = 10 + rnd(i + 3) * 9;
  if (Math.sin(ang) > 0.45) continue;   // keep the camera side open
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), brick);
  b.position.set(Math.cos(ang) * dist, h / 2, Math.sin(ang) * dist * 0.8 + 2); b.rotation.y = ang;
  b.castShadow = true; b.receiveShadow = true; sA.add(b);
  const rf = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.12, d + 0.1), roofMat); rf.position.set(b.position.x, h + 0.06, b.position.z); rf.rotation.y = ang; sA.add(rf);
}
const elMat = new THREE.MeshStandardMaterial({ color: '#2f2c2a', metalness: 0.4, roughness: 0.7 });
const elG = new THREE.Group(); elG.position.set(13, 0, -8); elG.rotation.y = -0.35; sA.add(elG);
const deck = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 70), elMat); deck.position.set(0, 2.2, 0); deck.castShadow = true; elG.add(deck);
for (let i = -35; i <= 35; i += 3) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.2, 0.18), elMat); p.position.set(0, 1.1, i); p.castShadow = true; elG.add(p); }
const car = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.9, 4.2), new THREE.MeshStandardMaterial({ color: '#4b2b1e', roughness: 0.8 }));
car.position.set(0, 2.85, -4); car.castShadow = true; elG.add(car);

// ---------- Scene B: the wave down a street
const sB = new THREE.Scene();
sB.background = new THREE.Color('#8f9aa3');
sB.fog = new THREE.Fog('#98a3ab', 10, 60);
const camB = new THREE.PerspectiveCamera(52, GW / GH, 0.05, 200);
sB.add(new THREE.HemisphereLight('#d9e3ea', '#40362d', 1.0));
const sunB = new THREE.DirectionalLight('#ffe2b6', 2.0); sunB.position.set(-8, 12, 6); sunB.castShadow = true;
sunB.shadow.mapSize.set(1024, 1024); Object.assign(sunB.shadow.camera, { left: -15, right: 15, top: 30, bottom: -30, near: 1, far: 60 });
sB.add(sunB);
function cobbleTexture() {
  const c = mkCanvas(512, 512), g = c.getContext('2d'); g.fillStyle = '#4a4744'; g.fillRect(0, 0, 512, 512);
  for (let r = 0; r < 16; r++) for (let q = 0; q < 12; q++) {
    const x = q * 44 + (r % 2) * 22 + (rnd(r * 31 + q) - 0.5) * 6, y = r * 32 + (rnd(r * 17 + q) - 0.5) * 4;
    const v = 85 + rnd(r * 7 + q) * 50; g.fillStyle = `rgb(${v},${v * 0.96 | 0},${v * 0.9 | 0})`;
    rr(g, x + 2, y + 2, 40, 28, 9); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.08)'; rr(g, x + 6, y + 4, 26, 8, 4); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(14, 140); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const streetG = new THREE.Mesh(new THREE.PlaneGeometry(14, 140), new THREE.MeshStandardMaterial({ map: cobbleTexture(), roughness: 0.38, metalness: 0.12 }));
streetG.rotation.x = -Math.PI / 2; streetG.position.z = -50; streetG.receiveShadow = true; sB.add(streetG);
// window texture for brick facades
function facadeTexture() {
  const c = mkCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#6f4535'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${40 + rnd(i) * 40},${20 + rnd(i + 1) * 20},${10 + rnd(i + 2) * 15},0.25)`; g.fillRect(rnd(i + 3) * 256, rnd(i + 4) * 256, 8, 3); }
  for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) { g.fillStyle = '#1d1a1a'; g.fillRect(22 + k * 60, 20 + r * 62, 26, 38); g.fillStyle = '#c9b89a'; g.fillRect(20 + k * 60, 58 + r * 62, 30, 4); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}
const fac = facadeTexture();
for (let side of [-1, 1]) for (let i = 0; i < 14; i++) {
  const d = 5 + rnd(i * 7 + side) * 3, h = 2.6 + rnd(i * 3 + side * 5) * 1.6, w = 5 + rnd(i * 11) * 2;
  const tex = fac.clone(); tex.needsUpdate = true; tex.repeat.set(d / 3, h / 3);
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95 }));
  b.position.set(side * (7 + w / 2), h / 2, 6 - i * (d + 0.4)); b.castShadow = true; b.receiveShadow = true; sB.add(b);
}
// barrels and crates near the camera for scale
for (let i = 0; i < 9; i++) {
  const side = i % 2 ? 1 : -1, z = 7 - i * 2.6 - rnd(i) * 1.5, x = side * (3.6 + rnd(i + 1) * 2.4);
  const m = i % 3 === 0 ? new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.45, 0.55), new THREE.MeshStandardMaterial({ color: '#6b5238', roughness: 0.9 }))
                        : new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.27, 0.62, 18), new THREE.MeshStandardMaterial({ color: '#5a3d26', roughness: 0.7 }));
  m.position.set(x, i % 3 === 0 ? 0.225 : 0.31, z); m.rotation.y = rnd(i + 2) * 3; m.castShadow = true; sB.add(m);
}
// telegraph poles
for (let i = 0; i < 12; i++) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 4.5, 6), new THREE.MeshStandardMaterial({ color: '#2b241f' })); p.position.set(5.6, 2.25, 4 - i * 9); p.castShadow = true; sB.add(p); }
// the molasses wave: displaced plane, custom glossy shader
const waveU = { uT: { value: 0 }, uFront: { value: -60 }, uH: { value: 2.5 }, uSun: { value: new THREE.Vector3(-0.5, 0.75, 0.45).normalize() }, uCam: { value: new THREE.Vector3() }, uFog: { value: new THREE.Color('#98a3ab') } };
const waveMat = new THREE.ShaderMaterial({
  uniforms: waveU,
  vertexShader: `
    uniform float uT; uniform float uFront; uniform float uH;
    varying vec3 vW; varying float vH; varying vec3 vN;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
    float hgt(float x, float z){
      float d = uFront - z;
      float wall = smoothstep(-0.2, 3.2, d);
      float crest = exp(-pow((d-1.4)/0.9, 2.0)) * 0.55;
      float body = uH * (wall + crest) * (0.85 + 0.15*sin(x*0.9 + uT*3.0));
      float rough = (noise(vec2(x*0.8, z*0.6 - uT*2.0))-0.5)*0.55 + (noise(vec2(x*2.5, z*2.0 - uT*5.0))-0.5)*0.22;
      return max(0.0, body + rough*wall);
    }
    void main(){
      vec3 p = position;
      float h = hgt(p.x, p.z);
      float e = 0.08;
      float hx = hgt(p.x + e, p.z) - hgt(p.x - e, p.z);
      float hz = hgt(p.x, p.z + e) - hgt(p.x, p.z - e);
      vN = normalize(vec3(-hx, 2.0*e, -hz));
      float d = uFront - p.z;
      float crest = exp(-pow((d-1.4)/0.9, 2.0)) * 0.55;
      p.y = h - 0.02; p.z += crest * 0.9;
      vH = h;
      vec4 w = modelMatrix * vec4(p,1.0); vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform vec3 uSun; uniform vec3 uCam; uniform vec3 uFog;
    varying vec3 vW; varying float vH; varying vec3 vN;
    void main(){
      vec3 n = normalize(vN);
      vec3 v = normalize(uCam - vW);
      vec3 base = mix(vec3(0.035,0.012,0.002), vec3(0.20,0.08,0.015), clamp(vH*0.25,0.,1.));
      float diff = max(dot(n,uSun),0.0);
      vec3 h = normalize(uSun + v);
      float spec = pow(max(dot(n,h),0.0), 90.0);
      float fres = pow(1.0 - max(dot(n,v),0.0), 4.0);
      vec3 col = base*(0.35+0.9*diff) + vec3(1.0,0.72,0.38)*spec*1.6 + vec3(0.55,0.32,0.12)*fres*0.6;
      float fogF = smoothstep(14.0, 70.0, length(uCam - vW));
      col = mix(col, uFog, fogF*0.85);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const waveGeo = new THREE.PlaneGeometry(14, 120, 140, 600); waveGeo.rotateX(-Math.PI / 2); waveGeo.translate(0, 0, -50);
const wave = new THREE.Mesh(waveGeo, waveMat); sB.add(wave);
// spray mist above the crest
const MIST = 700; const mistGeo = new THREE.BufferGeometry(); mistGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MIST * 3), 3));
const mist = new THREE.Points(mistGeo, new THREE.PointsMaterial({ color: '#5a2c0c', size: 0.09, transparent: true, opacity: 0.8, depthWrite: false })); sB.add(mist);
// debris planks riding the front
const planks = [];
for (let i = 0; i < 26; i++) {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.9 + rnd(i) * 1.4, 0.06, 0.18), new THREE.MeshStandardMaterial({ color: '#5e4430', roughness: 0.9 }));
  p.userData = { x: -5 + rnd(i + 2) * 10, off: rnd(i + 3) * 2.5, spin: (rnd(i + 4) - 0.5) * 6, y: 0.4 + rnd(i + 5) * 2.2 };
  p.castShadow = true; planks.push(p); sB.add(p);
}

// ---------- Scene C: the 1919 photo with depth parallax
const sC = new THREE.Scene(); sC.background = new THREE.Color('#120d08');
const camC = new THREE.PerspectiveCamera(32, GW / GH, 0.01, 50);
let photoMesh = null;

function dotTexture() { const c = mkCanvas(64, 64), g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.5, 'rgba(255,255,255,0.6)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); }
const DOT = dotTexture();
mist.material.map = DOT; mist.material.size = 0.06; mist.material.alphaTest = 0.02;
sparks.material.map = DOT; gush.material.map = DOT;
// ---------------------------------------------------------------- 2D scene painters (draw into L, full frame)
function paperBG(g, tone = 1) {

}
const BODY = 'Shortly after noon a great steel tank of the Purity Distilling Company on Commercial Street burst without warning, loosing a flood of molasses upon the North End. Witnesses describe a low rumble, then a sharp rattle like the firing of guns, as the rivets let go one after another. The brown tide swept the street, overturned wagons, splintered freight sheds and struck the structure of the elevated railway. Firemen, sailors from the training ship and passers-by waded in to reach those trapped. ';
function bodyColumns(g, x, y, colW, colH, cols, gap, seed, alpha) {
  g.save(); g.globalAlpha *= alpha; g.fillStyle = C.inkSoft; g.font = '400 25px "Old Standard TT"'; g.textBaseline = 'top';
  const words = (BODY + BODY + BODY).split(' ');
  let wi = seed;
  for (let c = 0; c < cols; c++) {
    let yy = y; const cx = x + c * (colW + gap);
    while (yy < y + colH) {
      let line = '';
      while (wi < words.length * 3) { const nxt = line + words[wi % words.length] + ' '; if (g.measureText(nxt).width > colW) break; line = nxt; wi++; }
      g.fillText(line.trim(), cx, yy); yy += 31;
    }
    if (c < cols - 1) { g.fillStyle = 'rgba(27,22,17,0.35)'; g.fillRect(cx + colW + gap / 2 - 1, y, 2, colH); g.fillStyle = C.inkSoft; }
  }
  g.restore();
}
// front page used at open (variant 0) and close (variant 1 with printed photo)
function frontPage(g, t, variant) {

  g.fillRect(70, 290, W - 140, 5); g.fillRect(70, 302, W - 140, 2);
  g.font = '400 30px "Special Elite"';
  g.fillText('BOSTON, WEDNESDAY, JANUARY 15, 1919', W / 2, 345);
  g.fillRect(70, 370, W - 140, 2);
  g.font = '400 24px "Old Standard TT"'; g.fillText('SPECIAL EDITION · ONE CENT', W / 2, 400);
  if (variant === 0) {
    // headline slams in on "a wave"
    const hk = prog(t, 4.25, 4.55);

      g.translate(W / 2, 580); g.scale(s, s); g.globalAlpha = eo(hk);

      g.fillText('A WAVE TORE', 0, -40); g.fillText('THROUGH BOSTON', 0, 70);

    }

    const sk = prog(t, 5.6, 6.1);

      g.font = 'italic 400 54px "Old Standard TT"'; g.fillText('A Wall of WATER?', W / 2, 800);

      if (strike > 0) {

// glossy molasses sheet pouring from the top edge
function molassesPour(g, t, t0, t1) {
  const k = prog(t, t0, t1);
  if (k <= 0) return;
  const drips = 13;
  // sheet edge descends; drips hang below it with round ends
  const edge = H * (ei(k) * 0.55 + eio(k) * 0.75);
  const grad = g.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0, '#1a0901'); grad.addColorStop(0.35, '#3b1a05'); grad.addColorStop(0.55, '#5a2b0b'); grad.addColorStop(0.75, '#2c1203'); grad.addColorStop(1, '#140600');
  g.save(); g.fillStyle = grad;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, edge);
  for (let x = W; x >= 0; x -= 24) g.lineTo(x, edge + Math.sin(x * 0.011 + t * 1.2) * 22 + Math.sin(x * 0.031) * 10);
  g.closePath(); g.fill();
  const pts = [];
  for (let i = 0; i < drips; i++) {
    const x = (i + 0.5) / drips * W + (rnd(i + 2) - 0.5) * 50;
    const w = 34 + rnd(i * 3) * 70;
    const len = (90 + rnd(i * 5) * 360) * clamp(k * 1.6) * (0.6 + 0.4 * Math.sin(t * 0.9 + i));
    const y0 = edge + Math.sin(x * 0.011 + t * 1.2) * 22 - 10, y1 = y0 + len;
    g.beginPath();
    g.moveTo(x - w / 2 - 26, y0);
    g.bezierCurveTo(x - w / 2, y0 + 10, x - w / 2 * 0.8, y1 - w * 0.6, x - w / 2 * 0.85, y1 - w * 0.4);
    g.arc(x, y1 - w * 0.4, w / 2 * 0.85, Math.PI, 0, true);
    g.bezierCurveTo(x + w / 2 * 0.8, y1 - w * 0.6, x + w / 2, y0 + 10, x + w / 2 + 26, y0);
    g.closePath(); g.fill();
    pts.push([x, y1 - w * 0.4 + w * 0.3, w]);
  }
  // specular streaks
  g.globalCompositeOperation = 'screen';
  for (let i = 0; i < 9; i++) {
    const x = (0.06 + rnd(i + 40) * 0.88) * W, w = 6 + rnd(i + 41) * 22;
    const sg = g.createLinearGradient(x - w, 0, x + w, 0);
    sg.addColorStop(0, 'rgba(224,149,47,0)'); sg.addColorStop(0.5, `rgba(224,149,47,${0.22 + rnd(i + 42) * 0.3})`); sg.addColorStop(1, 'rgba(224,149,47,0)');
    g.fillStyle = sg;
    const len = edge + 200 * rnd(i + 43);
    g.fillRect(x - w, 0, w * 2, Math.max(0, len));
  }
  // drip tip highlights
  pts.forEach(([x, y, w]) => {
    const rg = g.createRadialGradient(x - w * 0.18, y - w * 0.35, 1, x - w * 0.12, y - w * 0.3, w * 0.35);
    rg.addColorStop(0, 'rgba(255,214,150,0.75)'); rg.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x - w * 0.12, y - w * 0.3, w * 0.35, 0, Math.PI * 2); g.fill();
  });
  g.restore();
}

function thickening(g, t) {
  // warm dark background, slow sticky strands between a ceiling sheet and a pool
  const k = prog(t, 52.2, 59.6);
  const bgc = g.createLinearGradient(0, 0, 0, H); bgc.addColorStop(0, '#1b0d05'); bgc.addColorStop(1, '#0b0502'); g.fillStyle = bgc; g.fillRect(0, 0, W, H);
  const dark = lerp(1, 0.55, k);
  const topY = 330, botY = 1350;
  // ceiling sheet and pool
  const sheet = (y0, y1, flip) => {
    const gg = g.createLinearGradient(0, y0, 0, y1);
    gg.addColorStop(0, `rgba(${90 * dark | 0},${44 * dark | 0},${12 * dark | 0},1)`); gg.addColorStop(1, `rgba(${26 * dark | 0},${10 * dark | 0},2,1)`);
    g.fillStyle = gg; g.beginPath(); g.moveTo(0, flip ? H : 0); g.lineTo(0, y0);
    for (let x = 0; x <= W; x += 20) g.lineTo(x, y0 + Math.sin(x * 0.012 + (flip ? 2 : 0)) * 14);
    g.lineTo(W, flip ? H : 0); g.closePath(); g.fill();
  };
  sheet(topY, 0, false); sheet(botY, H, true);
  const strand = (x, wTop, seed, blur, alpha) => {
    const st = rnd(seed + 70) * 0.35, kk = clamp((k - st) / (1 - st));
    const neck = lerp(wTop * 0.32, 1.6, eio(kk)), sag = Math.sin(t * 0.35 + seed) * 22;
    const yN = lerp(topY + 520, topY + 700, rnd(seed + 72));
    g.save(); if (blur) g.filter = `blur(${blur}px)`; g.globalAlpha = alpha;
    const grad = g.createLinearGradient(x - wTop, 0, x + wTop, 0);
    grad.addColorStop(0, `rgba(${22 * dark | 0},8,1,1)`); grad.addColorStop(0.42, `rgba(${150 * dark | 0},${70 * dark | 0},${18 * dark | 0},1)`);
    grad.addColorStop(0.5, `rgba(${205 * dark | 0},${120 * dark | 0},${45 * dark | 0},1)`); grad.addColorStop(1, `rgba(${22 * dark | 0},8,1,1)`);
    g.fillStyle = grad; g.beginPath();
    g.moveTo(x - wTop, topY);
    g.bezierCurveTo(x - wTop * 0.35, topY + 140, x - neck + sag * 0.4, yN - 160, x - neck + sag * 0.5, yN);
    g.bezierCurveTo(x - neck + sag * 0.4, yN + 160, x - wTop * 0.45, botY - 140, x - wTop * 1.1, botY);
    g.lineTo(x + wTop * 1.1, botY);
    g.bezierCurveTo(x + wTop * 0.45, botY - 140, x + neck + sag * 0.4, yN + 160, x + neck + sag * 0.5, yN);
    g.bezierCurveTo(x + neck + sag * 0.4, yN - 160, x + wTop * 0.35, topY + 140, x + wTop, topY);
    g.closePath(); g.fill();
    g.strokeStyle = `rgba(255,205,130,${0.55 * dark})`; g.lineWidth = Math.max(1, neck * 0.3); g.lineCap = 'round';
    g.beginPath(); g.moveTo(x - wTop * 0.2, topY + 30); g.bezierCurveTo(x - wTop * 0.1, topY + 160, x + sag * 0.5 - neck * 0.2, yN - 120, x + sag * 0.5 - neck * 0.2, yN); g.stroke();
    g.restore();
  };
  strand(140, 95, 1, 7, 0.55); strand(980, 120, 2, 9, 0.5);
  strand(330, 70, 3, 0, 1); strand(540, 105, 4, 0, 1); strand(745, 60, 5, 0, 1);
  // corner thermometer dropping and "EVENING"
  g.save(); g.globalAlpha = eo(prog(t, 53.0, 53.6));
  g.fillStyle = C.cream; g.textAlign = 'center'; g.font = '400 46px "Special Elite"'; g.fillText('EVENING', W / 2, 210);
  g.font = '700 64px "Oswald"'; g.fillText(`${Math.round(lerp(40, 22, eio(prog(t, 53.2, 58.8))))}°F ↓`, W / 2, 290);
  g.restore();
}

  g.fillStyle = C.ink; g.textAlign = 'left'; g.font = '700 40px "Old Standard TT"'; g.fillText('NORTH END', 170, 620);
  g.font = '400 30px "Special Elite"'; g.fillStyle = C.red; g.fillText('THE TANK', tx - 200, ty + 10);
  g.font = 'italic 400 54px "Old Standard TT"'; g.fillStyle = 'rgba(27,22,17,0.85)'; g.textAlign = 'center'; g.fillText('Boston Harbor', 760, 1380);
  // compass

// ---------------------------------------------------------------- 3D frame setup per time
function setTank(t) {
  // camera orbit: low angle, upward tilt; later moves to the seam
  let pos, look;
  if (t < 28.6) {
    const k = prog(t, 13.9, 28.6);
    const ang = lerp(2.05, 1.62, eio(k)), rad = lerp(30, 22, eio(k)), hgt = lerp(0.55, 1.3, eio(k));
    pos = new THREE.Vector3(Math.cos(ang) * rad, hgt, Math.sin(ang) * rad);
    look = new THREE.Vector3(0, lerp(3.6, 3.0, k), 0);
  } else {
    const k = eio(prog(t, 28.6, 31.0));
    pos = new THREE.Vector3().lerpVectors(new THREE.Vector3(-1.0, 1.3, 22.5), new THREE.Vector3(1.6, 2.1, R + 3.2), k);
    look = new THREE.Vector3().lerpVectors(new THREE.Vector3(0, 3.0, 0), new THREE.Vector3(0, 2.5, R), k);
    pos.x += Math.sin(t * 0.4) * 0.2;
  }
  // shake: rivet pops + burst
  let shake = 0;
  for (const tp of popTimes) { const d = t - tp; if (d > 0 && d < 0.25) shake += (1 - d / 0.25) * 0.035; }
  const burst = prog(t, 35.9, 36.2) * (1 - prog(t, 37.6, 38.15)); shake += burst * 0.09;
  pos.x += (rnd(Math.floor(t * 60)) - 0.5) * shake; pos.y += (rnd(Math.floor(t * 60) + 9) - 0.5) * shake;
  camA.position.copy(pos); camA.lookAt(look);
  // leaks grow 19.3-21.6, paint sweeps 21.4-23.6

// ---------------------------------------------------------------- captions
function captions(t) {
  if (!TL) return;
  const lines = TL.lines; let cur = null;
  for (const l of lines) if (t >= l.start - 0.05 && t <= l.end + 0.55) cur = l;
  if (!cur) return;
  const words = TL.words.filter(w => w.line === cur.i);
  X.save(); X.font = '700 54px "Old Standard TT"'; X.textBaseline = 'alphabetic'; X.textAlign = 'left';
  // wrap into up to 2 lines of max 900 px
  const rows = [[]]; let wsum = 0; const sp = X.measureText(' ').width;
  words.forEach(w => { const ww = X.measureText(w.w).width; if (wsum + ww > 900 && rows[rows.length - 1].length) { rows.push([]); wsum = 0; } rows[rows.length - 1].push(w); wsum += ww + sp; });
  const lh = 68, y0 = 1560 - (rows.length - 1) * lh;
  const fadeOut = 1 - prog(t, cur.end + 0.25, cur.end + 0.55);
  const bandH = rows.length * lh + 34;
  X.globalAlpha = fadeOut * 0.62; X.fillStyle = '#0c0805'; rr(X, 60, y0 - 58, W - 120, bandH, 18); X.fill();
  rows.forEach((row, r) => {
    const tw = row.reduce((a, w) => a + X.measureText(w.w).width, 0) + sp * (row.length - 1);
    let x = W / 2 - tw / 2; const y = y0 + r * lh;
    row.forEach(w => {

      X.fillText(w.w, x, y + (1 - a) * 8);
      x += X.measureText(w.w).width + sp;

  });
  X.restore();
}

    const mat = new THREE.MeshBasicMaterial({ map: tex });
    mat.onBeforeCompile = sh => {
      sh.uniforms.uDepth = { value: dtex };
      sh.vertexShader = 'uniform sampler2D uDepth;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n float dz = texture2D(uDepth, uv).r; transformed.z += dz * 0.24;');
    };
    photoMesh = new THREE.Mesh(geo, mat); sC.add(photoMesh);
  }
  window.ready = true;
}
window.render = render;
window.setTimeline = tl => { TL = tl; };
boot();
