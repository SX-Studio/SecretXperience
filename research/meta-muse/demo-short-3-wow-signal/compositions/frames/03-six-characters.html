    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "03-six-characters";
        var ROWS = 14, COLS = 10, ROW_H = 82;
        var SIG_COL = 1;           // channel 2 = second column of the crop
        var SIG_FIRST = 4;         // signal occupies rows 4..9, consecutive
        var SIG_LAST = 9;

        // seeded PRNG (mulberry32) — deterministic noise
        var seed = 0x6E51;
        function rand() {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
        // mostly blanks and 1s, some 2-4
        function noiseChar() {
          var r = rand();
          if (r < 0.50) return " ";
          if (r < 0.82) return "1";
          if (r < 0.92) return "2";
          if (r < 0.97) return "3";
          return "4";
        }

        var noise = document.getElementById("03-six-characters-noise");
        var rows = [];
        for (var r = 0; r < ROWS; r++) {
          var row = document.createElement("div");
          row.className = "03-six-characters-row";
          row.style.top = (r * ROW_H) + "px";
          for (var c = 0; c < COLS; c++) {
            var cell = document.createElement("span");
            cell.className = "03-six-characters-cell";
            var ch = noiseChar();
            if (c === SIG_COL && r >= SIG_FIRST && r <= SIG_LAST) ch = " ";
            cell.textContent = ch;
            row.appendChild(cell);
          }
          noise.appendChild(row);
          rows.push(row);
        }

        var stage = document.getElementById("03-six-characters-stage");
        var head = document.getElementById("03-six-characters-head");
        var colmark = document.getElementById("03-six-characters-colmark");
        var kicker = document.getElementById("03-six-characters-kicker");
        var sig = [];
        for (var i = 0; i < 6; i++) sig.push(document.getElementById("03-six-characters-s" + i));

        var tl = gsap.timeline({ paused: true });

        // macro camera: slow push toward the signal column, full duration
        tl.fromTo(stage, { scale: 1 }, { scale: 1.045, duration: 5.876, ease: "none" }, 0);

        // kicker settles in
        tl.fromTo(kicker, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);

        // Scene 1 (0.0-1.6s) — "Most of the page is noise": line printer, row by row
        var ROW_T0 = 0.08, ROW_DT = 0.105;
        for (var k = 0; k < ROWS; k++) {
          var t = ROW_T0 + k * ROW_DT;
          tl.fromTo(rows[k], { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, t);
          // ink strike: each new line lands bright, then settles to cream-muted
          tl.fromTo(Array.prototype.slice.call(rows[k].children), { color: "#F0ECE5" }, { color: "#888880", duration: 0.28, ease: "power2.out" }, t);
          tl.set(head, { y: k * ROW_H }, t);
        }
        tl.fromTo(head, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, ROW_T0);

        // Scene 2 (1.6-3.0s) — "Then, six characters": printing pauses, the noise falls back
        tl.to(head, { opacity: 0.35, duration: 0.2, ease: "power1.out" }, 1.6);
        tl.fromTo(noise, { opacity: 1, filter: "blur(0px)" },
                         { opacity: 0.5, filter: "blur(2.5px)", duration: 0.7, ease: "power2.inOut" }, 1.62);
        tl.fromTo(colmark, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 2.1);

        // Scene 3 (3.0-5.876s) — one character per spoken cue, all in column 2
        var CUES = [3.04, 3.52, 3.82, 4.12, 4.56, 4.88]; // 6 . E . Q . U . J . 5
        for (var j = 0; j < 6; j++) {
          var ct = CUES[j];
          tl.set(head, { y: (SIG_FIRST + j) * ROW_H, opacity: 1 }, ct - 0.02);
          tl.fromTo(sig[j], { opacity: 0, scale: 1.3 },
                            { opacity: 1, scale: 1, duration: 0.16, ease: "power3.out" }, ct);
        }

        // hold after the "5" — subtle print-head flicker only
        tl.to(head, { opacity: 0.25, duration: 0.05, ease: "none" }, 5.34);
        tl.to(head, { opacity: 1, duration: 0.05, ease: "none" }, 5.39);
        tl.to(sig, { opacity: 0.86, duration: 0.04, ease: "none" }, 5.46);
        tl.to(sig, { opacity: 1, duration: 0.06, ease: "none" }, 5.50);
        tl.to(head, { opacity: 0.4, duration: 0.05, ease: "none" }, 5.62);
        tl.to(head, { opacity: 1, duration: 0.05, ease: "none" }, 5.67);

        window.__timelines[ID] = tl;
      })();
    </script>
