      var H = 240; // bump height
      var S = 55; // bump sigma (px)

      function noise(x, seed) {
        return (
          3.0 * Math.sin(x * 0.37 + seed) +
          2.0 * Math.sin(x * 0.91 + 1.3 * seed) +
          1.2 * Math.sin(x * 2.3 + 0.7 * seed)
        );
      }
      function tracePath(base, seed) {
        var d = "M" + X0 + " " + (base + noise(X0, seed)).toFixed(1);
        for (var x = X0 + 6; x <= X1; x += 6) {
          d += " L" + x + " " + (base + noise(x, seed)).toFixed(1);
        }
        return d;
      }
      function bumpPts(c, base) {
        var pts = [];
        for (var x = c - 4 * S; x <= c + 4 * S; x += 4) {
          var u = (x - c) / S;
          pts.push([x, base - H * Math.exp(-0.5 * u * u)]);
        }
        return pts;
      }
      function bumpLine(c, base) {
        var p = bumpPts(c, base);
        var d = "M" + p[0][0] + " " + p[0][1].toFixed(1);
        for (var i = 1; i < p.length; i++) d += " L" + p[i][0] + " " + p[i][1].toFixed(1);
        return d;
      }
      function bumpArea(c, base) {
        return bumpLine(c, base) + " L" + (c + 4 * S) + " " + base + " L" + (c - 4 * S) + " " + base + " Z";
      }

      $("l1-trace").setAttribute("d", tracePath(B1, 0.4));
      $("l2-trace").setAttribute("d", tracePath(B2, 2.1));
      $("g1").setAttribute("d", bumpLine(C1, B1));
      $("g1-maskpath").setAttribute("d", bumpLine(C1, B1));
      $("g2").setAttribute("d", bumpLine(C2, B2));
      $("g2-maskpath").setAttribute("d", bumpLine(C2, B2));
      $("l1-solid").setAttribute("d", bumpLine(C1, B1));
      $("l1-fill").setAttribute("d", bumpArea(C1, B1));

      var ticks = $("axis-ticks");
      for (var tx = X0; tx <= X1 - 20; tx += 96.2) {

      // Macro camera: slow push under Scenes 1-3

        $("stage"),
        { scale: 1, transformOrigin: "50% 40%" },
        { scale: 1.025, duration: 4.6, ease: "none" },
        0
      );

      // Scene 1 (0.0-1.6): two lanes draw, mono labels HORN 1 / HORN 2
      tl.fromTo($("kicker-rule"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.0);
      tl.fromTo($("kicker-text"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.08);
      tl.fromTo($("l1-top"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.05);
      tl.fromTo($("l1-trace"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 0.1);
      tl.fromTo($("lab1"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
      tl.fromTo($("l2-top"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 0.75);
      tl.fromTo($("l2-trace"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 0.8);
      tl.fromTo($("lab2"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.85);

      // Scene 2 (1.6-3.4): shared time axis, dashed ghost bumps offset in time, "~3 MIN"
      tl.fromTo($("axis"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.6);
      tl.fromTo($("timelab"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 1.9);
      tl.fromTo($("g1-maskpath"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, 1.85);
      tl.fromTo($("g2-maskpath"), { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, 2.4);
      tl.fromTo($("guide1"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.75);
      tl.fromTo($("guide2"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.85);

      tl.fromTo($("g2"), { stroke: "#888880", opacity: 1 }, { stroke: "#505048", opacity: 0.8, duration: 0.5, ease: "power2.out" }, 4.0);
      tl.fromTo($("guide2"), { opacity: 1 }, { opacity: 0.45, duration: 0.5, ease: "power2.out", immediateRender: false }, 4.0);
      tl.fromTo($("norepeat"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 4.08);

      // Scene 4 (4.6-6.2): lanes recede, year ticker counts 1977 -> 2024
      tl.fromTo($("lanes"), { opacity: 1, scale: 1, transformOrigin: "50% 42%" }, { opacity: 0.16, scale: 0.93, duration: 0.8, ease: "power2.out" }, 4.55);
      tl.fromTo($("kicker"), { opacity: 1 }, { opacity: 0.3, duration: 0.6, ease: "power2.out" }, 4.55);

      // Scene 5 (6.2-end): everything else gone; "nothing." held in stillness
      tl.to($("lanes"), { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.0);
      tl.to($("kicker"), { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.0);
