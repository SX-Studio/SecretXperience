  <div

    >
      <svg

    <!-- Content stage -->

    >

        <defs>

  <script>
    (function () {
      var FID = "10-natural-cause";
      var SVGNS = "http://www.w3.org/2000/svg";
      var byId = function (s) {
        return document.getElementById(FID + "-" + s);
      };

      // ---------- deterministic PRNG (fixed seed; no Math.random, no clocks) ----------
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(19770815);
      function gauss() {
        var u = 1 - rand();
        var v = rand();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }
      function dot(parent, x, y, r, fill, op) {
        var c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("fill", fill);
        c.setAttribute("opacity", op.toFixed(3));
        parent.appendChild(c);
        return c;
      }

      // ---------- geometry ----------
      var CX = 600, CY = 730;        // cloud center (~0.38H)
      var SX = 150, SY = 92;         // main cloud spread (~60% width)
      var MX = 118, MY = 730;        // magnetar
      var CREAM = "#F0ECE5", HINT = "#505048";

      // ---------- starfield (background, dim) ----------
      var stars = byId("stars");
      for (var i = 0; i < 230; i++) {
        var sx = rand() * 1080;
        var sy = rand() * 1920;
        var tier = rand();
        var sr = tier < 0.8 ? 0.7 + rand() * 0.6 : 1.3 + rand() * 0.9;
        var sop = tier < 0.8 ? 0.10 + rand() * 0.18 : 0.25 + rand() * 0.2;
        dot(stars, sx, sy, sr, rand() < 0.3 ? HINT : CREAM, sop);
      }

      // ---------- hydrogen cloud (foreground subject) ----------
      var cloud = byId("cloud");
      var SHELLS = 5;
      var shells = [];
      for (var s = 0; s < SHELLS; s++) {
        var g = document.createElementNS(SVGNS, "g");
        cloud.appendChild(g);
        shells.push(g);
      }
      var lumps = [
        { x: CX, y: CY, sx: SX, sy: SY, w: 0.55 },
        { x: 480, y: 702, sx: 92, sy: 70, w: 0.18 },
        { x: 728, y: 762, sx: 100, sy: 64, w: 0.17 },
        { x: 640, y: 660, sx: 82, sy: 50, w: 0.10 }
      ];
      var placed = 0, guard = 0;
      while (placed < 1050 && guard < 6000) {
        guard++;
        var pick = rand(), acc = 0, L = lumps[0];
        for (var k = 0; k < lumps.length; k++) {
          acc += lumps[k].w;
          if (pick <= acc) { L = lumps[k]; break; }
        }
        var x = L.x + gauss() * L.sx;
        var y = L.y + gauss() * L.sy;
        var nd = Math.sqrt(Math.pow((x - CX) / SX, 2) + Math.pow((y - CY) / SY, 2));
        if (nd > 2.4) continue;
        var dens = Math.exp(-(nd * nd) / 2);
        var op = 0.08 + dens * (0.22 + rand() * 0.34);
        var r = 0.9 + rand() * 1.6 + dens * 0.6;
        var shell = Math.min(SHELLS - 1, Math.floor(nd / 0.5));
        dot(shells[shell], x, y, r, CREAM, op);
        placed++;
      }

      // ---------- narrow band along the magnetar's line of sight ----------
      var band = byId("band");
      var bandDots = [];
      for (var b = 0; b < 180; b++) {
        var bx = CX + gauss() * 165;
        if (bx < 290 || bx > 915) { b--; continue; }
        var by = CY + gauss() * 4.2;
        var br = 1.3 + rand() * 1.5;
        var c = dot(band, bx, by, br, CREAM, 0);
        bandDots.push({ el: c, d: Math.sqrt((bx - MX) * (bx - MX) + (by - MY) * (by - MY)) });
      }

      // ---------- kicker chars (typewriter) ----------
      var kicker = byId("kicker");
      var KTEXT = "2024 · MÉNDEZ ET AL. · PROPOSED";
      var kchars = [];
      for (var q = 0; q < KTEXT.length; q++) {
        var sp = document.createElement("span");
        sp.textContent = KTEXT.charAt(q);
        kicker.appendChild(sp);
        kchars.push(sp);
      }

      // ---------- timeline ----------
      var tl = gsap.timeline({ paused: true });
      var DUR = 8.671;

      // Macro camera: slow push-in on the cloud for the whole shot
      tl.fromTo(byId("cam"),
        { scale: 1, svgOrigin: CX + " " + CY },
        { scale: 1.06, svgOrigin: CX + " " + CY, duration: DUR, ease: "none" }, 0);
      // Background drift
      tl.fromTo(stars, { y: 0 }, { y: -14, duration: DUR, ease: "none" }, 0);

      // Scene 1 (0.0–2.6): rule + kicker types on; cloud cluster -> outward expansion, dim
      tl.fromTo(byId("rule"),
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.1);
      tl.fromTo(kchars,
        { opacity: 0 },
        { opacity: 1, duration: 0.01, stagger: 0.036, ease: "none" }, 0.25);

      tl.fromTo(cloud, { opacity: 0.0 }, { opacity: 0.72, duration: 1.2, ease: "power2.out" }, 0.05);
      for (var sh = 0; sh < SHELLS; sh++) {
        tl.fromTo(shells[sh],
          { scale: 0.22 + sh * 0.06, opacity: 0, svgOrigin: CX + " " + CY },
          { scale: 1, opacity: 1, svgOrigin: CX + " " + CY, duration: 1.9, ease: "expo.out" },
          0.08 + sh * 0.16);
      }

      // Scene 2 (2.6–4.4): "A hydrogen cloud" — label + cloud steps up to full
      tl.to(cloud, { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.6);
      tl.fromTo(byId("cloud-label"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.75);

      // Scene 3 (4.4–6.6): magnetar flashes; one ring travels to the cloud; band lights & decays
      var TF = 4.42;
      tl.fromTo(byId("mag-core"),
        { opacity: 0, scale: 0, svgOrigin: MX + " " + MY },
        { opacity: 1, scale: 1, svgOrigin: MX + " " + MY, duration: 0.18, ease: "back.out(3)" }, TF);
      tl.fromTo(byId("mag-flash"),
        { opacity: 0.95, scale: 0.4, svgOrigin: MX + " " + MY },
        { opacity: 0, scale: 2.2, svgOrigin: MX + " " + MY, duration: 0.45, ease: "power2.out" }, TF + 0.06);
      tl.fromTo(byId("mag-pulse"),
        { opacity: 1, attr: { r: 10 } },
        { opacity: 0, attr: { r: 52 }, duration: 0.7, ease: "power2.out" }, TF + 0.08);
      tl.fromTo(byId("mag-tick"),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" }, TF + 0.2);
      tl.fromTo(byId("mag-label"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, TF + 0.25);

      // The single finite ring: r follows power1.out so band hits can be solved exactly
      var T0 = 4.55, RD = 1.7, RMAX = 880;
      tl.fromTo(byId("ring"),
        { attr: { r: 8 } },
        { attr: { r: RMAX }, duration: RD, ease: "power1.out" }, T0);
      tl.fromTo(byId("ring"),
        { opacity: 0.95, attr: { "stroke-width": 3 } },
        { opacity: 0, attr: { "stroke-width": 1.2 }, duration: RD, ease: "power2.in" }, T0);

      for (var n = 0; n < bandDots.length; n++) {
        var bd = bandDots[n];
        // power1.out: r(p) = R * (1 - (1-p)^2)  ->  p = 1 - sqrt(1 - d/R)
        var p = 1 - Math.sqrt(Math.max(0, 1 - bd.d / RMAX));
        var th = T0 + p * RD;
        tl.fromTo(bd.el, { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power1.out" }, th);
        tl.to(bd.el, { opacity: 0.3, duration: 1.3, ease: "power2.out" }, th + 0.1);
      }

      // Scene 4 (6.6–8.67): "maybe." lands below the cloud; hold
      tl.fromTo(byId("maybe"),
        { opacity: 0, y: 34, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.75, ease: "power3.out" }, 6.8);

      window.__timelines[FID] = tl;
    })();
  </script>
