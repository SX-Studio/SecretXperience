  <script>
    (function () {
      var FID = "11-heard-it-once";
      var DUR = 4.767;
      var root = document.querySelector('[data-composition-id="' + FID + '"]');
      var byId = function (s) {
        return document.getElementById(FID + "-" + s);
      };

      // ── deterministic starfield (seeded PRNG, fixed seed; no Math.random) ──
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = mulberry32(1977815);
      var svg = byId("stars");
      var NS = "http://www.w3.org/2000/svg";
      var W = 1166,
        H = 2074,
        COUNT = 240;
      var stars = [];
      for (var i = 0; i < COUNT; i++) {
        var tier = rand();
        var r = tier < 0.72 ? 0.9 + rand() * 0.8 : tier < 0.95 ? 1.8 + rand() * 0.9 : 2.9 + rand() * 0.9;
        var c = document.createElementNS(NS, "circle");
        c.setAttribute("cx", (rand() * W).toFixed(1));
        c.setAttribute("cy", (rand() * H).toFixed(1));
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("fill", "#F0ECE5");
        var base = 0.35 + rand() * 0.65;
        c.setAttribute("opacity", base.toFixed(2));
        svg.appendChild(c);
        stars.push({ el: c, base: base, big: tier >= 0.72 });
      }

      var tl = gsap.timeline({ paused: true });

      // ── macro move: slow sky drift + push running under the whole shot ──
      tl.fromTo(
        byId("sky-drift"),
        { y: 0, scale: 1 },
        { y: -56, scale: 1.05, duration: DUR, ease: "sine.inOut" },
        0
      );
      tl.fromTo(
        byId("stack"),
        { y: 14 },
        { y: -10, duration: DUR, ease: "sine.inOut" },
        0
      );

      // ── finite, seeded twinkle on a handful of brighter stars (no repeat / yoyo) ──
      var tw = 0;
      for (var s = 0; s < stars.length && tw < 16; s++) {
        if (!stars[s].big) continue;
        tw++;
        var st = stars[s];
        var t0 = 0.2 + rand() * (DUR - 1.4);
        var d = 0.35 + rand() * 0.35;
        var lo = Math.max(0.12, st.base * 0.25);
        tl.to(st.el, { attr: { opacity: lo }, duration: d, ease: "sine.inOut" }, t0);
        tl.to(st.el, { attr: { opacity: st.base }, duration: d, ease: "sine.inOut" }, t0 + d);
      }

      // ── Scene 1 (0.0–2.4s): "72 s" chip fades up on "seventy-two" (VO 0.40s) ──
      tl.fromTo(
        byId("chip-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power3.out" },
        0.12
      );
      tl.fromTo(
        byId("chip-num"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.3
      );
      tl.fromTo(
        byId("chip-unit"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.5
      );

      // line 1 per-word reveal — word cues: the 1.44 · sky 1.60 · got 1.92 · loud 2.16
      var l1 = root.getElementsByClassName(FID + "-l1");
      var l1Cues = [1.38, 1.54, 1.86, 2.1];
      for (var a = 0; a < l1.length; a++) {
        tl.fromTo(

          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power3.out" },
          l1Cues[a]
        );
      }

      // ── Scene 2 (2.4–4.767s): line 2 per-word reveal — we 3.04 · only 3.20 · heard 3.36 · it 3.68 · once. 3.84 ──
      var l2 = root.getElementsByClassName(FID + "-l2");
      var l2Cues = [2.98, 3.14, 3.3, 3.62, 3.78];
      for (var b = 0; b < l2.length; b++) {
        var isOnce = b === l2.length - 1;
        tl.fromTo(
          l2[b],
          isOnce
            ? { opacity: 0, y: 60, scale: 1.14, filter: "blur(18px)" }
            : { opacity: 0, y: 56, filter: "blur(16px)" },
          isOnce
            ? { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }
            : { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
          l2Cues[b]
        );

      tl.to(byId("chip"), { opacity: 0.6, duration: 0.6, ease: "sine.inOut" }, 3.9);
