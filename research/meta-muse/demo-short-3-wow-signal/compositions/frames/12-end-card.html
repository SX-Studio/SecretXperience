  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";
      var FRAME_ID = "12-end-card";
      var DURATION = 4.084;
      var $ = function (suffix) {
        return document.getElementById(FRAME_ID + "-" + suffix);
      };

      // ---- Starfield: seeded deterministic PRNG (mulberry32, fixed seed). ----
      var seed = 0x6e0a15;
      function rand() {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      var svgNS = "http://www.w3.org/2000/svg";
      var stars = $("stars");
      for (var i = 0; i < 190; i++) {
        var c = document.createElementNS(svgNS, "circle");
        var x = rand() * 1080;
        var y = rand() * 1920;
        var size = rand();
        var r = 0.9 + size * size * size * 2.6;
        var o = 0.45 + rand() * 0.55;
        c.setAttribute("cx", x.toFixed(1));
        c.setAttribute("cy", y.toFixed(1));
        c.setAttribute("r", r.toFixed(2));
        c.setAttribute("fill", "#f0ece5");
        c.setAttribute("fill-opacity", o.toFixed(2));
        stars.appendChild(c);
      }

      var colWrap = $("colwrap");
      var ringPath = $("ring-path");
      var rule = $("rule");
      var title = $("title");
      var meta = $("meta");
      var black = $("black");

      // Dash reveal from measured length (never pathLength); fallback keeps it seek-safe.
      var len = 0;
      try {
        len = ringPath.getTotalLength();
      } catch (e) {
        len = 0;
      }
      if (!(len > 0)) len = 300;
      ringPath.style.strokeDasharray = String(len);
      gsap.set(ringPath, { strokeDashoffset: len, opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.2s): column fades up at centre; the orange circle self-draws around it.
      tl.fromTo(
        colWrap,
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" },
        0
      );
      tl.set(ringPath, { opacity: 1 }, 0.32);
      tl.fromTo(
        ringPath,
        { strokeDashoffset: len },
        { strokeDashoffset: 0, duration: 0.88, ease: "power2.inOut" },
        0.32
      );

      // Scene 2 (1.2–2.2s): rule stub, title and mono line fade up below.
      tl.fromTo(
        rule,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out", transformOrigin: "50% 50%" },
        1.2
      );
      tl.fromTo(
        title,
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        1.26
      );
      tl.fromTo(
        meta,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        1.58
      );

      // Scene 3 (2.2s–end): absolute stillness, then the film's only real exit —
      // the whole frame fades to black over the last 1.2 s.
      tl.fromTo(
        black,
        { opacity: 0 },
        { opacity: 1, duration: 1.2, ease: "sine.inOut" },
        DURATION - 1.2
      );

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
