<template>
  <style>
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-400.woff2") format("woff2");font-weight:400;font-style:normal;}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-500.woff2") format("woff2");font-weight:500;font-style:normal;}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-600.woff2") format("woff2");font-weight:600;font-style:normal;}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-700.woff2") format("woff2");font-weight:700;font-style:normal;}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-800.woff2") format("woff2");font-weight:800;font-style:normal;}
@font-face{font-family:"Barlow";src:url("assets/fonts/Barlow-900.woff2") format("woff2");font-weight:900;font-style:normal;}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-400.woff2") format("woff2");font-weight:400;font-style:normal;}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-500.woff2") format("woff2");font-weight:500;font-style:normal;}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-600.woff2") format("woff2");font-weight:600;font-style:normal;}
@font-face{font-family:"IBM Plex Mono";src:url("assets/fonts/IBMPlexMono-700.woff2") format("woff2");font-weight:700;font-style:normal;}

    
    #root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #overlay-transit-band {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 54px;
      height: 104px;
    }
    #overlay-transit-chip {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.14em;
      color: #f0ece5;
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }
    #overlay-transit-chip .accent {
      color: #e85d26;
    }
    #overlay-transit-label {
      position: absolute;
      right: 0;
      top: 0;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.14em;
      color: #888880;
    }
    #overlay-transit-svg {
      position: absolute;
      left: 0;
      top: 42px;
      width: 960px;
      height: 62px;
      overflow: visible;
    }
  </style>
  <div id="root" data-composition-id="overlay-transit" data-width="1080" data-height="1920" data-duration="72">
    <div id="overlay-transit-band">
      <div id="overlay-transit-chip"><span class="accent">T+</span> <span id="overlay-transit-time">00.0</span> S / 72.0</div>
      <div id="overlay-transit-label">BEAM TRANSIT</div>
      <svg id="overlay-transit-svg" viewBox="0 0 960 62">
        <line id="overlay-transit-base" x1="0" y1="60" x2="960" y2="60" stroke="#505048" stroke-width="2" />
        <path id="overlay-transit-ghost" d="" fill="none" stroke="#505048" stroke-width="2" />
        <path id="overlay-transit-curve" d="" fill="none" stroke="#e85d26" stroke-width="3" />
        <circle id="overlay-transit-dot" cx="0" cy="60" r="6" fill="#e85d26" />
      </svg>
    </div>
  </div>
  <script>
    (function () {
      var DUR = 72;
      var W = 960;
      var H = 56;
      // Antenna response over the 72 s transit: a Gaussian peaking at 36 s.
      function yAt(x) {
        var u = (x / W - 0.5) / 0.16;
        return 60 - H * Math.exp(-0.5 * u * u);
      }
      var d = "";
      for (var i = 0; i <= 240; i++) {
        var x = (i / 240) * W;
        d += (i ? "L" : "M") + x.toFixed(1) + " " + yAt(x).toFixed(2) + " ";
      }
      var ghost = document.getElementById("overlay-transit-ghost");
      var curve = document.getElementById("overlay-transit-curve");
      ghost.setAttribute("d", d);
      curve.setAttribute("d", d);
      ghost.setAttribute("stroke-dasharray", "3 7");
      var len = curve.getTotalLength();
      curve.setAttribute("stroke-dasharray", len + " " + len);

      var timeEl = document.getElementById("overlay-transit-time");
      var dot = document.getElementById("overlay-transit-dot");
      var state = { p: 0 };

      function render() {
        var p = state.p;
        var x = p * W;
        // dash offset by arc length: sample the path at the matching x via a linear search table
        curve.setAttribute("stroke-dashoffset", (len * (1 - arcFrac(p))).toFixed(2));
        dot.setAttribute("cx", x.toFixed(2));
        dot.setAttribute("cy", yAt(x).toFixed(2));
        var s = (p * DUR).toFixed(1);
        timeEl.textContent = (s.length < 4 ? "0" + s : s);
      }

      // arc-length fraction for a given x-progress (precomputed, deterministic)
      var table = [0];
      var acc = 0;
      for (var k = 1; k <= 240; k++) {
        var x0 = ((k - 1) / 240) * W, x1 = (k / 240) * W;
        acc += Math.hypot(x1 - x0, yAt(x1) - yAt(x0));
        table.push(acc);
      }
      function arcFrac(p) {
        var f = p * 240, i0 = Math.floor(f), i1 = Math.min(240, i0 + 1), r = f - i0;
        return (table[i0] + (table[i1] - table[i0]) * r) / acc;
      }

      var tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(state, { p: 0 }, { p: 1, duration: DUR, ease: "none", onUpdate: render }, 0);
      tl.fromTo("#overlay-transit-band", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power3.out" }, 0.2);
      // Frame 6 (orange register): switch overlay ink to black for legibility, then back.
      tl.to("#overlay-transit-chip", { color: "#111111", duration: 0.05 }, 30.617);
      tl.to("#overlay-transit-chip .accent", { color: "#111111", duration: 0.05 }, 30.617);
      tl.to("#overlay-transit-chip .accent", { color: "#e85d26", duration: 0.05 }, 33.117);
      tl.to("#overlay-transit-label", { color: "rgba(17,17,17,0.55)", duration: 0.05 }, 30.617);
      tl.to(["#overlay-transit-curve", "#overlay-transit-dot"], { attr: { stroke: "#111111" }, fill: "#111111", duration: 0.05 }, 30.617);
      tl.to("#overlay-transit-chip", { color: "#f0ece5", duration: 0.05 }, 33.117);
      tl.to("#overlay-transit-label", { color: "#888880", duration: 0.05 }, 33.117);
      tl.to("#overlay-transit-curve", { attr: { stroke: "#e85d26" }, duration: 0.05 }, 33.117);
      tl.to("#overlay-transit-dot", { fill: "#e85d26", duration: 0.05 }, 33.117);
      // Final exit with the end card's fade.
      tl.to("#overlay-transit-band", { opacity: 0, duration: 1.25, ease: "none" }, 70.6);
      render();
      window.__timelines["overlay-transit"] = tl;
    })();
  </script>
</template>
