<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=800" />
    <script src="assets/sr-engine.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 800px; height: 800px; overflow: hidden; background: #F4C6A3; }
      #root { position: relative; width: 800px; height: 800px; }
      #art { position: absolute; inset: 0; width: 800px; height: 800px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="800" data-height="800" data-no-timeline>
      <svg id="art" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" data-layout-ignore></svg>
    </div>
    <script>
      (function () {
        const { el, Character, PAL, Set } = window.SR;
        const svg = document.getElementById("art");
        const defs = el("defs", {}, svg);
        const lg = el("linearGradient", { id: "asky", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
        el("stop", { offset: "0", "stop-color": "#F4C6A3" }, lg); el("stop", { offset: "1", "stop-color": "#FBE3CC" }, lg);
        el("rect", { x: 0, y: 0, width: 800, height: 800, fill: "url(#asky)" }, svg);
        const cx = 400, cy = 372;
        // the ripple: gold rings spreading from the character, one red ring at the edge
        el("circle", { cx, cy, r: 338, fill: "none", stroke: PAL.rude, "stroke-width": 16, opacity: 0.9 }, svg);
        el("circle", { cx, cy, r: 286, fill: "none", stroke: PAL.kind, "stroke-width": 22, opacity: 0.55 }, svg);
        el("circle", { cx, cy, r: 228, fill: "none", stroke: PAL.kind, "stroke-width": 30 }, svg);
        const fg = el("g", {}, svg);
        const c = Character(fg, { id: "av", color: PAL.teal, hair: "none", seed: 5, scale: 3.9,
          x: [[0, 392]], y: [[0, 1378]], pose: [[0, "proud", 0]], mood: [[0, "happy", 0]], look: [[0, { x: 0.6, y: -0.25 }]] });
        c.update(0.6);
        document.querySelectorAll("#av path[stroke=\"#1E1B22\"], #av circle[r=\"7.5\"]").forEach((n) => n.remove());
        const { Butterfly } = window.SR;
        const a = -52 * Math.PI / 180;
        Butterfly(svg, { x: [[0, cx + Math.cos(a) * 300]], y: [[0, cy + Math.sin(a) * 300]], scale: 1.9, flap: 0, rot: 34 });
        Set.grain(svg, "agrain", 0.05, 800, 800);
      })();
    </script>
  </body>
</html>
