<svg id="ov" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>

document.fonts.ready.then(() => {
  const svg = document.getElementById("ov"), I = INK(svg), { el, INKC, RED } = I;

  const g = el("g", {}, svg), C = CAST(I), mode = new URLSearchParams(location.search).get("n") || "sheet", hs = [];

  if (mode === "sheet") {
    [["nia", 300, "wave", "smile"], ["kai", 780, "fist", "determined"], ["mo", 1260, "pockets", "neutral"], ["rue", 1700, "cheer", "grin"]].forEach(([n, x, p, f]) => { const h = C.make(g, n, x, 960, 1.0, 0); h.key(0, p, 0).face(0, f); hs.push(h); lab(n[0].toUpperCase() + n.slice(1), x, 1050); });

    const a = C.make(g, "kai", 500, 900, 1.0, 0); a.key(0, "pushUp", 0).face(0, "determined"); hs.push(a);
    const b = C.make(g, "kai", 1300, 900, 1.0, 0); b.key(0, "pushDown", 0).face(0, "strain"); hs.push(b);
    const c2 = C.make(g, "kai", 1500, 1060, 0.6, 0); c2.key(0, "flat", 0).face(0, "sad"); hs.push(c2);
    el("line", { x1: 0, x2: 1920, y1: 900, y2: 900, stroke: INKC, "stroke-width": 4 }, svg);
  }
  hs.forEach((h) => h.update(5)); window.READY = true;
});
